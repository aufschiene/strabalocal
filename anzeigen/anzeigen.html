// ---- Farben & Linien Design ------------------------------------------------------------
// Gezeigt wird, was der Stil des GEWAEHLTEN Displays kann. Kann er nichts davon, steht
// das auch so da, statt leere Schalter anzubieten (Paul 22.10.2026).
// Ein Schalter mit Titel und Erklaerung, dasselbe Bauteil wie im Features-Block.
function schalterZeile(titel, text, an, klick) {
  return '<div class="schieber"><div class="wort">' + titel
       + (text ? '<small>' + text + '</small>' : '') + '</div>'
       + '<button class="schiene' + (an ? ' an' : '') + '" role="switch"'
       + ' aria-checked="' + (an ? 'true' : 'false') + '" onclick="' + klick + '">'
       + '<span class="kugel"></span></button></div>';
}

function designZeichnen() {
  const el = document.querySelector('#klappDesign .klapp-koerper');
  if (!el) return;
  const sHier = schirme[zeiger];
  const d = sHier && sHier.display;
  if (!d) { el.innerHTML = '<div class="hinweis">Noch kein Display da.</div>'; return; }
  const c = stilVon(d);
  const k = STIL_KANN[parseInt(c, 10)] || {};
  const e = einstFuer(d);
  const stilName = stilTitel(c);
  const di = displays.indexOf(d);
  let h = '';

  // Eigenes Display: der Baukasten steht im Pop-up und geht Schritt fuer Schritt, wie im
  // alten Konfigurator. Alles auf einmal in der Karte war zu viel auf einmal
  // (Paul 26.10.2026: "sonst zu confusing"). Die Karte zeigt nur, was eingestellt ist.
  if (istEigen(c)) {
    // Ein BESTEHENDES Design wird in der Karte eingestellt, mit allem untereinander:
    // wer schon weiss, was er will, soll nicht durch vier Schritte klicken. Das Pop-up
    // gibt es nur beim ANLEGEN, dort fuehrt es (Paul 26.10.2026).
    el.innerHTML = eigenSchritte(c).map(x =>
      '<label class="feld">' + escapeHtmlFt(x.kurz || x.titel) + '</label>' + x.html).join('');
    if (eigenDialogFuer === c) eigenDialogZeichnen();
    return;
  }

  // Auch die Verspaetung und der Zeichensatz zaehlen: sonst verschluckt der fruehe
  // Ausstieg einen Schalter, sobald ein Stil nur diese kann.
  if (!k.schrift && !k.grund && !k.badges && !k.verspaetung && !k.matrixSchrift) {
    h += '<div class="hinweis">' + escapeHtmlFt(stilName)
       + ' bringt seine Farben fest mit, hier gibt es nichts einzustellen. '
       + 'Wiener Linien, Matrix und Paper White lassen sich f\u00e4rben.</div>';
    el.innerHTML = h;
    return;
  }

  if (k.schrift) {
    const w = SCHRIFT_WAHL[k.schrift];
    h += '<label class="feld">' + w.titel + '</label><div class="farbreihe">';
    w.knoepfe.forEach(b => {
      h += '<button class="' + (e.t === b[0] ? 'an' : '') + '"'
         + ' style="background:' + b[2] + ';color:' + b[3] + '"'
         + ' onclick="schriftSetzen(' + di + ',' + b[0] + ')">'
         + (e.t === b[0] ? '&#10003; ' : '') + b[1] + '</button>';
    });
    h += '</div>';
  }

  if (k.matrixSchrift) {
    h += '<label class="feld">Zeichensatz</label><div class="schalter">';
    MATRIX_SCHRIFT.forEach(b => {
      h += '<button class="' + (e.f === b[0] ? 'an' : '') + '"'
         + ' onclick="matrixSchriftSetzen(' + di + ',' + b[0] + ')">' + b[1] + '</button>';
    });
    h += '</div>'
       + '<div class="hinweis">CZ + HU bringt die tschechischen und ungarischen Zeichen mit, '
       + 'die der DACH-Satz nicht hat. Sonst sind die beiden gleich.</div>';
  }

  if (k.grund) {
    h += '<label class="feld">Hintergrundfarbe</label><div class="farbreihe">'
       + '<button class="' + (e.b === 0 ? 'an' : '') + '" style="background:#000;color:#FFD700"'
       + ' onclick="grundSetzen(' + di + ',0)">' + (e.b === 0 ? '&#10003; ' : '') + 'Schwarz</button>'
       + '<button class="' + (e.b === 1 ? 'an' : '') + '" style="background:#0a3d1f;color:#FFD700"'
       + ' onclick="grundSetzen(' + di + ',1)">' + (e.b === 1 ? '&#10003; ' : '') + 'Gr\u00fcn</button>'
       + '</div>'
       + '<div class="hinweis">Schwarz ist kontrastreicher, Gr\u00fcn schlichter und n\u00e4her am Original.</div>';
  }

  if (k.badges) {
    h += '<label class="feld">Linien-Badges</label><div class="schalter">';
    [[0, 'Aus'], [1, 'Linie'], [2, 'Ganze Zeile']].forEach(b => {
      h += '<button class="' + (e.u === b[0] ? 'an' : '') + '"'
         + ' onclick="badgeSetzen(' + di + ',' + b[0] + ')">' + b[1] + '</button>';
    });
    h += '</div>'
       + '<div class="hinweis">Farbige Linien-K\u00e4stchen in der offiziellen Linienfarbe, '
       + 'wie auf den echten Anzeigen.</div>';
    if (e.u) {
      h += '<div class="kasten"><div class="titelchen">Badges f\u00fcr</div>';
      BADGE_FAHRZEUGE.forEach(bv => {
        h += '<label class="haken-zeile"><input type="checkbox" ' + ((e.v & bv[0]) ? 'checked ' : '')
           + 'onchange="badgeFahrzeugSetzen(' + di + ',' + bv[0] + ',this.checked)">' + bv[1] + '</label>';
      });
      h += '<div class="hinweis">Nur Linien mit hinterlegter Linienfarbe bekommen ein Badge. '
         + 'F\u00fcr die Wiener U-Bahn sind die Farben fest eingebaut.</div></div>';
    }
  }

  // Die Schalter stehen in JEDEM Eintrag und gelten darum je Brett: die Firmware liest
  // sie zuerst aus dem Eintrag und erst dann aus den displaysettings nach Stil
  // (resolveGroupLook). Nur die FARBEN eines eigenen Designs haengen am Stil-Platz,
  // weil sie in der customrow je Slot stehen (26.10.2026).
  const gleiche = displays.filter(x => stilVon(x) === c).length;
  if (gleiche > 1 && istEigen(c)) {
    h += '<div class="hinweis"><b>Die Farben gelten fuer alle ' + gleiche
       + ' Displays mit dem Design ' + escapeHtmlFt(stilName) + '.</b> Die Schalter '
       + 'darunter stellst du je Display getrennt ein.</div>';
  }
  el.innerHTML = h;
}
// ---- Gehweg & Nachtmodus ---------------------------------------------------------------
function gehwegZeichnen() {
  const el = document.querySelector('#klappGehweg .klapp-koerper');
  if (!el) return;
  let h = '';

  h += '<div class="schieber"><div class="wort">Nachtmodus aktivieren'
     + '<small>Display nachts ausschalten</small></div>'
     + '<button class="schiene' + (nacht.an ? ' an' : '') + '" role="switch"'
     + ' aria-checked="' + (nacht.an ? 'true' : 'false') + '" onclick="nachtSchalten()">'
     + '<span class="kugel"></span></button></div>';
  if (nacht.an) {
    const stunden = function (feld, wert) {
      let o = '<select onchange="nachtZeitSetzen(\'' + feld + '\',this.value)">';
      for (let x = 0; x < 24; x++) o += '<option value="' + x + '"' + (x === wert ? ' selected' : '') + '>'
                                     + (x < 10 ? '0' + x : x) + ':00</option>';
      return o + '</select>';
    };
    h += '<div class="reihe" style="align-items:flex-end">'
       + '<div style="flex:1"><label class="feld">Aus ab</label>' + stunden('von', nacht.von) + '</div>'
       + '<div style="flex:1"><label class="feld">Wieder an</label>' + stunden('bis', nacht.bis) + '</div>'
       + '</div>';
  }

  // Eigene Ueberschrift: als Feld-Label gelesen wirkte der Gehweg wie eine Einstellung
  // des Nachtmodus darueber (Paul 22.10.2026).
  h += '<h2 style="margin-top:22px">Gehweg zur Haltestelle</h2>'
     + '<div class="hinweis" style="margin-top:0">Abfahrten unter dieser Minutenzahl werden '
     + 'ausgeblendet.</div>';
  if (!stationen.length) {
    h += '<div class="hinweis">Noch keine Station da.</div>';
    el.innerHTML = h;
    return;
  }
  stationen.forEach((st, si) => {
    const offen = gwOffen.has(st.rbl);
    const abw = Object.keys(st.gehwegLinien || {}).length + Object.keys(st.gehwegRichtungen || {}).length;
    // Wien fuehrt je BAHNSTEIG eine Station, und zwei davon heissen oft gleich. Dann
    // sagt die Richtung, welcher Steig gemeint ist, sonst stehen hier zweimal
    // "Alaudagasse" und man raet (Paul 23.10.2026).
    const gleichNamig = stationen.some((x, xi) => xi !== si && x.name === st.name);
    const woHin = gleichNamig
      ? zeilenEintraege(st).slice(0, 2).map(d => d.line + ' \u2192 ' + d.dest).join(', ')
      : '';
    h += '<div class="gwzeile"><div class="rumpf"><div class="ziel">' + escapeHtmlFt(st.name) + '</div>'
       + '<div class="halt">' + (woHin ? escapeHtmlFt(woHin) + ' &middot; ' : '')
       + (abw ? abw + (abw === 1 ? ' Ausnahme' : ' Ausnahmen')
              : 'gilt f\u00fcr alles an dieser Station') + '</div></div>'
       + '<input type="number" min="0" max="99" value="' + gehwegStation(st) + '"'
       + ' onchange="gehwegStationSetzen(' + si + ',this.value)"> <span class="min">min</span>'
       + '<button class="still klein" onclick="gwGenauer(\'' + st.rbl + '\')">'
       + (offen ? 'fertig' : 'genauer') + '</button></div>';
    if (!offen) return;
    const eintraege = zeilenEintraege(st);
    if (!eintraege.length) h += '<div class="hinweis">Keine Linien geladen.</div>';
    // Nach Ziel buendeln: das ist die Richtung, und am Steig entscheidet sich der Weg.
    const nachZiel = new Map();
    eintraege.forEach(dep => {
      if (!nachZiel.has(dep.dest)) nachZiel.set(dep.dest, []);
      nachZiel.get(dep.dest).push(dep);
    });
    nachZiel.forEach((deps, ziel) => {
      const rWert = gehwegRichtung(st, ziel);
      const badges = deps.slice(0, 4).map(function (d) {
        const f = badgeFarben(d);
        return '<b style="background:' + f.bg + ';color:' + f.fg + '">' + escapeHtmlFt(d.line) + '</b>';
      }).join('');
      h += '<div class="gwzeile tiefer">' + badges
         + '<div class="rumpf"><div class="ziel">&#8594; ' + escapeHtmlFt(ziel) + '</div>'
         + '<div class="halt">' + (rWert != null ? 'eigener Wert f\u00fcr diese Richtung'
                                    : 'wie die Station, ' + gehwegStation(st) + ' min')
         + (deps.length > 1 ? ' &middot; ' + deps.length + ' Linien' : '') + '</div></div>'
         + '<input type="number" min="0" max="99" placeholder="' + gehwegStation(st) + '"'
         + ' value="' + (rWert != null ? rWert : '') + '"'
         + ' onchange="gehwegRichtungSetzen(' + si + ',\'' + String(ziel).replace(/'/g, "\\'") + '\',this.value)">'
         + ' <span class="min">min</span></div>';
      // Einzelne Linien nur, wenn in dieser Richtung ueberhaupt mehrere fahren.
      if (deps.length < 2) return;
      deps.forEach(dep => {
        const k = dep.line + '|' + dep.dest;
        const eigen = (st.gehwegLinien || {})[k];
        const erbt = (rWert != null) ? rWert : gehwegStation(st);
        const f = badgeFarben(dep);
        h += '<div class="gwzeile tiefer2">'
           + '<b style="background:' + f.bg + ';color:' + f.fg + '">' + escapeHtmlFt(dep.line) + '</b>'
           + '<div class="rumpf"><div class="halt">'
           + (eigen != null ? 'eigener Wert' : 'wie die Richtung, ' + erbt + ' min') + '</div></div>'
           + '<input type="number" min="0" max="99" placeholder="' + erbt + '"'
           + ' value="' + (eigen != null ? eigen : '') + '"'
           + ' onchange="gehwegLinieSetzen(' + si + ',\'' + k.replace(/'/g, "\\'") + '\',this.value)">'
           + ' <span class="min">min</span></div>';
      });
    });
  });
  h += '<div class="hinweis">Leer lassen heisst: der Wert kommt von der Stufe dar\u00fcber. '
     + 'Das Ger\u00e4t kann heute nur den Wert je Station, Richtung und Linie brauchen noch '
     + 'einen neuen Firmware-Token.</div>';
  el.innerHTML = h;
}

// ---- Features -----------------------------------------------------------------
// Nur Wien hat das (DISPLAY_TYPE_FEATURES chopper und silberpfeil). Bei allen anderen
// Stilen verschwindet der ganze Block, statt leer dazustehen (Paul 22.10.2026).
function fahrzeugZeichnen() {
  const block = document.getElementById('klappFahrzeug');
  const el = block && block.querySelector('.klapp-koerper');
  if (!el) return;
  const sHier = schirme[zeiger];
  const d = sHier && sHier.display;
  const c = d ? stilVon(d) : 0;
  const k = STIL_KANN[parseInt(c, 10)] || {};
  const kann = k.fahrzeug || k.verspaetung || k.blinken;
  block.style.display = kann ? '' : 'none';
  if (!kann) { block.classList.remove('offen'); return; }
  const e = einstFuer(d);
  const di = displays.indexOf(d);
  const unter = document.getElementById('featuresUnter');
  if (unter) {
    const worte = [];
    if (k.blinken) worte.push('Blinken bei 0');
    if (k.verspaetung) worte.push('Versp\u00e4tung');
    if (k.fahrzeug) worte.push('Hochflurer, Niederflur, Klimaanlage');
    unter.textContent = worte.join(', ');
  }
  const schieber = function (wort, zusatz, an, ruf) {
    return '<div class="schieber"><div class="wort">' + wort
         + (zusatz ? '<small>' + zusatz + '</small>' : '') + '</div>'
         + '<button class="schiene' + (an ? ' an' : '') + '" role="switch" aria-checked="' + (an ? 'true' : 'false')
         + '" onclick="' + ruf + '"><span class="kugel"></span></button></div>';
  };
  let h = '';
  // Blinken bei 0, nur Matrix. Kommt am Geraet mit 2.6, aeltere Firmware ueberliest
  // das Feld o folgenlos (Paul 23.10.2026).
  if (k.blinken) {
    // Jeder Knopf zeigt klein, was er tut. Das ersetzt den erklaerenden Satz
    // (Paul 23.10.2026: "einfach im Toggle das zeigen").
    const look = uhrLook(c, d) || { bg: '#000000', fg: '#ffffff' };
    const probe = function (txt, blinkt) {
      const inner = (typeof dvLedTextSvg === 'function') ? dvLedTextSvg(txt, 2, look.fg, true)
                                                         : escapeHtmlFt(txt);
      return '<span class="bprobe" style="background:' + look.bg + '">'
           + '<span class="' + (blinkt ? 'blinkt' : '') + '">' + inner + '</span></span>';
    };
    h += '<label class="feld">Wenn eine Abfahrt bei 0 steht ' + neuBadge('blinken')
       + '</label><div class="schalter">';
    [[0, 'Still', probe('0', false)],
     [1, '0 blinkt', probe('0', true)],
     [2, 'Wie in Berlin', probe('Ziel', true)]].forEach(b => {
      h += '<button class="' + (e.o === b[0] ? 'an' : '') + '"'
         + ' onclick="blinkenSetzen(' + di + ',' + b[0] + ')">' + b[1] + b[2] + '</button>';
    });
    h += '</div>';
  }
  if (k.verspaetung) {
    h += schieber('Versp\u00e4tung herausstechend',
                  'Zeigt "+X" farbig und f\u00e4rbt die Abfahrtszeit',
                  e.d === 1, 'verspaetungSchalten(' + di + ')');
  }
  if (k.fahrzeug) {
    h += schieber('Hochflurer markieren', '', e.h === 1, 'fzSetzen(' + di + ',\'h\')');
    if (e.h === 1) {
      h += schieber('Niederflur-Hinweis blinken',
                    'Markierung pulsiert, wenn ein Niederflur-Fahrzeug naht',
                    e.n === 1, 'fzSetzen(' + di + ',\'n\')');
    }
    h += schieber('Bim+U-Bahn Klima Anzeige', 'Alle Busse in Wien sind schon klimatisiert.',
                  e.k === 1, 'fzSetzen(' + di + ',\'k\')');
  }
  el.innerHTML = h;
}
function fzSetzen(di, feld) {
  const e = einstFuer(displays[di]);
  e[feld] = e[feld] ? 0 : 1;
  allesZeichnen();
}

// Alle Setzer bekommen die Nummer des DISPLAYS, nicht mehr die colour.
function schriftSetzen(di, v) { einstFuer(displays[di]).t = parseInt(v, 10); allesZeichnen(); }
function grundSetzen(di, v) { einstFuer(displays[di]).b = parseInt(v, 10); allesZeichnen(); }
function badgeSetzen(di, v) { einstFuer(displays[di]).u = parseInt(v, 10); allesZeichnen(); }
function blinkenSetzen(di, v) { einstFuer(displays[di]).o = parseInt(v, 10); allesZeichnen(); }

function badgeFahrzeugSetzen(di, bit, an) {
  const e = einstFuer(displays[di]);
  e.v = an ? (e.v | bit) : (e.v & ~bit);
  // Ganz ohne Fahrzeugart bekaeme nichts ein Badge. Dann lieber die Badges ausschalten.
  if (!e.v) { e.v = 4; e.u = 0; }
  allesZeichnen();
}

// Klappbloecke: immer nur einer offen, sonst scrollt man sich tot (Paul 22.10.2026).
function klappSchalten(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const wirdOffen = !el.classList.contains('offen');
  document.querySelectorAll('.klapp.offen').forEach(x => x.classList.remove('offen'));
  if (!wirdOffen) return;
  el.classList.add('offen');
  // Beim Zuklappen des vorherigen rutscht die Seite, darum den neuen Kopf herholen.
  const kopf = el.querySelector('.klapp-kopf');
  if (kopf) kopf.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ---- Eigener Dialog --------------------------------------------------------------------
// Statt alert und confirm: gleiche Schrift, gleiche Kanten, und vor allem freie Knoepfe,
// damit der Dialog gleich einen Ausweg anbieten kann (Paul 22.10.2026).
function matrixSchriftSetzen(di, wert) { einstFuer(displays[di]).f = wert; allesZeichnen(); }
function verspaetungSchalten(di) { const e = einstFuer(displays[di]); e.d = e.d ? 0 : 1; allesZeichnen(); }
function wechselSetzen(di, welches, sekunden) {
  const e = einstFuer(displays[di]);
  e[welches] = Math.round(Math.max(WECHSEL_MIN, Math.min(WECHSEL_MAX, sekunden)) * 10);
  allesZeichnen();
}
function wechselAutomatik(di, automatisch) {
  const e = einstFuer(displays[di]);
  if (automatisch) { e.x = 0; e.y = 0; } else { e.x = e.x || 40; e.y = e.y || 30; }
  e.x = e.x && Math.min(WECHSEL_MAX * 10, Math.max(WECHSEL_MIN * 10, e.x));
  e.y = e.y && Math.min(WECHSEL_MAX * 10, Math.max(WECHSEL_MIN * 10, e.y));
  allesZeichnen();
}
function standzeitSetzen(di, sekunden) {
  const d = displays[di];
  const e = einstFuer(d);
  const mind = zeigtUhr(d) ? STANDZEIT_MIN_UHR : standzeitMindestens(e);
  e.i = Math.max(mind, Math.min(STANDZEIT_MAX, parseInt(sekunden, 10) || 0));
  allesZeichnen();
}
// Helligkeit gilt fuers ganze Geraet, nicht je Display: die Firmware kennt sie als eine
// Einstellung (1 dunkel, 2 mittel, 3 hell).
function helligkeitSetzen(wert) { helligkeit = wert; allesZeichnen(); }

function dialogZeigen(titel, text, knoepfe, art, inhalt) {
  const schleier = document.getElementById('schleier');
  const sinn = document.getElementById('dlgSinn');
  sinn.className = 'sinn ' + (art === 'doppelt' ? 'doppelt' : 'warnung');
  sinn.innerHTML = DLG_SINN[art] || DLG_SINN.warnung;
  document.getElementById('dlgTitel').textContent = titel;
  document.getElementById('dlgText').textContent = text;
  document.getElementById('dlgInhalt').innerHTML = inhalt || '';
  const k = document.getElementById('dlgKnoepfe');
  k.innerHTML = '';
  knoepfe.forEach(b => {
    const el = document.createElement('button');
    el.textContent = b.text;
    if (b.still) el.className = 'still';
    if (b.aus) el.disabled = true;
    el.onclick = () => { if (!b.offen) schleier.classList.remove('an'); if (b.tun) b.tun(); };
    k.appendChild(el);
  });
  schleier.classList.add('an');
}
function sagen(titel, text) { dialogZeigen(titel, text, [{ text: 'Alles klar' }]); }

// ---- Bedienung -----------------------------------------------------------------------
// Alles, was von dieser Station auf dem Display liegt, dort herunternehmen. In der
// Ansicht nach Abfahrt steht die Station als EINE Karte da, also nimmt das x auch die
// ganze Station. Einzelne Linien holt man sich danach wieder aus dem Topf darunter.
// Eine Station als EINE Zeile fuehren statt ihrer Linien, oder zurueck. Die Auswahl
// der Linien bleibt dabei erhalten, sie liegt in st.gewaehlt und kommt beim Zurueck-
// schalten wieder. "Alle Abfahrten" und Zug-Verbindungen sind ohnehin Stations-Zeilen.
// Der Schalter in der Ueberschrift meint die HALTESTELLE, also alle ihre Bahnsteige.
function halteAlsBlock(si, an) {
  const st = stationen[si];
  if (!st) return;
  const name = String(st.name || '').trim().toLowerCase() + '\u0001' + (st.netz || '');
  stationen.forEach((x, xi) => {
    if (String(x.name || '').trim().toLowerCase() + '\u0001' + (x.netz || '') === name) {
      stationAlsBlock(xi, an, true);
    }
  });
  allesZeichnen();
}

function stationAlsBlock(si, an, stillt) {
  const st = stationen[si];
  if (!st || istZugStation(st)) return;
  if (st.alleFix && !an) return;   // ohne Linienauswahl gibt es nichts aufzuloesen
  const meins = k => { const m = /^(\d+)\u00a7/.exec(String(k)); return m && parseInt(m[1], 10) === si; };
  // WO lagen die Zeilen dieser Station, und an welcher Stelle? Dort steht gleich die neue
  // Zeile. Sonst verschwindet sie beim Umschalten und taucht irgendwo wieder auf
  // (Paul 26.10.2026: "soll die Zeile nicht wie jetzt verschwinden").
  let zielBrett = -1, stelle = 0;
  displays.forEach((d, di) => {
    const i = (d.richtungen || []).findIndex(meins);
    if (i >= 0 && zielBrett < 0) { zielBrett = di; stelle = i; }
  });
  st.alle = !!an;
  displays.forEach(d => {
    d.richtungen = (d.richtungen || []).filter(x => !meins(x));
    gruppenPruefen(d);
  });
  // Die neuen Zeilen an dieselbe Stelle legen.
  const neu = zeilenEintraege(st).map(dep => zeilenKey(si, dep));
  if (zielBrett >= 0 && displays[zielBrett]) {
    displays[zielBrett].richtungen.splice(stelle, 0, ...neu);
    displays[zielBrett].vomNutzer = true;
    neu.forEach(k => abgelegt.delete(k));
  } else {
    // Lag die Station auf KEINEM Display, bleibt sie auch danach im Topf. Sonst legt die
    // automatische Verteilung sie ungefragt auf ein Brett, nur weil man die Darstellung
    // umgestellt hat (Paul 26.10.2026).
    neu.forEach(k => abgelegt.add(k));
  }
  if (!stillt) allesZeichnen();
}

// ACHTUNG: NICHT stationWeg nennen, das gibt es schon und loescht die Station ganz aus
// der Auswahl. Diese hier nimmt sie nur vom Brett. Gleicher Name hiess: die spaetere
// Definition gewinnt, und das x an der Stations-Karte loeschte die Station samt ihrer
// Linienauswahl (Paul 26.10.2026, Linz Unionkreuzung).
function stationVomBrett(di, si) {
  const d = displays[di];
  const st = stationen[si];
  if (!d || !st) return;
  d.richtungen.filter(k => {
    const r = richtungFinden(k);
    return r && r.station === st;
  }).forEach(k => richtungSchalten(di, k, false));
}

// Die Zeilen-Aufteilung, wie sie VOR dem Umschalten auf "Nach Abfahrt/Station" stand.
// Nach Abfahrt gibt es keine Zeilenfolge, und wer dabei alles auf ein Brett holt, haette
// seine Anordnung sonst endgueltig verloren. Hin und her schalten darf nichts kosten
// (Paul 26.10.2026: "das ich durchswitchen und nicht alles geloescht ist").
let linienAufteilung = null;
function aufteilungSichern() {
  if (linienAufteilung) return;        // nur die ERSTE Sicherung zaehlt
  linienAufteilung = displays.map(d => ({
    richtungen: (d.richtungen || []).slice(),
    gruppen: (d.gruppen || []).map(g => g.slice()),
    stil: d.stil, einst: Object.assign({}, d.einst || {}),
    vomNutzer: !!d.vomNutzer, sortierung: d.sortierung
  }));
}
function aufteilungZurueck() {
  if (!linienAufteilung) return false;
  displays = linienAufteilung.map(x => ({
    richtungen: x.richtungen.slice(),
    gruppen: x.gruppen.map(g => g.slice()),
    stil: x.stil, einst: Object.assign({}, x.einst),
    vomNutzer: x.vomNutzer, sortierung: 'statisch'
  }));
  linienAufteilung = null;
  zeiger = 0;
  return true;
}

function sortierungSetzen(di, wert) {
  const d = displays[di];
  if (!d) return;
  // Zurueck auf "Nach Linie": die gesicherte Aufteilung wieder herstellen.
  if (wert !== 'zeit' && aufteilungZurueck()) { allesZeichnen(); return; }
  if (wert === 'zeit') aufteilungSichern();
  d.sortierung = wert;
  allesZeichnen();
  // Auf "Naechste Abfahrten" passt alles auf EIN Brett. Wer umschaltet, will meist
  // genau das: eine Liste nach Uhrzeit statt mehrerer Bretter (Kundenmeldung Bernd,
  // 25.10.2026). Darum einmal fragen, statt ihn jede Linie einzeln holen zu lassen.
  if (wert !== 'zeit') return;
  const andere = displays.filter((x, xi) => xi !== di && x.richtungen.some(k => !istUhrKey(k)));
  if (!andere.length) return;
  let zahl = 0;
  andere.forEach(x => x.richtungen.forEach(k => { if (!istUhrKey(k)) zahl++; }));
  dialogZeigen('Alle Linien hierher holen?',
    'Dieses Display sortiert jetzt nach Abfahrt, also nach Uhrzeit. Dabei darf es '
    + 'beliebig viele Linien tragen. Sollen die ' + zahl + ' Linien von den anderen '
    + (andere.length === 1 ? 'Display' : 'Displays') + ' mit hierher?',
    [{ text: 'Nein, so lassen', still: true },
     { text: 'Alle hierher', tun: function () { alleHierher(di); } }],
    'doppelt');
}

// Alle Linien der uebrigen Bretter auf dieses holen. Bretter, die der Nutzer selbst
// angelegt hat, bleiben unberuehrt; leere fallen beim Zeichnen ohnehin weg.
function alleHierher(di) {
  const d = displays[di];
  if (!d) return;
  displays.forEach((x, xi) => {
    if (xi === di) return;
    x.richtungen.filter(k => !istUhrKey(k)).forEach(k => {
      if (d.richtungen.indexOf(k) < 0) d.richtungen.push(k);
    });
    x.richtungen = x.richtungen.filter(k => istUhrKey(k));
    gruppenPruefen(x);
  });
  d.vomNutzer = true;
  zeiger = 0;
  allesZeichnen();
}
function zeitZeilenSetzen(di, wert) {
  const d = displays[di];
  if (!d) return;
  d.zeilen = parseInt(wert, 10) || 3;
  allesZeichnen();
}

function stilSetzen(v) {
  // zeiger ist die SEITE, nicht das Display. Ein Display mit mehreren Seiten haette
  // sonst den Stil der falschen Zeile bekommen.
  const sHier = schirme[zeiger];
  const d = sHier ? displays[sHier.index] : null;
  if (v === 'neu') {
    const frei = eigenFrei();
    if (!frei) {
      dialogZeigen('Kein Platz mehr',
        'Mehr als ' + (EIGEN_MAX - EIGEN_MIN + 1) + ' eigene Designs kann das Ger\u00e4t nicht halten. '
        + 'W\u00e4hle eines der vorhandenen aus oder \u00e4ndere es.',
        [{ text: 'Alles klar' }], 'warnung');
      allesZeichnen();
      return;
    }
    eigenVon(frei);                       // legt das Design mit den Vorgaben an
    if (d) d.stil = frei; else stil = frei;
    allesZeichnen();
    // Frisch angelegt: der Baukasten fuehrt Schritt fuer Schritt durch das leere Design.
    if (!document.getElementById('klappDesign').classList.contains('offen')) klappSchalten('klappDesign');
    eigenOeffnen(frei);

}

function eigenOeffnen(c) {

function eigenDialogZeichnen() {
  const c = eigenDialogFuer;
  if (!c || !istEigen(c)) return;
  const teile = eigenSchritte(c);
  const n = teile.length;
  const i = Math.max(0, Math.min(n - 1, eigenSchritt));
  eigenSchritt = i;
  const knoepfe = [];
  if (i > 0) knoepfe.push({ text: 'Zur\u00fcck', still: true, offen: true,
                            tun: function () { eigenSchritt = i - 1; eigenDialogZeichnen(); } });
  if (i < n - 1) knoepfe.push({ text: 'Weiter', offen: true,

async function stationNehmen(rbl, name, lat, lon, netz) {

  const st = { rbl, name, netz: netz || 'WL', abfahrten: [], gewaehlt: new Set(),
               lat: (lat != null ? Number(lat) : null), lon: (lon != null ? Number(lon) : null) };
  stationen.push(st);

}

// liegt im Werkzeug-Ordner. Datenquelle bleibt OpenStreetMap, die Angabe steht unten.
const KARTEN_ORTE = [
  ['at-w', 48.2082, 16.3738], ['at-n', 48.2047, 15.6256], ['at-o', 48.3064, 14.2861],
  ['at-s', 47.8095, 13.0550], ['at-t', 47.2692, 11.4041], ['at-v', 47.5031, 9.7471],

  ['de-bb', 52.3906, 13.0645], ['de-hb', 53.0793, 8.8017], ['de-hh', 53.5511, 9.9937],

  ['de-nw', 51.2277, 6.7735], ['de-rp', 49.9929, 8.2473], ['de-sl', 49.2402, 6.9969],

// Die naechstgelegene Landeshauptstadt gewinnt. Das trifft das Bundesland fast immer und
// bleibt auch dann sinnvoll, wenn jemand knapp ausserhalb wohnt: dann sieht er die Stadt,
// in die er faehrt. Weiter als 400 km weg heisst "nicht abgedeckt", dann bleibt der
// Papier-Hintergrund allein.
function karteFuer(lat, lon) {
  if (lat == null || lon == null) return null;
  let best = null, bestKm = 1e9;
  KARTEN_ORTE.forEach(o => {
    const dy = (o[1] - lat) * 111;
    const dx = (o[2] - lon) * 111 * Math.cos(lat * Math.PI / 180);
    const km = Math.sqrt(dx * dx + dy * dy);
    if (km < bestKm) { bestKm = km; best = o[0]; }
  });
  return bestKm <= 400 ? best : null;
}
let karteJetzt = null;

function karteAufStation(st) {

// ---- Raumwirkung der Wisch-Leiste -----------------------------------------------------
// Je weiter eine Karte von der Mitte weg ist, desto staerker ist sie weggedreht und
// zurueckgesetzt. Rein optisch, damit erkennbar ist, dass es seitwaerts weitergeht.
// Gemessen wird die LAYOUT-Lage der Karte, nicht ihre sichtbare: getBoundingClientRect
// rechnet die Drehung und die Verkleinerung mit, die diese Funktion selbst gerade gesetzt
// hat. Daraus entstand eine Rueckkopplung, die Karte zitterte beim Wischen. offsetLeft
// bleibt von der Verformung unberuehrt (Paul 22.10.2026).
let raumStand = null;          // letzter Scrollwert, zu dem gerechnet wurde
// Auf schmalen Bildschirmen steht eine Nachbarkarte genau bei b = 1, und dort schiebt die
// Kette in raumWirkung sie weiter hinaus: translateZ steht vor der Drehung, die Drehung macht
// aus der Tiefe einen Versatz nach aussen. Bei 430 px Breite blieb von der naechsten Karte
// 1 Pixel im Bild, bei 375 px keiner, und niemand sah, dass es seitwaerts weitergeht (Paul
// 23.10.2026). Der Zug holt die innere Kante der Nachbarn so weit herein, dass SPITZE Pixel
// zu sehen sind. Nur aus Layout-Werten gerechnet, wie raumWirkung selbst.
const SPITZE = 56;
function nachbarZug(streifen) {
  const karten = streifen.children;
  if (karten.length < 2) return 0;
  const breite = streifen.clientWidth;
  const abstand = karten[1].offsetLeft - karten[0].offsetLeft;   // Mitte zu Mitte
  if (2 * abstand < breite) return 0;   // breiter Schirm: die Nachbarn sind ohnehin zu sehen
  // Wo die innere Kante bei b = 1 ohne Zug landet: dieselbe Kette wie in raumWirkung,
  // scale(0.86), translateZ(-90), rotateY(-26deg), Perspektive 1100.
  const w = Math.PI * 26 / 180;
  const x = -karten[0].offsetWidth / 2 * 0.86, z = -90;
  const xr = x * Math.cos(w) - z * Math.sin(w);
  const zr = x * Math.sin(w) + z * Math.cos(w);
  const f = 1100 / (1100 - zr);
  const spitze = Math.min(SPITZE, (breite - karten[0].offsetWidth) / 2 - 8);
  // Die Nachbar-Mitte liegt bei breite / 2 + abstand, ihre Kante soll bei breite - spitze liegen.
  return Math.max(0, xr - (breite / 2 - spitze - abstand) / f);
}
function raumWirkung(erzwingen) {
  const streifen = document.getElementById('streifen');
  if (!streifen) return;
  // Unter einem halben Pixel ist nichts zu sehen, aber jedes Rechnen kann ein neues
  // Einrasten ausloesen. Darum nur bei echter Bewegung, ausser der Aufrufer besteht
  // darauf (nach einem Neuaufbau oder beim Fenstergroesse aendern).
  if (!erzwingen && raumStand !== null && Math.abs(streifen.scrollLeft - raumStand) < 0.5) return;
  raumStand = streifen.scrollLeft;
  const mitte = streifen.scrollLeft + streifen.clientWidth / 2;
  const zug = nachbarZug(streifen);
  for (const k of streifen.children) {
    const flaeche = k.querySelector('.raum') || k;
    const d = (k.offsetLeft + k.offsetWidth / 2 - mitte) / (streifen.clientWidth / 2);   // -1 … 0 … 1
    const b = Math.max(-1, Math.min(1, d));
    const dreh  = (-b * 26).toFixed(2);
    const tiefe = (-Math.abs(b) * 90).toFixed(1);
    const klein = (1 - Math.abs(b) * 0.14).toFixed(3);
    flaeche.style.transform = 'perspective(1100px) translateX(' + (-b * zug).toFixed(1) + 'px) rotateY(' + dreh
                            + 'deg) translateZ(' + tiefe + 'px) scale(' + klein + ')';
    flaeche.style.filter = 'saturate(' + (1 - Math.abs(b) * 0.45).toFixed(2) + ') brightness(' + (1 - Math.abs(b) * 0.1).toFixed(2) + ')';
    k.style.zIndex = String(100 - Math.round(Math.abs(b) * 50));
  }
}

// Klebt die Leiste oben? Dann Grund und Schatten (Paul 23.10.2026). Dazu ihre Hoehe als
// --leiste, damit scrollIntoView-Ziele unter ihr landen statt dahinter.
function leisteKlebt() {
  const streifen = document.getElementById('streifen');
  if (!streifen) return;
  streifen.classList.toggle('klebt', window.scrollY > 0 && streifen.getBoundingClientRect().top <= 0.5);
  document.documentElement.style.setProperty('--leiste', streifen.offsetHeight + 'px');
}
(function wischBeobachten() {
  const streifen = document.getElementById('streifen');
  let laeuft = false;
  const takt = () => { laeuft = false; raumWirkung(); };
  streifen.addEventListener('scroll', () => {
