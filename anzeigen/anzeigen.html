  }, { passive: true });
  window.addEventListener('resize', function () { raumWirkung(true); });
  let klebLaeuft = false;
  window.addEventListener('scroll', () => {
    if (!klebLaeuft) { klebLaeuft = true; requestAnimationFrame(() => { klebLaeuft = false; leisteKlebt(); }); }
  }, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(leisteKlebt).observe(streifen);
  leisteKlebt();
})();
// Welche Linien gewaehlt sind, lesen wir aus dem Linien-Feld von masterrow und timerow.
// Das ist fuer ALLE Netze dieselbe Form und genau das, was auch das Geraet sieht. Der
// Konfigurator kennt dafuer sechs Mechanismen (directions, filter, allDepartures,
// Suffixe in der Stop-Id, lineGroups, eigene Netznamen) - die muenden alle hier hinein,
// also muessen wir sie nicht einzeln nachbauen (Paul 23.10.2026).
//   Feld '*' oder leer = alle Abfahrten, kein Filter
//   sonst Tokens mit Komma, '+' verbindet Richtungen zu EINER Zeile (Gruppe),
//   '>' trennt Linie und Richtung (Richtungs-Id oder Zieltext)
// Ein Eintrag der Config, vollstaendig zerlegt. Felder wie beim Schreiben:
//   c Stil, g Gehweg, r Zeilen, m Wien-Gruppen, w Zeitfenster, z Uhr, s Sortierung,
//   d Display-Nummer, dazu die Design-Buchstaben t b u v h n k o f p j i.
function eintraegeAusZeilen(zeilen) {
  const raus = [];
  String(zeilen || '').split(';').forEach(seg => {
    seg = seg.trim();
    if (!seg) return;
    const teile = seg.split('|');
    if (teile.length < 2) return;
    const feld = teile[1].trim();
    const alle = !feld || feld === '*';
    const e = {
      rbls: teile[0].split(',').map(x => x.trim()).filter(Boolean),
      alle: alle,
      gruppen: alle ? [] : feld.split(',').map(tok =>
        tok.split('+').map(m => {
          const st = m.split('>');
          return { linie: (st[0] || '').trim(), richtung: (st[1] || '').trim() };
        }).filter(x => x.linie)
      ).filter(g => g.length),
      g: [], e: standardEinst()
    };
    const zahl = v => { const n = parseInt(v, 10); return isNaN(n) ? null : n; };
    for (let i = 2; i < teile.length; i++) {
      const tok = teile[i].trim();
      if (!tok) continue;
      const buch = tok[0], wert = tok.slice(1);
      switch (buch) {
        case 'c': e.c = zahl(wert); break;
        case 'r': e.r = zahl(wert); break;
        case 'z': e.z = zahl(wert); break;
        case 's': e.s = zahl(wert); break;
        case 'd': e.dnr = zahl(wert); break;
        case 'm': e.m = wert; break;
        // q: je Linien-Token der Index seiner Station in der rbl-Liste.
        case 'q': e.q = wert.split(',').map(x => parseInt(x, 10)); break;
        case 'g': e.g = wert.split(',').map(x => zahl(x) || 0); break;
        case 'w': {
          const st = wert.split('-');
          if (st.length === 2) e.w = { von: zahl(st[0]) || 0, bis: zahl(st[1]) || 0 };
          break;
        }
        case 'j': {
          const st = wert.split('-');
          if (st.length === 2) { e.e.x = zahl(st[0]) || 0; e.e.y = zahl(st[1]) || 0; }
          break;
        }
        // p heisst im Eintrag, was in den displaysettings d heisst: Verspaetung.
        case 'p': e.e.d = zahl(wert) || 0; break;
        case 't': case 'b': case 'u': case 'v': case 'h':
        case 'n': case 'k': case 'o': case 'f': case 'i':
          e.e[buch] = zahl(wert) || 0; break;
      }
    }
    raus.push(e);
  });
  return raus;
}

// Eine rbl kann ihre Linien mitbringen: "NETZ:stop!U1~U14~41~43". Das braucht es, wenn
// MEHRERE Stationen in EINEM Segment stehen, denn das Linienfeld dahinter gilt dann
// fuers ganze Segment und sagt nicht, welche Linie zu welcher Station gehoert. Ohne das
// bekam jede Station alle Linien des Segments, und weil die 41 und die 43 wirklich an
// beiden Haltestellen halten, blieben sie dort haengen (Kunde Thomas, 25.10.2026).
function rblTeile(rbl) {
  const r = String(rbl || '');
  const i = r.indexOf('!');
  if (i < 0) return { kahl: r, nur: null };
  const nur = r.slice(i + 1).split('~').map(x => x.trim().toUpperCase()).filter(Boolean);
  return { kahl: r.slice(0, i), nur: nur.length ? nur : null };
}
function gehoertDazu(nur, linie) {
  return !nur || nur.indexOf(String(linie || '').trim().toUpperCase()) >= 0;
}

// Netze, die im rbl ein EIGENES '!'-Schema fuehren oder keines vertragen. Bei DB und
// Daenemark stehen dort Gattung, Steig oder Linie: ein zweites Token zerlegt ihre
// Auswahl. Wien und Linz brauchen keines, dort hat jede Station ihren eigenen Eintrag.
// Liste aus dem Konfigurator (lineSelToken), geprueft gegen den Netznamen im rbl.
const OHNE_LINIENTOKEN = ['WL', 'WLB', 'TEST', 'DB', 'DBALL', 'DBSTEIG', 'DBIRIS',
                          'DKTRAIN', 'DKALL', 'DKSTEIG', 'WESTBAHN', 'LINZ',
                          'LIEMOBIL', 'RET', 'OVAPI', 'BODO'];
function netzKuerzel(st) {
  const rbl = String((st && st.rbl) || '');
  const i = rbl.indexOf(':');
  return (i > 0 ? rbl.slice(0, i) : String((st && st.netz) || '')).trim().toUpperCase();
}
// Darf diese Station ein Linien-Token tragen? Ein Liniename mit einem Trennzeichen des
// Formats macht die masterrow unlesbar: dann lieber gar kein Token.
function linienTokenErlaubt(st, colour, linien) {
  // Zug-Bretter nehmen wir immer selbst aus, das haengt am gewaehlten Stil und nicht am
  // Netz, das weiss nur diese Seite.
  if (istZeitTyp(colour)) return false;
  if (!(linien.length > 0 && linien.every(l => !/[~!,|;]/.test(String(l))))) return false;
  // Sagt der Konfigurator es, gilt er. Die Liste unten ist nur noch der Rueckfall fuer
  // eine aeltere Fassung, die das Feld noch nicht mitschickt.
  if (st && typeof st.linienToken === 'boolean') return st.linienToken;
  const n = netzKuerzel(st);
  if (!n || n.indexOf('OEBB') === 0) return false;
  return OHNE_LINIENTOKEN.indexOf(n) < 0;
}

// Das rohe Linienfeld eines Segments zu einer rbl. Fuer Zug-Anzeigen ist das die
// Gattungsliste, die sonst nirgends steht.
function linienfeldVon(zeilen, rbl) {
  const ziel = rblTeile(rbl).kahl.trim();
  let raus = '';
  String(zeilen || '').split(';').forEach(seg => {
    const f = String(seg || '').trim().split('|');
    if (f.length < 2) return;
    if (rblTeile(f[0]).kahl.trim() !== ziel) return;
    const feld = String(f[1] || '').trim();
    if (feld && feld !== '*' && !raus) raus = feld;
  });
  return raus;
}

// Nur die Auswahl je rbl, abgeleitet aus denselben Eintraegen.
function wahlAusZeilen(zeilen) {
  const raus = new Map();
  eintraegeAusZeilen(zeilen).forEach(ein => {
    // Ein Segment kann mehrere rbls tragen (Wien). Die Linien gelten dann fuer alle,
    // und was an einem Bahnsteig nicht faehrt, findet beim Abgleich ohnehin nichts.
    ein.rbls.forEach((rbl, ri) => {
      const teil = rblTeile(rbl);
      // q ist die genaueste Angabe: es nennt je Token die Station. Sonst das '!'-Token,
      // das nur Liniennamen kennt.
      let meine, genau = false;
      if (ein.q && ein.q.length >= ein.gruppen.length) {
        meine = ein.gruppen.filter((g, gi) => ein.q[gi] === ri);
        genau = true;
      } else if (teil.nur) {
        meine = ein.gruppen.map(g => g.filter(m => gehoertDazu(teil.nur, m.linie))).filter(g => g.length);
        genau = true;
      } else if (ein.rbls.length === 1) {
        // Steht in dem Eintrag nur EINE Station, gehoeren seine Linien zwangslaeufig
        // ihr. Das ist seit 25.10.2026 der Normalfall: beide Oberflaechen schreiben ein
        // Segment je Station und halten sie ueber das d-Feld zusammen, '!' und q
        // braucht es dafuer nicht mehr. Ohne dieses "genau" verloere eine Linie, die
        // gerade nicht in ihre Richtung faehrt, hier wieder ihre Zeile, also genau der
        // Fehler, den '!' und q einmal geloest haben (Kunde Thomas, Linie 41).
        meine = ein.gruppen;
        genau = true;
      } else {
        meine = ein.gruppen;
      }
      // Unter beiden Schreibweisen ablegen, mit und ohne '!'-Teil: welche davon die
      // Station traegt, wissen wir hier nicht.
      [rbl, teil.kahl].forEach(k => {
        const e = raus.get(k) || { alle: false, gruppen: [], genau: false };
        if (ein.alle) e.alle = true; else e.gruppen = e.gruppen.concat(meine);
        if (genau) e.genau = true;
        raus.set(k, e);
      });
    });
  });
  return raus;
}

// Der Picker sagt, WELCHE Linien gewaehlt sind. Welche RICHTUNG dazugehoert, steht
// oft nur in der Zeile, die das GERAET gespeichert hat. Der zweite Einstieg
// ("Einstellungen aendern") baut naemlich keine neue Config, dann kommen die Linien
// nur als nackte Namen an, und ein nackter Name heisst "in alle Richtungen". Genau so
// standen bei Linz Unionkreuzung auf einmal beide Richtungen da, obwohl das Geraet
// sauber 1>st444518499l1,2>st444518499l2 fuehrt (Paul 26.10.2026, am Geraet
// nachgemessen: "siehe hier du nimmst beide Richtungen").
// Die Linien kommen also vom Picker, die Richtungen vom Geraet. Andersherum waere es
// falsch: wer eine Linie abwaehlt, haette sie aus der alten Geraetezeile zurueck.
function wahlVereinen(vomPicker, vomGeraet) {
  const leer = x => !x || !x.gruppen || !x.gruppen.length;
  if (leer(vomPicker)) return leer(vomGeraet) ? vomPicker : vomGeraet;
  // Die Flaggen gehoeren zusammengefuehrt, auch wenn es nichts nachzutragen gibt.
  // "genau" sagt: diese Linie gehoert sicher zu dieser Station, auch wenn sie gerade
  // nicht faehrt. Ging es hier verloren, fiel eine ruhende Linie still aus Anzeige und
  // Config (Kunde Hannes: Salzburg Mirabellplatz, die 151 faehrt abends nicht).
  const mitFlaggen = (x) => ({ alle: !!(x.alle || (vomGeraet && vomGeraet.alle)),
                               gruppen: x.gruppen,
                               genau: !!(x.genau || (vomGeraet && vomGeraet.genau)) });
  if (leer(vomGeraet)) return vomPicker;
  const nachLinie = new Map();
  vomGeraet.gruppen.forEach(g => g.forEach(m => {
    if (!m.richtung) return;
    const k = String(m.linie || '').trim().toUpperCase();
    if (!nachLinie.has(k)) nachLinie.set(k, []);
    if (!nachLinie.get(k).some(x => x.richtung === m.richtung)) nachLinie.get(k).push(m);
  }));
  if (!nachLinie.size) return mitFlaggen(vomPicker);
  const gruppen = [];
  vomPicker.gruppen.forEach(g => {
    const neu = [];
    g.forEach(m => {
      const k = String(m.linie || '').trim().toUpperCase();
      // Nur NACHTRAGEN, nie ueberschreiben: steht die Richtung schon da, gilt sie.
      if (m.richtung || !nachLinie.has(k)) { neu.push(m); return; }
      nachLinie.get(k).forEach(x => neu.push({ linie: m.linie, richtung: x.richtung }));
    });
    if (neu.length) gruppen.push(neu);
  });
  return { alle: !!(vomPicker.alle || vomGeraet.alle), gruppen: gruppen,
           genau: !!(vomPicker.genau || vomGeraet.genau) };
}

// Stationen, die der Konfigurator uebergibt. catchit-cities legt sie beim Klick auf
// "Feintuning" in den sessionStorage und wechselt hierher (Paul 23.10.2026). Eine
// Wien-Station kann mehrere Bahnsteige tragen, die werden hier zu je einer Station.
function uebergabeHolen() {
  let roh = null;
  try { roh = JSON.parse(sessionStorage.getItem('catchit_feintuning') || 'null'); } catch (e) {}
  if (!roh || !roh.stationen || !roh.stationen.length) return null;
  const rohZeilen = (roh.masterrow || '') + ';' + (roh.timerow || '')
                  + ';' + ((roh.geraet && roh.geraet.masterrow) || '')
                  + ';' + ((roh.geraet && roh.geraet.timerow) || '');
  const wahl = wahlAusZeilen((roh.masterrow || '') + ';' + (roh.timerow || ''));
  // Dieselbe Auswertung fuer das, was am GERAET steht. Daraus kommen die Richtungen,
  // wenn der Picker keine mitgibt, und die ganze Auswahl, wenn er gar nichts mitgibt.
  const wahlGeraet = wahlAusZeilen(((roh.geraet && roh.geraet.masterrow) || '') + ';'
                                 + ((roh.geraet && roh.geraet.timerow) || ''));
  const raus = [];
  roh.stationen.forEach(st => {
    // Rueckfall, falls keine Config berechnet wurde: die Liniennamen aus filter.
    const ausFilter = String(st.filter || '').split(',').map(x => x.trim()).filter(Boolean)
                        .map(x => [{ linie: x, richtung: '' }]);
    String(st.rbl || '').split(',').forEach(rbl => {
      rbl = rbl.trim();
      if (!rbl) return;
      // CLOCK:<n> ist keine Station, sondern unser Platzhalter fuer ein Uhr-Brett. Das
      // Geraet fuehrt ihn in rbl_id mit, der Konfigurator macht daraus eine Station, und
      // dann stand hier eine "Station 3" ohne Abfahrten in der Liste. Schlimmer: die
      // Wiederherstellung sah eine echte Station mit "Alle Abfahrten" und gab auf, also
      // kam statt drei Brettern eines zurueck (Paul 23.10.2026).
      if (/^CLOCK:/i.test(rbl)) return;
      // EINE Station je rbl. Der Konfigurator fuehrt dieselbe Haltestelle einmal JE
      // EINTRAG, also zweimal, wenn sie auf zwei Brettern liegt. Ungefiltert wurde seit
      // dem stationsgenauen Zeilen-Schluessel jede Linie doppelt angelegt
      // (Paul 23.10.2026). Was die Eintraege wollen, wird vereinigt.
      // NUR zusammenlegen, wenn es WIRKLICH dieselbe Auswahl ist. Der Konfigurator fuehrt
      // dieselbe Haltestelle einmal je BRETT, und das koennen zwei Bretter mit ganz
      // verschiedenen Linien sein (Linz Unionkreuzung: einmal 1, 2, 41, 43 und einmal die
      // Landbusse 309, 412, 609). Vorher habe ich beide vereinigt, und dann standen auf
      // einmal elf Richtungen da, obwohl der Kunde drei gewaehlt hatte
      // (Paul 26.10.2026, in seinem Log nachgelesen).
      // Seit 26.10.2026 sagt die Linienauswahl selbst, was zusammengehoert: gleiches
      // 'brett' heisst dieselbe Anzeige. Das ist eine Identitaet, keine Nummer, und
      // wird nirgends angezeigt. Vorher musste ich es an der Auswahl erraten, und
      // raten hiess: zwei Bretter mit denselben Linien fielen zu einem zusammen.
      const kennung = st.brett ? ('b' + st.brett)
        : ((st.alle ? '*' : '') + (st.richtungen || [])
           .map(r => String(r.line || '') + '>' + String(r.ziel || '')).sort().join(','));
      const schon = raus.find(x => x.rbl === rbl && x.kennung === kennung);
      const vomPicker = wahl.get(rbl) || (ausFilter.length
                        ? { alle: false, gruppen: ausFilter, genau: false } : null);
      const w = wahlVereinen(vomPicker, wahlGeraet.get(rbl) || null);
      const wunsch = st.richtungen || [];
      if (schon) {
        if (st.alle || (w && w.alle)) schon.alle = true;
        wunsch.forEach(r => {
          const da = schon.richtungen.some(x => x.line === r.line && x.ziel === r.ziel);
          if (!da) schon.richtungen.push(r);
        });
        return;
      }
      raus.push({ rbl: rbl, kennung: kennung, name: st.name || rbl, netz: st.netz || 'WL',
                  alle: !!st.alle || !!(w && w.alle),
                  wahl: (w && w.gruppen.length) ? w.gruppen : ausFilter,
                  // Der Konfigurator weiss, was zu dieser Station gehoert, und sagt es
                  // uns. Damit braucht diese Seite keine eigene Netz-Tabelle mehr
                  // (Paul 25.10.2026: "aber der Konfigurator weiss das ja alles").
                  // Stand die Zuordnung ausdruecklich in der Config ('!' oder q)? Dann
                  // gehoert die Linie sicher zu dieser Station, auch wenn sie gerade
                  // nicht in dieser Richtung faehrt.
                  genau: !!(w && w.genau),
                  // Welche Linien hier halten. Nur der Rueckfall: normalerweise stehen
                  // sie in den Abfahrten, die diese Seite ohnehin holt. Nachts ist die
                  // Liste dort aber kurz, und bei einer Station mit "Alle Abfahrten"
                  // gibt es sonst gar nichts anzuzeigen (Paul 25.10.2026).
                  linienAmHalt: Array.isArray(st.linienAmHalt) ? st.linienAmHalt.slice() : null,
                  // Zug-Brett: die Namen der Ziele und die gewaehlten Gattungen. Beides
                  // kennt nur die Linienauswahl, aus der rbl kaemen nur die Ids.
                  zielNamen: Array.isArray(st.zielNamen) ? st.zielNamen.slice()
                           : (Array.isArray(st.ziele) ? st.ziele.map(z => (z && z.name) || z) : null),
                  // Die Gattungen stehen bei Zug-Anzeigen NICHT im filter (der ist dort
                  // leer), sondern im Linienfeld des Segments, und das Segment liegt in
                  // der timerow. Kanonisch ist das Linienfeld (Konfigurator-Sitzung
                  // 26.10.2026, nachgemessen).
                  gattungen: linienfeldVon(rohZeilen, rbl) || String(st.filter || '').trim(),
                  // Zu jeder Richtungs-Id ihr Ziel, vom Picker mitgeschickt. Damit
                  // laesst sich eine Richtung benennen, zu der gerade keine Abfahrt
                  // laeuft, und es muss niemand Ids vergleichen
                  // (Paul 26.10.2026: "eine Beschreibung id-Benennung: 391=Schottentor").
                  ridNamen: (st.ridNamen && typeof st.ridNamen === 'object') ? st.ridNamen : null,
                  // Schon geholte Abfahrten, roh wie von der API oder fertig geparst.
                  abfahrten: st.abfahrten || st.rohAbfahrten || null,
                  abfahrtenStand: parseInt(st.abfahrtenStand, 10) || 0,
                  linienToken: (typeof st.linienToken === 'boolean') ? st.linienToken : null,
                  stil: parseInt(st.stil, 10),
                  stilTon: parseInt(st.stilTon, 10),
                  richtungen: wunsch.slice() });
    });
  });
  // WAS gewaehlt ist, steht in den Zeilen, die der Konfigurator gerade gebaut hat.
  // WIE es aussieht, NUR in dem, was das Geraet geschickt hat: dort stehen Uhr,
  // Display-Nummer, Wechselzeiten und die anderen Felder, die der Konfigurator beim
  // Neubau verliert.
  // Die gebauten Zeilen taugen dafuer ausdruecklich NICHT: sie entstehen frisch aus den
  // Stationen und wuerden je Station ein Brett vorgeben. Damit haette die automatische
  // Aufteilung (kompakt oder spielerisch) nie eine Chance, obwohl noch niemand etwas
  // zugewiesen hat. Ohne Geraete-Config verteilen wir also selbst (Paul 23.10.2026).
  // Eigene Designs zuerst: davon haengen Namen und Vorschau der Stile ab.
  customrowLesen((roh.geraet && roh.geraet.customrow) || roh.customrow || '');
  // Die Standzeit des Geraets ist die Vorgabe fuer jedes Display, das keine eigene
  // mitbringt. Sie muss VOR dem Parsen stehen, denn standardEinst() liest sie, und die
  // Eintraege unten entstehen in derselben Anweisung (Paul 25.10.2026).
  const sz = parseInt(roh.stopinterval, 10);
  if (!isNaN(sz) && sz > 0) {
    standzeitStart = Math.max(STANDZEIT_MIN_UHR, Math.min(STANDZEIT_MAX, sz));
  }
  // Version und Format-Entscheid kommen aus der Uebergabe, nicht aus einer eigenen
  // Abfrage. fw ist die Rohangabe fuer die Hinweistexte, dFeld die Entscheidung.
  if (roh.fw) geraetVersion = String(roh.fw);
  if (typeof roh.dFeld === 'boolean') dFeldVonAussen = roh.dFeld;
  const g = roh.geraet || null;
  wahlGeraten = eintraegeAusZeilen((roh.masterrow || '') + ';' + (roh.timerow || ''))
    .some(ein => ein.rbls.length > 1 && !ein.alle
              && !(ein.q && ein.q.length)
              && !ein.rbls.some(r => rblTeile(r).nur));
  const bauZeilen = (g && (g.masterrow || g.timerow))
    ? (g.masterrow || '') + ';' + (g.timerow || '')
    : '';
  return { stationen: raus, helligkeit: roh.helligkeit, masterrow: roh.masterrow || '',
           modus: (roh.modus === 'spielerisch' || roh.modus === 'kompakt') ? roh.modus : null,
           marke: roh.brand || '',
           // Geraete-Einstellungen, die nicht in der masterrow stehen. Ohne sie startet
           // die Oberflaeche mit ihren Vorgaben und SPEICHERT die dann auch: Bernds
           // Nachtmodus war nach jedem Besuch weg (Kundenmeldung 25.10.2026).
           nacht: (roh.nightmode != null || roh.nightstart != null) ? {
             an: String(roh.nightmode) === '1' || roh.nightmode === true,
             von: parseInt(roh.nightstart, 10),
             bis: parseInt(roh.nightend, 10)
           } : null,
           standzeit: parseInt(roh.stopinterval, 10),
           markeStile: roh.brandStile || null,
           markeNamen: roh.brandStilNamen || null,
           eintraege: eintraegeAusZeilen(bauZeilen) };
}

// Die Bretter so wiederherstellen, wie sie gespeichert wurden: Aufteilung, Stil, Zeilen,
// Uhr an ihrer Stelle, Zeitfenster, Sortierung, Gehweg, Gruppen und alle Design-Felder.
// Ohne das faengt jeder Besuch wieder bei der Vorgabe an, und alles Neue (Uhr, Blinken,
// Wechselzeiten) war beim naechsten Oeffnen weg (Paul 23.10.2026).
function displaysAusEintraegen(eintraege) {
  if (!eintraege || !eintraege.length) return false;
  // Nach Display-Nummer buendeln. Eintraege ohne d<n> kommen von aelterer Firmware oder
  // aus dem alten Konfigurator: dann ist jeder Eintrag sein eigenes Brett.
  const nach = new Map();
  let ohne = 0;
  eintraege.forEach(ein => {
    let nr = ein.dnr;
    if (!nr) {
      // Ohne d<n> entscheidet die Firmware selbst, und sie legt gleichfarbige WIEN-
      // Eintraege zu EINEM Brett zusammen (colourToMergedIdx, nur fuer isWien). Genau
      // das muss hier auch passieren, sonst zeigt die Oberflaeche drei Bretter, wo das
      // Geraet eines hat (Kunde Valentin, 24.10.2026: 12, 5A und U6 an drei Stationen).
      const wien = ein.rbls.some(r => /^WLB?:/i.test(r) || /^\d/.test(r));
      nr = (wien && ein.c) ? ('w' + ein.c) : ('x' + (++ohne));
    }
    if (!nach.has(nr)) nach.set(nr, []);
    nach.get(nr).push(ein);
  });
  const neu = [];
  let misslungen = false;
  nach.forEach(buendel => {
    const erste = buendel[0];
    // Nicht als "vom Nutzer gesetzt" markieren: sonst koennte der Umschalter oben sie
    // nie neu verteilen, und eine neue Linie faende kein Brett mit Platz.
    const d = { richtungen: [], vomNutzer: false };
    const gruppen = [];
    // Wien fuehrt eine Gruppe NICHT als '+'-Token, sondern als m-Feld ueber mehrere
    // Eintraege: Token <idx> dieses Eintrags gehoert zu Gruppe <gid>, gleiche gid heisst
    // dieselbe Zeile. Ohne das Lesen war die Gruppe beim naechsten Oeffnen weg, obwohl
    // sie richtig gespeichert war (Paul 24.10.2026).
    const nachGid = new Map();
    buendel.forEach(ein => {
      const mKarte = new Map();
      String(ein.m || '').split(',').forEach(x => {
        const st2 = x.split(':');
        const idx = parseInt(st2[0], 10), gid = parseInt(st2[1], 10);
        if (!isNaN(idx) && !isNaN(gid)) mKarte.set(idx, gid);
      });
      // Nur die Stationen dieses Eintrags, sonst zieht ein gleicher Linienname von einer
      // anderen Station mit herein.
      // Station finden, egal ob mit oder ohne '!'-Teil geschrieben, und dabei merken,
      // welche Linien zu ihr gehoeren.
      const nurVon = new Map();
      ein.rbls.forEach(r => { const x = rblTeile(r); nurVon.set(x.kahl, x.nur); });
      const stats = stationen.filter(st => nurVon.has(rblTeile(st.rbl).kahl));
      // "Alle Abfahrten" steht als '*' in der Config. Das ist jetzt ein Stations-Block,
      // also genau EINE Zeile, und damit laesst es sich zurueckholen. Vorher gab die
      // Wiederherstellung hier auf, und jeder Kunde mit "alle Abfahrten" verlor bei
      // jedem Besuch seine Aufteilung, seine Uhr und sein Design (Paul 25.10.2026).
      // (Ein Uhr-Brett traegt auch '*', hat aber keine Station: dann passiert hier nichts.)
      // Zug-Brett: das Linienfeld traegt Gattungen, keine Linien. Die Zeilen stehen
      // in der rbl, naemlich je Ziel eine. Ohne diesen Zweig fand die Wiederherstellung
      // zu den Gattungen keine Abfahrt und gab das Brett auf (Paul 26.10.2026).
      const zugStats = stats.filter(istZugStation);
      if (zugStats.length) {
        zugStats.forEach(st => {
          const si = stationen.indexOf(st);
          // Schluessel aus DERSELBEN Quelle wie die Anzeige, nicht nachgebaut: sonst
          // passt er nach jeder Aenderung an der Zeile nicht mehr (26.10.2026).
          zeilenEintraege(st).forEach(dep => {
            const k = zeilenKey(si, dep);
            if (d.richtungen.indexOf(k) < 0) d.richtungen.push(k);
          });
        });
        if (zugStats.length === stats.length) return;
      }
      if (ein.alle) {
        stats.forEach(st => {
          st.alle = true;
          const k = zeilenKey(stationen.indexOf(st), { line: ALLE_LINIE, dest: '' });
          if (d.richtungen.indexOf(k) < 0) d.richtungen.push(k);
        });
        return;
      }
      ein.gruppen.forEach((teil, ti) => {
        const keys = [];
        // Sagt q, zu welcher Station dieses Token gehoert, gilt nur sie.
        const nurRbl = (ein.q && ein.q.length > ti && ein.rbls[ein.q[ti]] != null)
          ? rblTeile(ein.rbls[ein.q[ti]]).kahl : null;
        teil.forEach(m => stats.forEach(st => {
          if (nurRbl && rblTeile(st.rbl).kahl !== nurRbl) return;
          if (!nurRbl && !gehoertDazu(nurVon.get(rblTeile(st.rbl).kahl), m.linie)) return;
          const si = stationen.indexOf(st);
          const nimm = (linie, ziel) => {
            const k = zeilenKey(si, { line: linie, dest: ziel });
            if (keys.indexOf(k) < 0) keys.push(k);
          };
          const treffer = tokenTreffer(linienAus(st.abfahrten), m, [], st.ridNamen);
          let fand = false;
          treffer.forEach(tr => {
            const lokal = tr.name + '|' + tr.ziel;
            if (st.gewaehlt && st.gewaehlt.size && !st.gewaehlt.has(lokal)) return;
            fand = true;
            nimm(tr.name, tr.ziel);
          });
          if (fand) return;
          // Faehrt die Linie gerade nicht, gibt es keine Abfahrt zum Abgleichen. Die
          // Auswahl kennt sie trotzdem als ruhende Zeile, und ohne diesen Rueckfall
          // bliebe das Brett LEER und fiele weg. Seine Zeilen landeten dann auf fremden
          // Brettern (Kunde Valentin: die Zuege standen zwischen den Wiener Linien).
          const name = String(m.linie || '').trim().toUpperCase();
          let traf = false;
          (st.gewaehlt ? Array.from(st.gewaehlt) : []).forEach(lokal => {
            const i = String(lokal).indexOf('|');
            const linie = i < 0 ? lokal : lokal.slice(0, i);
            if (String(linie).trim().toUpperCase() !== name) return;
            traf = true;
            nimm(linie, i < 0 ? '' : lokal.slice(i + 1));
          });
          if (!traf && m.linie) nimm(m.linie, '');
        }));
        keys.forEach(k => { if (d.richtungen.indexOf(k) < 0) d.richtungen.push(k); });
        if (teil.length > 1 && keys.length > 1) gruppen.push(keys);
        // Was das m-Feld derselben Gruppe zuordnet, ueber alle Eintraege sammeln.
        const gid = mKarte.get(ti);
        if (gid) {
          if (!nachGid.has(gid)) nachGid.set(gid, []);
          const topf = nachGid.get(gid);
          keys.forEach(k => { if (topf.indexOf(k) < 0) topf.push(k); });
        }
      });
    });
    nachGid.forEach(keys => { if (keys.length > 1) gruppen.push(keys); });
    // z1 = das ganze Brett ist eine Uhr, sonst z<Zeile+1>, also z2 fuer die erste Zeile.
    if (erste.z === 1) d.richtungen = [UHR_KEY];
    else if (erste.z > 1) d.richtungen.splice(erste.z - 2, 0, UHR_KEY);
    if (gruppen.length) d.gruppen = gruppen;
    if (erste.c) d.stil = erste.c;
    if (erste.r) d.zeilen = erste.r;
    if (erste.w) d.fenster = erste.w;
    if (erste.s) d.sortierung = (erste.s === 3) ? 'zeit' : 'fest';
    d.einst = erste.e;
    if (d.richtungen.length) neu.push(d);
  });
  if (misslungen || !neu.length) return false;
  displays = neu;
  return true;
}

// Rueckfall, wenn die Bretter nicht eins zu eins zurueckkommen (Alle Abfahrten): dann
// gilt wenigstens das AUSSEHEN der gespeicherten Config, also Stil und Design. Sonst
// stuende nach jedem Oeffnen wieder die Vorgabe da, obwohl der Nutzer sein Display
// laengst eingefaerbt hat (Paul 23.10.2026). Nur wenn ALLE Eintraege denselben Stil
// tragen, sonst wuerde eine gemischte Config auf einen Stil eingeebnet.
// Gehzeit je Station aus den Eintraegen. Das g-Feld zaehlt parallel zur rbl-Liste des
// Eintrags, also gilt g[i] fuer rbls[i]; eine einzelne Zahl gilt fuer alle.
function gehwegUebernehmen(eintraege) {
  (eintraege || []).forEach(ein => {
    if (!ein.g || !ein.g.length) return;
    (ein.rbls || []).forEach((rbl, i) => {
      const gw = ein.g.length > i ? ein.g[i] : ein.g[0];
      if (!gw) return;
      const kahl = rblTeile(rbl).kahl;
      const st = stationen.find(x => rblTeile(x.rbl).kahl === kahl);
      if (st && !st.gehweg) st.gehweg = gw;
    });
  });
}

function aussehenUebernehmen(eintraege) {
  const mit = (eintraege || []).filter(x => x.c);
  if (!mit.length) return false;
  const c = mit[0].c;
  if (!mit.every(x => x.c === c)) return false;
  displays.forEach(d => {
    if (d.vomNutzer) return;
    d.stil = c;
    d.einst = Object.assign({}, mit[0].e);
  });
  return true;
}

// Welches Ziel der Station ist gemeint? Zuerst genau, sonst eines, das ineinander
// steckt: der Konfigurator kuerzt Ziele anders als die Abfahrts-API.
function zielTreffer(linien, ziel) {
  const z = String(ziel || '').trim().toLowerCase();
  if (!z) return null;
  const genau = linien.find(x => x.ziel.toLowerCase() === z);
  if (genau) return genau;
  // Ein bis zwei Zeichen sind eine Richtungs-Id (H, R), kein Zieltext. Teilweise suchen
  // waere hier fatal: das "H" von bodo und BWEGT steckt in fast jedem Ortsnamen und
  // traf dann die erstbeste Zeile. So wurde aus "S4>H" die S4 nach Schwabstrasse
  // (Paul 25.10.2026). Dieselbe Grenze zieht die Firmware in matchesLineDest.
  if (z.length <= 2) return null;
  return linien.find(x => x.ziel.toLowerCase().indexOf(z) >= 0
                       || z.indexOf(x.ziel.toLowerCase()) >= 0)
      || null;
}

// Ein Linien-Token der Config auf die echten Abfahrten abbilden. Drei Faelle:
//   "U1>Leopoldau"  Zieltext, direkt abgleichbar
//   "U1>301"        Richtungs-Id, in den Abfahrten gibt es die nicht: dann hilft der
//                   Zieltext aus der Uebergabe (richtungen)
//   "105"           keine Richtung, z.B. Linz und andere HAFAS-Netze: die Linie gilt
//                   in alle Richtungen
function tokenTreffer(linien, m, richtungen, ridNamen) {
  const l = String(m.linie || '').trim().toUpperCase();
  const gleich = linien.filter(x => x.name.trim().toUpperCase() === l);
  const r = String(m.richtung || '').trim();
  // Die Linienauswahl schickt zu jeder Richtungs-Id ihren Zieltext mit. Damit ist eine
  // Richtung auch dann zu benennen, wenn gerade keine Abfahrt dazu laeuft: abends, am
  // Wochenende, oder bei einer Linie, die nur ein paarmal am Tag faehrt. Vorher stand
  // dann nur die nackte Linie da, ohne Ziel.
  // Zwei Schreibweisen, weil eine Richtungs-Id nicht ueberall eindeutig ist: bei Linz
  // steckt die Linie schon drin (st444518499l1), bei BWEGT und bodo heisst sie nur "H"
  // oder "R" und bedeutet je Linie etwas anderes (an Marienplatz ist H bei der 43
  // Feuersee, bei der U1 Heslach). Darum zuerst "<Linie>><Id>", dann die nackte Id.
  const ausNamen = (!r || !ridNamen) ? ''
                 : String(ridNamen[l + '>' + r] || ridNamen[m.linie + '>' + r]
                          || ridNamen[r] || '').trim();
  // "nurName" heisst: der Name stammt aus der Uebergabe, nicht aus einer Abfahrt. Die
  // Zeile muss dann die Richtungs-Id des Tokens behalten, sonst schriebe das naechste
  // Speichern den Zieltext dorthin, wo das Geraet eine Id erwartet (41>Vogelsang statt
  // 41>R, 26.10.2026 beim Nachstellen von Thomas' Config gesehen).
  if (!gleich.length) return ausNamen ? [{ name: m.linie, ziel: ausNamen, rid: r, nurName: true }] : [];
  if (r) {
    // 1) Richtungs-Id, so wie die Abfahrtsdaten sie fuehren. Bei OOEVV der Bahnsteig.
    const ueberId = gleich.filter(x => x.rid && x.rid === r);
    if (ueberId.length) return ueberId;
    // 2) Zieltext. Eine reine Zahl ist eine fremde Richtungs-Id (Wien, OEBB) und
    //    trifft keinen Zieltext, die geht unten ueber die Uebergabe.
    if (!/^\d+$/.test(r)) {
      const tr = zielTreffer(gleich, r);
      if (tr) return [tr];
    }
    // Die Uebergabe kennt das Ziel zu dieser Id. Dann ist das die Richtung, Punkt.
    if (ausNamen) {
      // Eine Id kann MEHRERE Ziele tragen, wenn der Steig nicht trennt: Linz Linie 2
      // faehrt unter derselben Id nach solarCity und nach Remise Kleinmuenchen. Der
      // Picker verbindet die mit ' \u00b7 ', wie die Stationskarte auch
      // (Konfigurator-Sitzung 26.10.2026). Faehrt eines davon gerade, gilt sein
      // echter Zieltext, sonst der erste als Beschriftung.
      const teile = ausNamen.split('\u00b7').map(x => x.trim()).filter(Boolean);
      const echt = [];
      teile.forEach(x => { const tr = zielTreffer(gleich, x); if (tr && echt.indexOf(tr) < 0) echt.push(tr); });
      if (echt.length) return echt;
      return [{ name: m.linie, ziel: teile[0] || ausNamen, rid: r, nurName: true }];
    }
    // 3) Weder eine passende Richtungs-Id noch ein passendes Ziel. Fuehrt die Station
    //    ueberhaupt Richtungs-Ids, dann faehrt diese Linie hier nicht in DIESER
    //    Richtung, und der Rueckfall auf "alle Richtungen dieser Linie" waere falsch.
    //    Genau so landete Stuttgart "43>H" auch an Feuersee, wo die 43 nur nach
    //    Pragsattel faehrt (Paul 25.10.2026).
    if (gleich.some(x => x.rid)) return [];
  }
  // 3) Was die Uebergabe zu dieser Linie weiss. Auch hier zuerst die Richtungs-Id: das
  //    ist derselbe Wert, den die Linienauswahl im Konfigurator schon benutzt.
  const wunsch = (richtungen || []).filter(x => String(x.line || '').trim().toUpperCase() === l);
  if (wunsch.length) {
    const ueberId = gleich.filter(x => x.rid && wunsch.some(w => w.rid && w.rid === x.rid));
    if (ueberId.length) return ueberId;
    const raus = [];
    wunsch.forEach(w => {
      const t = zielTreffer(gleich, w.ziel);
      if (t && raus.indexOf(t) < 0) raus.push(t);
    });
    if (raus.length) return raus;
  }
  return gleich;
}

// Ladeanzeige: sie laeuft, solange Stationen geholt werden, und sagt wie viele schon da
// sind. Ohne sie sieht ein langsames Netz wie eine kaputte Seite aus.
let ladenGesamt = 0, ladenFertig = 0;
function ladenAn(n) {
  ladenGesamt = n; ladenFertig = 0;
  const el = document.getElementById('laden');
  if (el) el.classList.add('an');
  document.body.classList.add('laedt');
  ladenText();
}
function ladenText() {
  const el = document.getElementById('ladenText');
  if (!el) return;
  el.textContent = ladenGesamt > 1
    ? 'Lade deine Linien, ' + ladenFertig + ' von ' + ladenGesamt + ' Haltestellen'
    : 'Lade deine Linien';
}
function ladenSchritt() { ladenFertig++; ladenText(); }
function ladenAus() {
  const el = document.getElementById('laden');
  if (el) el.classList.remove('an');
  document.body.classList.remove('laedt');
}

(async function start() {
  // Testaufbau, solange niemand etwas uebergibt: fuenf Wiener Stationen mit je einer
  // Linie. Damit sieht man sofort, wie aus Zeilen Seiten werden und wie die Stile wirken.
  const TEST = [
    { rbl: '4111', name: 'Stephansplatz', linie: 'U1', ziel: 'Leopoldau',   lat: 48.2083, lon: 16.3725 },
    { rbl: '4201', name: 'Schottenring',  linie: 'U2', ziel: 'Karlsplatz',  lat: 48.2163, lon: 16.3724 },
    { rbl: '4921', name: 'Westbahnhof',   linie: 'U3', ziel: 'Simmering',   lat: 48.1966, lon: 16.3386 },
    { rbl: '4421', name: 'Karlsplatz',    linie: 'U4', ziel: 'Heiligenstadt', lat: 48.2005, lon: 16.3690 },
    { rbl: '4621', name: 'Thaliastra\u00dfe', linie: 'U6', ziel: 'Floridsdorf', lat: 48.2098, lon: 16.3368 }
  ];
  const ueber = uebergabeHolen();
  if (ueber && ueber.helligkeit) helligkeit = ueber.helligkeit;
  // Der Wizard sagt, wie automatisch verteilt werden soll.
  if (ueber && ueber.modus) modus = ueber.modus;
  // Nachtmodus und Standzeit so uebernehmen, wie sie am Geraet stehen.
  if (ueber && ueber.nacht) {
    nacht.an = !!ueber.nacht.an;
    if (!isNaN(ueber.nacht.von)) nacht.von = ueber.nacht.von;
    if (!isNaN(ueber.nacht.bis)) nacht.bis = ueber.nacht.bis;
  }
  // Marke des Geraets: aus der Uebergabe, sonst aus der Adresszeile wie im Konfigurator.
  try {
    const ausUrl = new URLSearchParams(location.search).get('brand');
    marke = String(ausUrl || (ueber && ueber.marke) || '').trim().toUpperCase();
  } catch (e) { marke = String((ueber && ueber.marke) || '').trim().toUpperCase(); }
  if (ueber && Array.isArray(ueber.markeStile) && ueber.markeStile.length) {
    markeStileAus = ueber.markeStile.map(x => parseInt(x, 10)).filter(x => !isNaN(x));
  }
  if (ueber && ueber.markeNamen && typeof ueber.markeNamen === 'object') markeNamenAus = ueber.markeNamen;

  const liste = ueber ? ueber.stationen
                      : TEST.map(e => ({ rbl: e.rbl, name: e.name, netz: 'WL', alle: false,
                                         lat: e.lat, lon: e.lon,
                                         wahl: [[{ linie: e.linie, richtung: e.ziel }]],
                                         richtungen: [{ line: e.linie, ziel: e.ziel }] }));
  ladenAn(liste.length);
  for (const e of liste) {
    const st = { rbl: e.rbl, name: e.name, netz: e.netz || 'WL', abfahrten: [],
                 alle: !!e.alle,
                 // Kam sie schon als "Alle Abfahrten" aus der Linienauswahl, gibt es gar
                 // keine Linienauswahl, auf die man zurueckschalten koennte. Dann ist der
                 // Schalter sinnlos und fuehrt nur zu einer leeren, grauen Zeile
                 // (Paul 26.10.2026).
                 alleFix: !!e.alle,
                 linienAmHalt: e.linienAmHalt || null, ridNamen: e.ridNamen || null,
                 zielNamen: e.zielNamen || null, gattungen: e.gattungen || '',
                 linienToken: (e.linienToken == null) ? null : e.linienToken,
                 stil: isNaN(e.stil) ? null : e.stil,
                 stilTon: isNaN(e.stilTon) ? null : e.stilTon,
                 gewaehlt: new Set(), lat: e.lat, lon: e.lon,
                 vorgabe: e.richtungen && e.richtungen[0]
                          ? { line: e.richtungen[0].line, dest: e.richtungen[0].ziel } : null };
    // Die gewaehlten Richtungen aus der Uebergabe gelten als bekannt, auch bevor je eine
    // Abfahrt kam. Daran haengen Richtungs-Id und Beschriftung einer ruhenden Zeile.
    if (e.richtungen && e.richtungen.length) {
      st.letzteLinien = e.richtungen.filter(r => r.line && r.ziel).map(r => ({
        line: r.line, dest: r.ziel, rid: r.rid || '', vt: '',
        lineColor: null, lineTextColor: null
      }));
    }
    stationen.push(st);
    // Mehrere Anfragen direkt hintereinander laufen schnell in die Ratengrenze der API.
    // Ein leeres catch wuerde den Fehler verschlucken und die Seite bliebe stumm leer.
    // Kamen die Abfahrten mit, sofort anzeigen und NICHT noch einmal holen.
    // Die Linienauswahl gibt nur Frisches mit (hoechstens 60 s alt). Das gilt aber beim
    // SCHREIBEN: diese Seite kann die Uebergabe spaeter laden, etwa nach einem Neuladen
    // oder wenn der Tab lag. Darum hier noch einmal aufs Alter sehen, sonst stuenden
    // falsche Minuten da, und das waere schlimmer als kurz zu warten (Paul 26.10.2026).
    const standAlter = e.abfahrtenStand ? (Date.now() - e.abfahrtenStand) : 0;
    let roh = (e.abfahrtenStand && standAlter > 90000) ? null : (e.abfahrten || e.rohAbfahrten || null);
    if (roh && !Array.isArray(roh)) roh = abfahrtenAus(roh);
    // HIER NICHT 'continue': darunter steht die AUSWAHL. Weil die Linienauswahl die
    // Abfahrten fast immer mitschickt, wurde der Block darunter in der Praxis nie
    // erreicht, und dann stand jede Abfahrt der Haltestelle auf dem Brett. In jeder
    // Nachstellung lief es richtig, weil eine nachgebaute Uebergabe keine Abfahrten
    // mitbringt, der echte Picker aber schon. Genau das war die wochenlange Jagd nach
    // den Geisterlinien (am Geraet nachgemessen, 26.10.2026).
    if (Array.isArray(roh) && roh.length) {
      abfahrtenSetzen(st, roh);
    } else {
      try {
        abfahrtenSetzen(st, await abfahrten(e.rbl));
      } catch (err) {
        await new Promise(r => setTimeout(r, 1500));
        try { abfahrtenSetzen(st, await abfahrten(e.rbl)); }
        catch (err2) { st.fehler = String((err2 && err2.message) || err2); abfahrtenSetzen(st, []); }
      }
    }
    ladenSchritt();
    // Angehakt wird, was der Konfigurator gewaehlt hat. "Alle Abfahrten" laesst die
    // Auswahl leer, das heisst in dieser Oberflaeche ohnehin "alles".
    // DIE AUSWAHL KOMMT AUS DEM PICKER, nicht aus einem Abgleich. Schickt die
    // Linienauswahl ihre Richtungen mit, sind GENAU DAS die Zeilen: eine je Eintrag,
    // mit ihrer Beschriftung und ihrer Richtungs-Id. Vorher habe ich daraus nur einen
    // Startpunkt gemacht und dann selbst in den Abfahrten gesucht, und jedes Mal, wenn
    // dabei etwas nicht traf, stand entweder zu wenig oder die halbe Haltestelle da
    // (Paul 26.10.2026: "der grosse Fehler ist, dass du immer selber suchst").
    if (!e.alle && e.richtungen && e.richtungen.length) {
      const paare = [];
      e.richtungen.forEach(r => {
        const linie = String(r.line || '').trim();
        if (!linie) return;
        st.gewaehlt.add(linie + '|' + String(r.ziel || '').trim());
        if (r.rid) {
          if (!st.ruhtRid) st.ruhtRid = {};
          st.ruhtRid[linie + '|' + String(r.ziel || '').trim()] = String(r.rid).trim();
          // Linie UND Richtung merken. Nur den Liniennamen zu pruefen reicht nicht: die
          // Gerätezeile traegt oft beide Richtungen, der Picker aber nur eine, und dann
          // kam die Gegenrichtung durch (Paul 26.10.2026, Linie 1 und 2 in Linz).
          if (!st.gewaehltRid) st.gewaehltRid = new Set();
          st.gewaehltRid.add(linie.toUpperCase() + '>' + String(r.rid).trim());
        }
      });
      // Gruppen aus der masterrow bleiben erhalten, die stehen nicht in den Richtungen.
      (e.wahl || []).forEach(gruppe => {
        if (!gruppe || gruppe.length < 2) return;
        const keys = [];
        gruppe.forEach(m => {
          const treffer = [...st.gewaehlt].filter(k =>
            k.slice(0, k.indexOf('|')).toUpperCase() === String(m.linie || '').trim().toUpperCase());
          treffer.forEach(k => {
            const i = k.indexOf('|');
            const kk = zeilenKey(stationen.indexOf(st), { line: k.slice(0, i), dest: k.slice(i + 1) });
            if (keys.indexOf(kk) < 0) keys.push(kk);
          });
        });
        if (keys.length > 1) paare.push(keys);
      });
      if (paare.length) st.paare = paare;
    } else if (!e.alle && e.wahl && e.wahl.length) {
      const linien = linienAus(st.abfahrten);
      const paare = [];
      e.wahl.forEach(gruppe => {
        const keys = [];
        gruppe.forEach(m => {
          const nimm = (linie, ziel, ruhtMit) => {
            st.gewaehlt.add(linie + '|' + ziel);
            // Richtung des Tokens behalten, auch wenn gerade keine Abfahrt dazu da ist.
            // Sonst schriebe das naechste Speichern nur noch "S4" und die Linie gaelte
            // ab dann in ALLE Richtungen (Paul 25.10.2026).
            if (ruhtMit) {
              if (!st.ruhtRid) st.ruhtRid = {};
              st.ruhtRid[linie + '|' + ziel] = ruhtMit;
            }
            const k = zeilenKey(stationen.indexOf(st), { line: linie, dest: ziel });
            if (keys.indexOf(k) < 0) keys.push(k);
          };
          const treffer = tokenTreffer(linien, m, e.richtungen, st.ridNamen);
          if (treffer.length) {
            treffer.forEach(x => nimm(x.name, x.ziel, x.nurName ? String(m.richtung || '') : ''));
            return;
          }
          // Kein Treffer heisst: diese Linie faehrt GERADE nicht, abends oder am
          // Wochenende. Frueher fiel sie damit aus der Auswahl und aus der Config, das
          // Geraet verlor sie stillschweigend (Kundenmeldungen 24.10.2026, "wo ist die
          // Linie 41 geblieben"). Sie bleibt jetzt stehen, mit dem Ziel aus der
          // Uebergabe, sonst mit dem aus dem Token.
          const wunsch = (e.richtungen || [])
            .filter(x => String(x.line || '').trim().toUpperCase() === String(m.linie).trim().toUpperCase());
          if (wunsch.length) { wunsch.forEach(w => nimm(m.linie, w.ziel || '')); return; }
          // Kein Treffer, und die Uebergabe kennt die Linie an DIESER Station auch
          // nicht. Dann gehoert sie zu einer anderen Station desselben Eintrags, denn
          // das Linienfeld gilt fuer das ganze Segment. Keine Geisterzeile anlegen
          // (Paul 25.10.2026: "U1 R" an Feuersee, "S4 H" am Marienplatz).
          // Faehrt die Linie hier, nur nicht in DIESER Richtung, dann gehoert das Token
          // nicht zu dieser Station. Keine ruhende Zeile: die ist fuer Linien gedacht,
          // die gerade gar nicht fahren, nicht fuer die falsche Richtung.
          const faehrtHier = linien.some(x =>
            String(x.name || '').trim().toUpperCase() === String(m.linie).trim().toUpperCase());
          // Ohne ausdrueckliche Zuordnung waere es wohl die falsche Station. MIT
          // Zuordnung ist es eine echte Linie dieser Station, die gerade nur in einer
          // anderen Richtung faehrt, und sie bleibt als ruhende Zeile stehen.
          if (faehrtHier && !e.genau) return;
          const ruhtMit = String(m.richtung || '').trim();
          const kennt = (st.letzteLinien || [])
            .some(x => String(x.line || '').trim().toUpperCase() === String(m.linie).trim().toUpperCase());
          if (!kennt && !e.genau) return;
          // HIER DARF NICHT GEGEN st.gewaehlt GEPRUEFT WERDEN. Diese Schleife FUELLT
          // die Menge gerade erst, ein Token wuerde also gegen seine eigenen Vorgaenger
          // geprueft. Genau so verschwand Thomas' Linie 41: U1 und U14 waren schon
          // drin, die 41 faehrt abends nicht, und damit flog sie raus, aus der Anzeige
          // UND aus der gespeicherten Zeile (Kunde Thomas Stuttgart, 26.10.2026).
          // Was der Nutzer NICHT gewaehlt hat, kommt hier ohnehin nicht mehr an: die
          // Tokens stammen aus wahlVereinen, also aus den Linien des Pickers.
          // Die Richtung aus dem Token ist eine ID (H, R, p1…, st…), kein Zieltext.
          // Als Beschriftung taugt sie nicht, darum ohne Ziel: gilt in alle Richtungen.
          nimm(m.linie, '', ruhtMit);
        });
        // Nur ein Token mit '+' ist eine Gruppe. Dass eine Linie in zwei Richtungen
        // faehrt, macht noch keine gemeinsame Zeile.
        if (gruppe.length > 1 && keys.length > 1) paare.push(keys);
      });
      if (paare.length) st.paare = paare;
    }
  }
  // Die Gehzeit steht JE STATION im g-Feld und gehoert nicht zur Aufteilung. Sie wurde
  // bisher nur mitgenommen, wenn die Bretter zurueckkamen. Bei "Alle Abfahrten" gibt die
  // Wiederherstellung aber auf, und dann schrieben wir g0 zurueck: die Gehzeit des Kunden
  // war nach einem Besuch weg, dieselbe Falle wie beim Nachtmodus (Paul 25.10.2026).
  gehwegUebernehmen(ueber && ueber.eintraege);
  // Gab es schon eine Config, zaehlt sie: Bretter, Stil, Uhr und Design kommen zurueck.
  ladenAus();
  if (displaysAusEintraegen(ueber && ueber.eintraege)) { allesZeichnen(); return; }
  allesZeichnen();
  // Die Aufteilung kam nicht zurueck, das Aussehen schon.
  if (ueber && aussehenUebernehmen(ueber.eintraege)) allesZeichnen();
  // Gruppen aus der Uebergabe anlegen. Die Verteilung hat die Zeilen einzeln gezaehlt
  // und kann Mitglieder derselben Gruppe auf zwei Displays gelegt haben, darum holen
  // wir sie auf das Display des ersten Mitglieds zurueck. Als Gruppe zaehlen sie dann
  // ohnehin nur eine Zeile. gruppenPruefen raeumt auf, was nicht mehr passt.
  let gruppiert = false;
  stationen.forEach(st => (st.paare || []).forEach(keys => {
    const d = displays.find(x => x.richtungen.indexOf(keys[0]) >= 0);
    if (!d || gruppeVon(d, keys[0])) return;
    keys.slice(1).forEach(k => {
      displays.forEach(x => {
        if (x !== d) x.richtungen = x.richtungen.filter(y => y !== k);
      });
      if (d.richtungen.indexOf(k) < 0) d.richtungen.push(k);
    });
    if (!d.gruppen) d.gruppen = [];
    d.gruppen.push(keys.slice());
    gruppiert = true;
  }));
  if (gruppiert) { displays.forEach(gruppenPruefen); allesZeichnen(); }

})();
</script>
