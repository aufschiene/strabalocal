  // eigenen Behaelter ganz oben in der Karte.
  const kopfEl = document.getElementById('editorKopf');
  if (kopfEl) { kopfEl.innerHTML = h; h = ''; }
  h += '<div class="zeilenkopf"><h2>'
     + (zeitbasiert(dHier) ? 'Linien auf diesem Display' : 'Zeilen dieses Displays') + '</h2>'
     + (!zeitbasiert(dHier) && (dHier.richtungen || []).length > 1
        ? '<button class="link" onclick="gruppeFragen(' + s.index + ')">Gruppieren</button>'
        : '')
     + '</div>';
  if (zeitbasiert(dHier)) {
    // Hier steht keine Zeilen-Zuordnung: welche Linie gerade oben landet, macht der
    // Fahrplan. Darum einfach die gewaehlten Linien, keine Pfeile, nichts grau, auch
    // wenn mehr Linien zugewiesen sind als Zeilen da sind (Paul 22.10.2026).
    const dz = s.index;
    const keysZ = (dHier.richtungen || []);
    if (!keysZ.length) {
      h += '<div class="zeile"><div class="jetzt">Noch nichts zugewiesen. '
         + 'W\u00e4hle unten eine Linie aus.</div></div>';
    }
    // Nach Abfahrt sortiert gibt es keine Zeilenfolge, nach der man hier ordnen
    // koennte. Also nach STATION gruppieren: das ist die Einheit, die hier noch zaehlt
    // (Paul 25.10.2026).
    const proHalt = new Map();
    keysZ.forEach(k => {
      const r = richtungFinden(k);
      if (!r) return;
      if (!proHalt.has(r.station)) proHalt.set(r.station, []);
      proHalt.get(r.station).push({ k: k, r: r });
    });
    // EINE Karte je Station, darunter die gewaehlten Linien als kleine Marken. Eine
    // Karte je Linie waere hier irrefuehrend: in welcher Reihenfolge sie stehen, macht
    // der Fahrplan, nicht diese Liste (Paul 25.10.2026).
    proHalt.forEach((liste, st) => {
      const si = stationen.indexOf(st);
      const block = liste.some(x => x.r.dep.alleStation);
      const deps = liste.map(x => x.r.dep).filter(x => !x.alleStation);
      const zug = liste.some(x => x.r.dep.zugZiel);
      // Zug-Brett: unten stehen die GATTUNGEN, denn die sind hier die Auswahl. Nur wenn
      // keine gewaehlt ist, also alle Abfahrten gelten, steht die Marke des Betreibers
      // da (Paul 26.10.2026).
      const gattungen = zug ? String(st.gattungen || '').split(',')
                                .map(x => x.trim()).filter(x => x && x !== '*') : [];
      const marken = zug
        ? (gattungen.length
           ? miniMarken(gattungen.map(x => ({ line: x, lineColor: deps[0] && deps[0].lineColor,
                                              lineTextColor: deps[0] && deps[0].lineTextColor })))
           : miniMarken(deps.slice(0, 1)))
        : (block ? miniLinien(st) : miniMarken(deps));
      h += '<div class="linie">'
         + '<b style="background:#1b1b1b;color:#fff">' + SYM_HALT + '</b>'
         + '<div class="rumpf"><div class="ziel alles">' + escapeHtmlFt(st.name) + '</div>'
         + '<div class="halt">'
         + (block ? ALLE_TEXT
            : zug ? deps.length + (deps.length === 1 ? ' Ziel' : ' Ziele')
                    + (gattungen.length ? '' : ', alle Gattungen') + ', nach Uhrzeit gemischt'
            : deps.length + (deps.length === 1 ? ' Linie' : ' Linien') + ', nach Uhrzeit gemischt')
         + '</div>'
         + marken + '</div>'
         + '<button class="pfeil weg-x" title="diese Station von diesem Display nehmen"'
         + ' onclick="stationVomBrett(' + dz + ',' + si + ')">' + SYM_X + '</button>'
         + '</div>';
    });
  }
  if (!zeitbasiert(dHier)) {
  const di = s.index;
  h += '<div id="zeilenListe">';
  const keys = (s.display && s.display.richtungen) || [];
  if (!keys.length) {
    h += '<div class="zeile"><div class="jetzt">Noch nichts zugewiesen. '
       + 'W\u00e4hle unten eine Linie aus.</div></div>';
  }
  // Je ZEILE ein Eintrag: eine zusammengefasste Zeile steht einmal da, mit den Marken
  // aller beteiligten Richtungen.
  const einheiten = zeilenEinheiten(dHier);
  for (let i = 0; i < einheiten.length; i++) {
    const teil = einheiten[i];
    if (teil.length === 1 && istUhrKey(teil[0])) {
      h += '<div class="linie ziehbar" data-idx="' + i + '"'
         + ' onpointerdown="zeileGreifen(event,' + di + ',this)"'
         + ' onpointermove="zeileZiehen(event)" onpointerup="zeileLoslassen()"'
         + ' onpointercancel="zeileLoslassen()">'
         + '<b style="background:#1b1b1b;color:#fff">' + SYM_UHR + '</b>'
         + '<div class="rumpf"><div class="ziel">Uhrzeit</div>'
         + '<div class="halt">Zeile ' + (i + 1) + ' &middot; '
         + (einheiten.length === 1 ? 'allein auf dem Display, also die gro\u00dfe Uhr'
                                   : 'frei verschiebbar wie jede Zeile') + '</div>'
         + (einheiten.length === 1
            ? ((fwNeu() || !geraetVersion) ? ''
               : '<div class="hinweis">Geht ab Firmware ' + FW_MIT_UHR + ', dein Ger\u00e4t meldet '
                 + escapeHtmlFt(geraetVersion) + '. Fehlt die Seite am Ger\u00e4t, fehlt '
                 + 'noch das Release.</div>')
            : (!kannUhrZeile(stilVon(dHier))
               ? '<div class="zusatz">' + escapeHtmlFt((STILE.find(y => y.id === stilVon(dHier)) || {}).name || 'Dieser Stil')
                 + ' zeigt eine Abfahrt gro\u00df und kann keine Uhr-Zeile. Allein auf einem '
                 + 'Display geht die Uhr auch dort.</div>'
               : '')) + '</div>'
         + '<span class="pfeile">'
         + '<button class="pfeil" ' + (i === 0 ? 'disabled' : '') + ' title="nach oben"'
         + ' onclick="zeileSchieben(' + di + ',' + i + ',-1)">&#9650;</button>'
         + '<button class="pfeil" ' + (i >= einheiten.length - 1 ? 'disabled' : '') + ' title="nach unten"'
         + ' onclick="zeileSchieben(' + di + ',' + i + ',1)">&#9660;</button>'
         + '</span>'
         + '<button class="pfeil weg-x" title="von diesem Display nehmen"'
         + ' onclick="richtungSchalten(' + di + ',\'' + UHR_KEY + '\',false)">' + SYM_X + '</button>'
         + '</div>';
      continue;
    }
    const zusammen = teil.length > 1;
    const treffer = teil.map(k => richtungFinden(k));
    const rr = treffer[0];
    const dep = rr ? rr.dep : null;
    const zeit = (s.daten[i] && !einzelLinie(dHier)) ? s.daten[i]
               : (dep && s.daten.find(x => x.line === dep.line && x.dest === dep.dest));
    const marken = teil.map((k, n) => {
      const t = treffer[n];
      const f = t ? badgeFarben(t.dep) : { bg: '#4a4a4a', fg: '#fff' };
      if (t && t.dep.alleStation) return '<b style="background:#1b1b1b;color:#fff">' + SYM_HALT + '</b>';
      return '<b style="background:' + f.bg + ';color:' + f.fg + '">'
           + escapeHtmlFt(t ? depMarke(t.dep) : '?') + '</b>';
    }).join('');
    const ziele = teil.map((k, n) => {
      const tr = treffer[n];
      if (!tr) return escapeHtmlFt(keyLokal(k));
      // Beim Block steht der Name der Station oben, "Alle Abfahrten" darunter.
      return escapeHtmlFt(tr.dep.alleStation ? tr.station.name : depText(tr.dep));
    }).join(' &middot; ');
    const halte = [];
    treffer.forEach(t => { if (t && halte.indexOf(t.station.name) < 0) halte.push(t.station.name); });
    // Ruht die Zeile? Nur wenn KEIN Mitglied gerade faehrt.
    const ruht = treffer.length > 0 && treffer.every(t => !t || !t.dep || t.dep.time == null);
    h += '<div class="linie ziehbar' + (zusammen ? ' zusammen' : '') + '" data-idx="' + i + '"'
       + ' onpointerdown="zeileGreifen(event,' + di + ',this)"'
       + ' onpointermove="zeileZiehen(event)" onpointerup="zeileLoslassen()"'
       + ' onpointercancel="zeileLoslassen()">'
       + (zusammen ? '<span class="marken">' + marken + '</span>' : marken)
       + '<div class="rumpf"><div class="ziel'
       + (treffer.every(x => x && x.dep && x.dep.alleStation) ? ' alles' : '') + '">' + ziele
       // Eine ruhende Linie wird grau gezeichnet, und Grau liest sich wie ein Fehler.
       // Darum steht direkt beim Ziel, was los ist, nicht nur klein darunter
       // (Kunde Thomas, 25.10.2026: "was sind die grauen Linien S4, S5, S6?").
       + (ruht ? '<span class="ruht-tag">f\u00e4hrt gerade nicht</span>' : '') + '</div>'
       + '<div class="halt">'
       + (treffer.every(x => x && x.dep && x.dep.alleStation)
          ? ALLE_TEXT + ' &middot; alles, was hier f\u00e4hrt, nach Uhrzeit'
          : 'Zeile ' + (i + 1)
            + (halte.length ? ' &middot; ' + escapeHtmlFt(halte.join(', ')) : '')
            + (zeit && (zeit.time || zeit.time === 0) ? ' &middot; in ' + zeit.time + ' min'
                                                      : ' &middot; kommt wieder, sobald sie f\u00e4hrt'))
       + '</div>'
       + (treffer.length === 1 && treffer[0] && treffer[0].dep.alleStation
          ? miniLinien(treffer[0].station) : '')
       + (zusammen
          ? '<div class="zusatz">' + teil.length + ' Richtungen in einer Zeile &middot; '
            + '<button class="link" onclick="gruppeLoesen(' + di + ',' + i + ')">trennen</button></div>'
          : '')
       + '</div>'
       + '<span class="pfeile">'
       + '<button class="pfeil" ' + (i === 0 ? 'disabled' : '') + ' title="nach oben"'
       + ' onclick="zeileSchieben(' + di + ',' + i + ',-1)">&#9650;</button>'
       + '<button class="pfeil" ' + (i >= einheiten.length - 1 ? 'disabled' : '') + ' title="nach unten"'
       + ' onclick="zeileSchieben(' + di + ',' + i + ',1)">&#9660;</button>'
       + '</span>'
       // Kein eigener Knopf je Zeile mehr: "Zeilen zusammenfassen" steht oben ueber der
       // Liste und macht dasselbe (Paul 23.10.2026).
       + '<button class="pfeil weg-x" title="von diesem Display nehmen"'
       + ' onclick="zeileWeg(' + di + ',' + i + ')">' + SYM_X + '</button>'
       + '</div>';
  }
  h += '</div>';
  }

  el.innerHTML = h;
}

// Farbe eines Linien-Badges: zuerst die offizielle Farbe aus den Abfahrten, sonst die
// eingebaute Wiener U-Bahn-Tabelle, sonst neutral. Genau die Quelle, aus der auch das
// Geraet seine Badges faerbt.
const U_BAHN_FARBEN = { U1: '#e2001a', U2: '#a862a4', U3: '#f39200', U4: '#008d3d', U5: '#00b8aa', U6: '#944210' };
function badgeFarben(dep) {
  const bg = (typeof dvLineColorCss === 'function' ? dvLineColorCss(dep.lineColor) : null)
          || U_BAHN_FARBEN[String(dep.line || '').toUpperCase()] || '#4a4a4a';
  const fg = (typeof dvLineColorCss === 'function' ? dvLineColorCss(dep.lineTextColor) : null) || '#ffffff';
  return { bg, fg };
}

// Liste der LINIEN, nicht der Stationen: die Fahrtrichtung ist das Wesentliche, die
// Station steht als ruhige Unterzeile darunter (Paul 22.10.2026).
// Zeitfenster: kommt spaeter dran und steht darum in einer eigenen Karte ganz unten
// (Paul 22.10.2026). Inhalt unveraendert, nur der Platz ist ein anderer.
// Wie viele Abfahrten ein chronologisches Brett zeigt, ergibt sich fast immer von selbst
// aus dem Stil. Wer es doch von Hand will, findet es unter Erweitert, nicht mitten im
// Hauptweg (Paul 26.10.2026).
function zeilenzahlFeld() {
  const sHier = schirme[zeiger];
  const d = sHier && sHier.display;
  if (!d || !zeitbasiert(d)) return '';
  let h = '<label class="feld" for="zeilenWahl">Wie viele Abfahrten auf Display '
        + (displays.indexOf(d) + 1) + '</label>'
        + '<select id="zeilenWahl" onchange="zeitZeilenSetzen(' + sHier.index + ',this.value)">';
  for (let z = 1; z <= maxZeilen(stilVon(d)); z++) {
    h += '<option value="' + z + '"' + (z === zeitZeilen(d) ? ' selected' : '') + '>' + z + '</option>';
  }
  return h + '</select>';
}

function zeitfensterZeichnen() {
  const el = document.getElementById('zeitfenster');
  if (!el) return;
  const s = schirme[zeiger];
  if (!s) { el.innerHTML = ''; return; }
  const dHier = s.display;
  const di = s.index;
  let h = zeilenzahlFeld();

  // Die Uhr selbst legt man unten aus dem Linien-Topf aufs Display. Hier steht nur,
  // wie sie aussieht.
  h += '<label class="feld">Uhrzeit ' + neuBadge('uhr') + '</label>'
     + '<div class="schieber"><div class="wort">Uhrzeit anzeigen'
     + '<small>Legt die Uhr unten zu deinen Linien, als Zeile oder als ganzes Display</small></div>'
     + '<button class="schiene' + (uhrAn ? ' an' : '') + '" role="switch"'
     + ' aria-checked="' + (uhrAn ? 'true' : 'false') + '" onclick="uhrFeatureSchalten()">'
     + '<span class="kugel"></span></button></div>';
  if (uhrAn) {
    h += '<label class="feld">Zeitformat</label><div class="schalter">'
       + '<button class="' + (uhrSekunden ? 'an' : '') + '" onclick="sekundenSetzen(1)">14:07:32</button>'
       + '<button class="' + (uhrSekunden ? '' : 'an') + '" onclick="sekundenSetzen(0)">14:07</button>'
       + '</div>';
  }
  // Zeitfenster dieses Displays. Das Geraet haengt es am Anzeige-STIL auf, nicht am
  // einzelnen Display: zwei Displays mit demselben Stil teilen sich darum das Fenster.
  // Darauf weisen wir hin, statt es stillschweigend zu ueberschreiben.
  // Helligkeit gilt fuers ganze Geraet, nicht je Display.
  h += '<label class="feld">Helligkeit</label><div class="schalter">';
  [[1, 'Dunkel'], [2, 'Mittel'], [3, 'Hell']].forEach(b => {
    h += '<button class="' + (helligkeit === b[0] ? 'an' : '') + '"'
       + ' onclick="helligkeitSetzen(' + b[0] + ')">' + b[1] + '</button>';
  });
  h += '</div>';

  // Wechselzeiten und Standzeit gehoeren zum Display, wie die Farben auch.
  const c = stilVon(dHier);
  const e = einstFuer(dHier);
  const auto = !e.x && !e.y;
  // Ein Uhr-Brett hat keine Abfahrten, also auch nichts zum Wechseln. Dort bleibt nur
  // die Frage, wie lange die Seite steht (Paul 23.10.2026).
  const nurUhr = zeigtUhr(dHier);
  if (!nurUhr) {
    h += '<label class="feld" style="margin-top:18px">Abfahrtszeiten im Wechsel</label>'
       + '<div class="hinweis" style="margin-top:0">Wie lange jede der beiden Abfahrtszeiten '
       + 'steht, bevor die andere kommt.</div>'
       + '<div class="schalter">'
       + '<button class="' + (auto ? 'an' : '') + '" onclick="wechselAutomatik(' + di + ',true)">'
       + 'Automatisch</button>'
       + '<button class="' + (auto ? '' : 'an') + '" onclick="wechselAutomatik(' + di + ',false)">'
       + 'Selbst einstellen</button></div>';
    if (!auto) {
      [['x', '1. Abfahrt'], ['y', '2. Abfahrt']].forEach(r => {
        h += '<div class="regler"><span class="wort">' + r[1] + '</span>'
           + '<input type="range" min="' + WECHSEL_MIN + '" max="' + WECHSEL_MAX + '" step="1"'
           + ' value="' + (e[r[0]] / 10) + '"'
           + ' oninput="wechselSetzen(' + di + ',\'' + r[0] + '\',this.value)">'
           + '<span class="wert">' + (e[r[0]] / 10) + ' s</span></div>';
      });
    }
  }

  // Dritter Regler: so lange steht das Display, bevor die naechste Seite kommt. Unter
  // der Summe der beiden Wechselzeiten waere die zweite Zeit nie zu sehen.
  const mind = nurUhr ? STANDZEIT_MIN_UHR : standzeitMindestens(e);
  h += '<label class="feld" style="margin-top:14px">Wie lange dieses Display steht</label>'
     + '<div class="regler"><span class="wort">Standzeit</span>'
     + '<input type="range" min="' + mind + '" max="' + STANDZEIT_MAX + '" step="1"'
     + ' value="' + standzeitVon(e, nurUhr) + '" oninput="standzeitSetzen(' + di + ',this.value)">'
     + '<span class="wert">' + standzeitVon(e, nurUhr) + ' s</span></div>'
     + '<div class="hinweis" style="margin-top:0">'
     + ((nurUhr || auto)
        ? 'Mindestens ' + mind + ' Sekunden.'
        : 'Mindestens ' + mind + ' Sekunden, so lange brauchen die beiden Abfahrtszeiten '
          + 'zusammen (' + (e.x / 10) + ' + ' + (e.y / 10) + ').') + '</div>';

  // Bedient sich wie der Nachtmodus: ein Schalter, darunter die zwei Zeiten. Dieselbe
  // Frage, dieselbe Form (Paul 22.10.2026).
  h += '<label class="feld" style="margin-top:18px">Zeitfenster</label>';
  const f = dHier && dHier.fenster;
  h += '<div class="schieber"><div class="wort">Nur zu bestimmten Zeiten zeigen'
     + '<small>Display ' + (di + 1) + ' wird sonst \u00fcbersprungen</small></div>'
     + '<button class="schiene' + (f ? ' an' : '') + '" role="switch"'
     + ' aria-checked="' + (f ? 'true' : 'false') + '" onclick="fensterSchalten(' + di + ')">'
     + '<span class="kugel"></span></button></div>';
  if (f) {
    const stunden = function (feld, wert) {
      let o = '<select onchange="fensterSetzen(' + di + ',\'' + feld + '\',this.value)">';
      for (let x = 0; x < 24; x++) {
        const t = (x < 10 ? '0' + x : x) + ':00';
        o += '<option value="' + t + '"' + (t === wert ? ' selected' : '') + '>' + t + '</option>';
      }
      return o + '</select>';
    };
    h += '<div class="reihe" style="align-items:flex-end">'
       + '<div style="flex:1"><label class="feld">An ab</label>' + stunden('von', f.von) + '</div>'
       + '<div style="flex:1"><label class="feld">Wieder aus</label>' + stunden('bis', f.bis) + '</div>'
       + '</div>';
  }
  // Jedes Display hat jetzt sein eigenes Fenster im masterrow-Eintrag. Bleibt eine
  // Ausnahme: Wien schickt je Bahnsteig einen Eintrag, darum legt die Firmware
  // WL-Eintraege mit gleicher colour absichtlich zu EINEM Display zusammen. Dort gilt
  // das erste gesetzte Fenster (Firmware-Sitzung 22.10.2026).
  const gleicheStile = displays.filter((x, xi) => xi !== di && stilVon(x) === stilVon(dHier));
  const wienHier = istWienDisplay(dHier);
  const wienAuch = gleicheStile.filter(istWienDisplay);
  // Das Fenster steht als w im EINTRAG, gilt also je Seite. Erst eine alte Firmware
  // ohne d<n> legt gleichfarbige Wien-Seiten zusammen und teilt es dann (Paul 23.10.2026).
  if (f && wienHier && wienAuch.length) {
    h += '<div class="hinweis">Gilt für diese Seite. Bis zum nächsten Firmware-Update '
       + 'teilt sich ' + (wienAuch.length === 1 ? 'das andere Wien-Display' : 'die anderen Wien-Displays')
       + ' mit diesem Stil das Fenster noch mit, weil sie dort ein Brett sind.</div>';
  } else if (f) {
    h += '<div class="hinweis">Gilt für diese Seite.</div>';
  }

  el.innerHTML = h;
}

function stationenZeichnen() {
  const el = document.getElementById('stationsliste');
  if (!stationen.length) {
    el.innerHTML = '<div class="hinweis">Noch keine Linie. Die kommen aus dem Schritt davor.</div>';
    return;
  }
  // Weg ist nur, was auf dem GERADE GEWAEHLTEN Display liegt. Alles andere bleibt
  // waehlbar, auch wenn es schon auf einem anderen Display steht.
  const sHier = schirme[zeiger];
  const diHier = sHier ? sHier.index : 0;
  const hier = displays[diHier];
  const vergeben = new Set((hier && hier.richtungen) || []);
  const anderswo = new Map();
  displays.forEach((d, di) => { if (d !== hier) d.richtungen.forEach(k => {
    if (!anderswo.has(k)) anderswo.set(k, []);
    anderswo.get(k).push(di + 1);
  }); });
  // Was noch auf KEINEM Display liegt, kommt nach oben und pocht leise. Sonst
  // uebersieht man genau die Linie, die noch fehlt (Paul 23.10.2026).
  let offen = '', schonWo = '', leer = '';
  let uebrig = 0;
  // Je Station eine Ueberschrift, darunter ihre Linien. Eine lange Liste aus Linien
  // mehrerer Haltestellen liest sich sonst wie ein Haufen: man sucht die Station, nicht
  // die Linie (Paul 26.10.2026). Daneben steht der Schalter, der die ganze Station als
  // EINE Zeile aufs Brett legt statt ihrer Linien.
  // Wien fuehrt JE BAHNSTEIG eine Station, und zwei Bahnsteige derselben Haltestelle
  // heissen gleich. Im Topf stand "Alaudagasse" deshalb zweimal untereinander, einmal je
  // Richtung. Hier zaehlt die Haltestelle, nicht der Steig: eine Ueberschrift, darunter
  // alle Richtungen (Paul 26.10.2026).
  const haltName = st => String(st.name || '').trim().toLowerCase() + '\u0001' + (st.netz || '');
  const haltKopf = (st, si) => {
    const geschwister = stationen.filter(x => haltName(x) === haltName(st));
    const alleBlock = geschwister.every(x => x.alle);
    const istZug = geschwister.some(istZugStation) || geschwister.some(x => x.alleFix);
    return '<div class="haltkopf"><span style="display:flex;align-items:center;gap:7px;">'
      + SYM_HALT + '<span>' + escapeHtmlFt(st.name) + '</span></span>'
      // Zwei Zustaende, beide sichtbar: man soll sehen, dass es die Wahl gibt, und in
      // welchem Zustand die Station gerade ist (Paul 26.10.2026).
      + (istZug ? ''
         : '<span class="haltwahl">'
           + '<button class="' + (alleBlock ? '' : 'an') + '"'
           + (alleBlock ? ' onclick="halteAlsBlock(' + si + ',false)"' : '')
           + '>Linien</button>'
           + '<button class="' + (alleBlock ? 'an' : '') + '"'
           + (alleBlock ? '' : ' onclick="halteAlsBlock(' + si + ',true)"')
           + '>Station</button></span>')
      + '</div>';
  };
  const kopfGesetzt = new Set();
  const gesehenImTopf = new Set();
  stationen.forEach((st, si) => {
    // NUR die gewaehlten Richtungen, dieselbe Liste wie auf den Displays. Vorher lief
    // das ueber alle Abfahrten der Station, und dann stand im Pool die halbe
    // Haltestelle: in Linz lagen unter den vier gewaehlten Linien noch 600, 618, 411
    // und der Rest (Paul 23.10.2026). Wer eine weitere Linie will, holt sie sich in
    // der Linienauswahl.
    const zeilen = zeilenEintraege(st);
    let kopfOffen = !kopfGesetzt.has(haltName(st));
    zeilen.forEach(d => {
      const k = zeilenKey(si, d);
      if (vergeben.has(k)) return;
      // Zwei Bahnsteige koennen dieselbe Linie mit demselben Ziel tragen. Unter EINER
      // Ueberschrift sieht das wie ein Doppelgaenger aus, also nur einmal zeigen.
      const sicht = haltName(st) + '\u0002' + d.line + '|' + d.dest;
      if (gesehenImTopf.has(sicht)) return;
      gesehenImTopf.add(sicht);
      uebrig++;
      if (kopfOffen) { offen += haltKopf(st, si); kopfOffen = false; kopfGesetzt.add(haltName(st)); }
      const f = badgeFarben(d);
      const wo = anderswo.get(k) || [];
      // Schon woanders? Trotzdem voll sichtbar und waehlbar, nur mit einem Zeichen
      // daneben. Entfernen gibt es hier nicht: aus dem Pool verschwindet nichts.
      // Ein Stations-Block ist keine Linie: Haltestellen-Zeichen, Name der Station, und
      // die Linien klein darunter, genau wie die Stationskarte in der Linienauswahl
      // (Paul 25.10.2026: "da steht dann einfach Station X, das Icon ist eine
      // Haltestelle und darunter die Linien-Icons kleiner").
      const block = !!d.alleStation;
      const zeile = '<div class="linie' + (wo.length ? '' : ' neu-dran') + '"'
         + ' title="auf das gew\u00e4hlte Display legen"'
         + ' onclick="richtungSchalten(' + diHier + ',\'' + k.replace(/'/g, "\\'") + '\',true)">'
         + (block
            ? '<b style="background:#1b1b1b;color:#fff">' + SYM_HALT + '</b>'
            : '<b style="background:' + f.bg + ';color:' + f.fg + '">' + escapeHtmlFt(d.line) + '</b>')
         + '<div class="rumpf"><div class="ziel' + (block ? ' alles' : '') + '">'
         + escapeHtmlFt(block ? st.name : depText(d)) + '</div>'
         + '<div class="halt">'
         // Der Name steht schon in der Ueberschrift darueber.
         + (block ? ALLE_TEXT : '')
         + (d.beispiel ? (block ? ' &middot; ' : '') + 'Beispielzeiten' : '')
         + (wo.length ? ((block || d.beispiel) ? ' &middot; ' : '') + 'schon auf Display ' + wo.join(' und ') : '')
         + (!block && !d.beispiel && !wo.length ? 'noch auf keinem Display' : '') + '</div>'
         + (block ? miniLinien(st) : '') + '</div>'
         + (wo.length ? '<span class="doppel" title="liegt schon auf Display '
                        + wo.join(' und ') + '">' + DOPPEL_ICON + '</span>' : '')
         + '</div>';
      offen += zeile;
    });
    if (!zeilen.length) {
      leer += '<div class="linie aus"><div class="rumpf"><div class="ziel">' + escapeHtmlFt(st.name)
         + '</div><div class="halt">'
         + (st.fehler ? 'nicht geladen, ' + escapeHtmlFt(st.fehler) : 'keine Abfahrten geladen')
         + '</div></div></div>';
    }
  });
  let h = offen + schonWo + leer;
  // Die Uhr liegt im selben Topf wie die Linien: antippen legt sie aufs Display.
  // Bei Stilen ohne Uhr-Zeile geht nur das ganze Brett als Uhr, also nur auf einem
  // Display, das sonst leer ist.
  const uhrGeht = hier && (kannUhrZeile(stilVon(hier)) || !hier.richtungen.length);
  if (uhrAn && uhrGeht && !hatUhrZeile(hier)) {
    h = h + '<label class="feld">Dazu</label>'
      + '<div class="linie" title="Uhrzeit auf dieses Display legen"'
      + ' onclick="richtungSchalten(' + diHier + ',\'' + UHR_KEY + '\',true)">'
      + '<b style="background:#1b1b1b;color:#fff">' + SYM_UHR + '</b>'
      + '<div class="rumpf"><div class="ziel">Uhrzeit ' + neuBadge('uhr') + '</div>'
      + '<div class="halt">eine Zeile mit der aktuellen Zeit, allein auf dem Display '
      + 'wird daraus die gro\u00dfe Uhr</div></div></div>';
    uebrig++;
  }
  if (!uebrig) h = '<div class="hinweis">Alle deine Linien liegen bereits auf diesem Display.</div>';
  const t = document.getElementById('poolTitel');
  if (t) t.textContent = 'Linien f\u00fcr Display ' + (diHier + 1);
  el.innerHTML = h;
}

// Zieltext als Richtungs-Referenz in der Config. Die Trennzeichen des Formats muessen
// raus, sonst zerfaellt das Token beim Lesen: Berliner Ziele tragen den Pfeil als '>'
// ("Herzbergstr./ Siegfriedstr. -> Bus"), und die Firmware las dann eine abgeschnittene
// Richtung plus einen Rest als eigenes Token. Gleiche Regel wie im alten Konfigurator.
function zielRef(txt) {
  return String(txt == null ? '' : txt)
    .replace(/[\u2192\u27f6\u2794]/g, ' ')
    .replace(/->/g, ' ')
    .replace(/[>|;,+]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Ein Token je ZEILE, in der Reihenfolge der Zeilen: "Linie>Ziel", Mitglieder einer
// Gruppe mit '+' verbunden. Der Zieltext MUSS mit: die Firmware nimmt nur Tokens mit
// Trenner als Richtungsfilter (main.cpp, lineFilterDest). Stand nur der Linienname da,
// zeigte das Geraet auch die Gegenrichtung, obwohl nur eine gewaehlt war
// (Paul 23.10.2026). Wien braucht ihn nicht, dort steckt die Richtung in der rbl.
function tokenListe(d) {
  const raus = [];
  zeilenEinheiten(d).forEach(teil => {
    const stueck = [];
    // Ein '+'-Token gehoert als GANZES zu einem Stop, also zaehlt der erste.
    let vonRbl = '';
    teil.forEach(k => {
      if (istUhrKey(k)) return;
      const r = richtungFinden(k);
      if (!r) return;
      if (!vonRbl) vonRbl = r.station.rbl;
      // Immer zuerst die Richtungs-Id, nur ohne sie den bereinigten Zieltext. Genau
      // so macht es der alte Konfigurator, und die Firmware vergleicht die Id exakt.
      const ref = r.dep.rid ? zielRef(r.dep.rid) : zielRef(r.dep.dest);
      stueck.push(ref ? r.dep.line + '>' + ref : r.dep.line);
    });
    if (stueck.length) raus.push({ tok: stueck.join('+'), rbl: vonRbl });
  });
  return raus;
}

// Dasselbe, aber FLACH: ein Token je Linie, die Gruppen stehen daneben im m-Feld
// (m<tokenIndex>:<gruppe>). Der Konfigurator schreibt Gruppen seit jeher so, und er
// liest beides. Schrieben wir '+', waere dieselbe Gruppe nach dem naechsten Speichern
// drueben wieder ein m, und die Zeile saehe jedes Mal anders aus. Eine Form fuer beide
// Oberflaechen, damit ein Brett den Weg hin und zurueck unveraendert uebersteht
// (abgestimmt mit der Konfigurator-Sitzung, 25.10.2026).
function tokenListeFlach(d) {
  const liste = [], merges = [];
  zeilenEinheiten(d).forEach((teil, gi) => {
    const echte = teil.filter(k => {
      const r = richtungFinden(k);
      return !istUhrKey(k) && r && !r.dep.alleStation && !r.dep.zugZiel;
    });
    echte.forEach(k => {
      const r = richtungFinden(k);
      const ref = r.dep.rid ? zielRef(r.dep.rid) : zielRef(r.dep.dest);
      // Nur eine Zeile mit mehreren Linien ist eine Gruppe. Dass eine Linie in zwei
      // Richtungen faehrt, macht noch keine.
      const gid = echte.length > 1 ? (gi + 1) : 0;
      if (gid) merges.push(liste.length + ':' + gid);
      liste.push({ tok: ref ? r.dep.line + '>' + ref : r.dep.line,
                   rbl: r.station.rbl, gid: gid });
    });
  });
  return { liste: liste, merges: merges };
}

// Die eigenen Designs als customrow: ein Segment je Slot, "c<slot>|B…|T…|N…".
// Geschrieben wird nur, was von der Vorgabe abweicht, damit die Zeile kurz bleibt.
// Reihenfolge und Buchstaben wie im alten Konfigurator, die Firmware liest beides gleich.
const EIGEN_VORGABE = eigenStd();
function customrowBauen() {
  const segs = [];
  for (let c = EIGEN_MIN; c <= EIGEN_MAX; c++) {
    const g = eigene[c];
    if (!g) continue;
    const teile = [];
    ['B', 'T', 'U', 'H', 'V'].forEach(x => { if (g[x] && g[x] !== EIGEN_VORGABE[x]) teile.push(x + g[x]); });
    ['G', 'F', 'A', 'W', 'M'].forEach(x => { if (g[x] && g[x] !== EIGEN_VORGABE[x]) teile.push(x + g[x]); });
    // Linienfarben unveraendert durchreichen, der Baukasten hier stellt sie nicht ein.
    const p = [];
    Object.keys(g.P || {}).forEach(ln => {
      const lc = g.P[ln] || {};
      const name = String(ln).replace(/[|;:,]/g, '');
      if (name) p.push(name + ':' + (lc.bg || '') + ':' + (lc.tx || '') + ':' + (lc.ol || ''));
    });
    if (p.length) teile.push('P' + p.join(','));
    if (g.N) teile.push('N' + g.N);
    if (teile.length) segs.push('c' + (c - 100) + '|' + teile.join('|'));
  }
  return segs.join(';');
}
function customrowLesen(zeile) {
  String(zeile || '').split(';').forEach(seg => {
    seg = seg.trim();
    if (!seg) return;
    const teile = seg.split('|');
    const m = /^c(\d+)$/.exec(teile[0].trim());
    if (!m) return;
    const c = 100 + parseInt(m[1], 10);
    if (!istEigen(c)) return;
    const g = eigenVon(c);
    g.N = '';
    for (let i = 1; i < teile.length; i++) {
      const tok = teile[i];
      if (!tok) continue;
      const buch = tok[0], wert = tok.slice(1);
      if (buch === 'N') g.N = wert;
      else if (buch === 'P') {
        g.P = {};
        wert.split(',').forEach(x => {
          const st = x.split(':');
          if (st[0]) g.P[st[0]] = { bg: st[1] || '', tx: st[2] || '', ol: st[3] || '' };
        });
      } else if ('BTUHVGFAWM'.indexOf(buch) >= 0) g[buch] = wert;
    }
    if (!g.N) g.N = 'Mein Display ' + (c - 100);
  });
}

// Die Config, wie sie das Geraet bekommt. Eine Quelle fuer die Anzeige unten UND fuer
// das Speichern, damit beides nie auseinanderlaeuft.
function configBauen() {
  const teile = [], zeitTeile = [];
  // Die timerow traegt die zeitbasierten Display-TYPEN (OEBB, Westbahn, SBB), NICHT
  // die Sortierung. Die steht als 's' in den displaysettings.
  const teileEinsammeln = (stuecke, c) => {
    const topf = istZeitTyp(c) ? zeitTeile : teile;
    stuecke.forEach(x => topf.push(x));
  };
  displays.forEach((d, di) => {
    // WIEN: die Firmware bindet jede Linie an einen Stop (stopId:Linie). Steht in EINEM
    // Eintrag eine Liste aus mehreren rbls, landen am Ende alle Linien am LETZTEN Stop
    // der Liste, und alles was dort nicht faehrt verschwindet. Am Geraet gesehen
    // (Paul 23.10.2026): "4111,4201|U1,U2" wurde zu "4201:U1,4201:U2", also blieb nur
    // die U2 uebrig. Darum fuer Wien EIN EINTRAG JE STATION, so wie es der alte
    // Konfigurator macht. Fremdnetze duerfen mehrere rbls in einem Eintrag fuehren,
    // dort ist der Schluessel Linie:Ziel und das Multi-rbl-Segment ist gewollt.
    const proStation = new Map();   // rbl -> { station, linien: [] }
    d.richtungen.forEach(k => {
      const r = richtungFinden(k);
      if (!r) return;
      if (!proStation.has(r.station.rbl)) proStation.set(r.station.rbl, { station: r.station, linien: [], keys: [], alle: false, ziele: [] });
      const eintrag = proStation.get(r.station.rbl);
      // Der Stations-Block ist keine Linie: er fuellt das Linienfeld allein mit '*'.
      if (r.dep.alleStation) { eintrag.alle = true; return; }
      // Zug-Zeile: sie steht fuer ein ZIEL, nicht fuer eine Linie. Das Linienfeld traegt
      // die Gattungen, die Ziele stehen in der rbl.
      if (r.dep.zugZiel) {
        if (eintrag.ziele.indexOf(r.dep.zugZiel) < 0) eintrag.ziele.push(r.dep.zugZiel);
        return;
      }
      if (eintrag.linien.indexOf(r.dep.line) < 0) { eintrag.linien.push(r.dep.line); eintrag.keys.push(k); }
    });
    if (!proStation.size && !zeigtUhr(d)) return;   // leeres Display kommt nicht ans Geraet

    const wien = stopIdFormat(d);
    const c = stilVon(d);
    const w = fensterToken(d);
    // s: 1 = feste Reihenfolge, 2 = je Linie eine Zeile mit erster und zweiter Abfahrt
    // im Wechsel, 3 = flach nach Uhrzeit. Unser "Naechste Abfahrten" ist die 3
    // (Firmware-Sitzung 23.10.2026).
    // Auch bei nur EINER Linie bleibt es bei s1. Das Geraet erkennt ein einzelnes
    // Zeilen-Token und zeigt dann die naechsten Abfahrten genau dieser Linie UND
    // Richtung. s3 wuerde stattdessen alle Richtungen der Linie zeigen, denn es filtert
    // nur nach Liniennamen (Firmware-Sitzung 23.10.2026). Leere Zeilen kamen vom
    // Server-Deckel an grossen Knoten, nicht von der Sortierung.
    const sTeil = kannSortieren(c) ? '|s' + (zeitbasiert(d) ? '3' : '1') : '';
    const zTeil = uhrToken(d);
    // d<n> = Nummer des Displays. Eintraege mit gleichem d sind EIN Brett, egal welches
    // Netz und welche Farbe. Das loest den Wien-Merge und x1 gleich mit ab
    // (Firmware-Sitzung 23.10.2026). Alte Firmware ueberliest das Feld.
    const dTeil = '|d' + (di + 1);
    // Design je Display, in JEDEN Eintrag dieses Displays.
    const dsgTeil = designTeil(d);
    // Gruppen-Marker: nur sinnvoll, solange alle Linien in EINEM Eintrag stehen.
    const alleLinien = [];
    proStation.forEach(e => e.linien.forEach(l => { if (alleLinien.indexOf(l) < 0) alleLinien.push(l); }));
    const merges = [];
    zeilenEinheiten(d).forEach((teil, gi) => {
      if (teil.length < 2) return;
      teil.forEach(k => {
        const r = richtungFinden(k);
        const idx = r ? alleLinien.indexOf(r.dep.line) : -1;
        const marke = idx + ':' + (gi + 1);
        if (idx >= 0 && merges.indexOf(marke) < 0) merges.push(marke);
      });
    });

    const stuecke = [];
    if (!proStation.size) {
      // Nur die Uhr, keine Station: Platzhalter-Station CLOCK:<n>, eindeutig je Brett.
      // Die Firmware fragt sie nie beim Server ab und zaehlt das Brett in der Rotation
      // immer als zeigbar (Firmware-Sitzung 23.10.2026).
      // Wird IMMER geschrieben (Paul 23.10.2026). Kennt ein Geraet CLOCK noch nicht,
      // bleibt dort eine Seite leer, kaputt geht nichts.
      stuecke.push('CLOCK:' + (di + 1) + '|*|c' + c + '|g0|r' + zeilenVon(d)
                 + (w ? '|w' + w : '') + '|z1' + sTeil + dTeil + dsgTeil);
    } else if (wien && proStation.size > 1) {
      // Je Station ein Eintrag. Sie gehoeren zusammen, also KEIN x1: das Geraet legt
      // gleichfarbige Wien-Eintraege zu einem Brett zusammen, und genau das wollen wir
      // hier. Dass dadurch auch ein zweites Wien-Display mit gleichem Stil mithineinfaellt,
      // steht als Hinweis in der Oberflaeche.
      // Gruppen ueber MEHRERE Wien-Eintraege kann nur das m-Feld tragen: Token <idx>
      // dieses Eintrags gehoert zu Gruppe <gid>, und gleiche gid fuehrt die Firmware
      // ueber Eintragsgrenzen hinweg zu einer Zeile zusammen. Ohne das standen zwei
      // zusammengefasste Linien von zwei Bahnsteigen am Geraet wieder untereinander
      // (Paul 24.10.2026, Linie 5 mit Linie 46).
      const gidVon = new Map();
      zeilenEinheiten(d).forEach((teil, gi) => {
        if (teil.length > 1) teil.forEach(k => gidVon.set(k, gi + 1));
      });
      proStation.forEach((e, rbl) => {
        const marken = [];
        (e.keys || []).forEach((k, i) => {
          const gid = gidVon.get(k);
          if (gid) marken.push(i + ':' + gid);
        });
        stuecke.push(rbl + '|' + (e.linien.length ? e.linien.join(',') : '*')
                   + '|c' + c + '|g' + gehwegStation(e.station) + '|r' + zeilenVon(d)
                   + (marken.length ? '|m' + marken.join(',') : '')
                   + (w ? '|w' + w : '') + zTeil + sTeil + dTeil + dsgTeil);
      });
    } else {
      // Zug-Bretter: ein Eintrag je Station, rbl = "von>ziel1~ziel2" aus den ZEILEN, die
      // gerade darauf liegen. Wer ein Ziel entfernt, entfernt es damit auch aus der rbl.
      // Das Linienfeld traegt die Gattungen aus der Linienauswahl.
      proStation.forEach((e, rbl) => {
        if (!e.ziele || !e.ziele.length) return;
        const kahl = rblTeile(rbl).kahl;
        const von = kahl.indexOf('>') > 0 ? kahl.slice(0, kahl.indexOf('>')) : kahl;
        const gattungen = String(e.station.gattungen || '').trim();
        stuecke.push(von + '>' + e.ziele.join('~') + '|' + (gattungen || '*')
                   + '|c' + c + '|g' + gehwegStation(e.station) + '|r' + zeilenVon(d)
                   + (w ? '|w' + w : '') + zTeil + sTeil + dTeil + dsgTeil);
      });
      // Stationen mit "Alle Abfahrten" bekommen je einen eigenen Eintrag: ihr Linienfeld
      // ist '*', und das vertraegt sich nicht mit einer Liste konkreter Linien daneben.
      proStation.forEach((e, rbl) => {
        if (!e.alle) return;
        stuecke.push(rblTeile(rbl).kahl + '|*|c' + c + '|g' + gehwegStation(e.station)
                   + '|r' + zeilenVon(d) + (w ? '|w' + w : '') + zTeil + sTeil + dTeil + dsgTeil);
      });
      // Wie viele Stationen teilen sich das gemeinsame Segment? Die Bloecke stehen
      // schon je einzeln da und zaehlen hier nicht mit.
      let gemeinsam = 0;
      proStation.forEach(e => { if (!e.alle && !(e.ziele && e.ziele.length)) gemeinsam++; });

      // AB FIRMWARE 2.6: ein Eintrag JE STATION, zusammengehalten vom d-Feld, so wie es
      // der Konfigurator seit 25.10.2026 auch schreibt. Damit traegt jede Station ihre
      // eigenen Linien, ihre eigene Gehzeit und ihren eigenen Filter, und die beiden
      // Kruecken des Komma-Formats fallen weg: das '!'-Token und das q-Feld.
      // Nur mit gemeldeter Version: ein aelteres Geraet kennt das d nicht und zeigte
      // sonst ploetzlich zwei Bretter statt einem (abgestimmt mit der Konfigurator-
      // Sitzung, 25.10.2026).
      if (gemeinsam > 1 && fwNeu()) {
        const flachN = tokenListeFlach(d);
        proStation.forEach((e, rbl) => {
          if (e.alle) return;
          const kahl = rblTeile(rbl).kahl;
          const meine = flachN.liste.filter(x => x.rbl === rbl);
          const marken = [];
          meine.forEach((x, i) => { if (x.gid) marken.push(i + ':' + x.gid); });
          stuecke.push(kahl + '|' + (meine.length ? meine.map(x => x.tok).join(',') : '*')
                     + '|c' + c + '|g' + gehwegStation(e.station) + '|r' + zeilenVon(d)
                     + (marken.length ? '|m' + marken.join(',') : '')
                     + (w ? '|w' + w : '') + zTeil + sTeil + dTeil + dsgTeil);
        });
        teileEinsammeln(stuecke, c);
        return;
      }

      const rbls = [], gw = [], reihen = [];
      proStation.forEach((e, rbl) => {
        if (e.alle || (e.ziele && e.ziele.length)) return;
        // Welche Linie zu WELCHEM Stop gehoert, steht ausschliesslich im '!'-Teil der
        // rbl. Stehen zwei Stationen in EINEM Segment, ist das Linienfeld dahinter
        // gemeinsam, und ohne den Teil kann es beim naechsten Oeffnen niemand mehr
        // auseinanderhalten: eine Linie, die zufaellig an beiden haelt, landet dann an
        // beiden (Kunde Thomas, 41 und 43 an Feuersee, 25.10.2026).
        // Nicht bei Wien, dort hat ohnehin jede Station ihren eigenen Eintrag, und nicht
        // bei den Zug-Brettern, die kennen das Token nicht.
        // Nur bei MEHREREN Stationen: bei einer ist die Zuordnung ohnehin eindeutig,
        // und 2.6.1 findet den Stop fuer die GEHZEIT nicht mehr, sobald ein '!' dran
        // haengt (Firmware-Sitzung 25.10.2026, dort behoben, aber erst im naechsten
        // Release). So trifft es nur die Configs, die das Token wirklich brauchen.
        const kahl = rblTeile(rbl).kahl;
        const marke = (gemeinsam > 1 && linienTokenErlaubt(e.station, c, e.linien))
          ? '!' + e.linien.join('~') : '';
        rbls.push(kahl + marke);
        reihen.push(rbl);
        gw.push(gehwegStation(e.station));
      });
      const gTeil = gw.every(x => x === gw[0]) ? String(gw[0]) : gw.join(',');
      // Wien: Liniennamen, die Richtung steckt im Bahnsteig, und Gruppen ueber Eintraege
      // hinweg braucht das m-Feld. Sonst ein Token je Zeile mit Ziel, Gruppen per '+'.
      const flach = wien ? { liste: alleLinien.map(x => ({ tok: x, rbl: '' })), merges: merges }
                         : tokenListeFlach(d);
      const liste = flach.liste;
      const tok = liste.map(x => x.tok);
      // q: je Linien-Token der Index seiner Station in der rbl-Liste, 0-basiert, gezaehlt
      // wie die Komma-Liste in Feld 1 dasteht. Loest den einzigen Fall, den sonst nichts
      // loest: dieselbe Linie mit DERSELBEN Richtungs-Id an zwei Stationen eines
      // Segments (Stuttgart, 41 nach Berliner Platz an beiden Haltestellen).
      // Buchstabe und Regeln mit der Firmware-Sitzung festgelegt (25.10.2026).
      let qTeil = '';
      if (!wien && reihen.length > 1 && liste.length) {
        qTeil = '|q' + liste.map(x => Math.max(0, reihen.indexOf(x.rbl))).join(',');
      }
      if (rbls.length)
      stuecke.push(rbls.join(',') + '|' + (tok.length ? tok.join(',') : '*')
                 + '|c' + c + '|g' + gTeil + '|r' + zeilenVon(d)
                 + (flach.merges.length ? '|m' + flach.merges.join(',') : '')
                 + qTeil
                 + (w ? '|w' + w : '') + zTeil + sTeil + dTeil + dsgTeil);
    }
    teileEinsammeln(stuecke, c);
  });
  // colour-Liste parallel zu den Segmenten: Firmware vor 2.5.3 erkennt eine
  // Multi-Display-Config nur am Komma in dieser Liste (catchit-cities, Kunde Johann).
  const farben = [];
  teile.concat(zeitTeile).forEach(seg => {
    const m = seg.match(/\|c(\d+)(?:\||$)/);
    if (m) farben.push(m[1]);
  });
  // Was diese Oberflaeche kann, das Geraeteformat aber noch nicht traegt.
  const feiner = [];
  stationen.forEach(st => {
    Object.keys(st.gehwegRichtungen || {}).forEach(z => {
      feiner.push(st.rbl + ' Richtung ' + z + ': ' + st.gehwegRichtungen[z] + ' min');
    });
    Object.keys(st.gehwegLinien || {}).forEach(k => {
      feiner.push(st.rbl + ' ' + k.replace('|', ' nach ') + ': ' + st.gehwegLinien[k] + ' min');
    });
  });
  // Uhr-Bretter ohne Station: der Eintrag steht in der Zeile, die Firmware muss die
  // Gruppe ohne rbl aber erst lernen.
  // Nur noch ein Hinweis, falls das Geraet sich aelter meldet: geschrieben wird es immer.
  const uhren = [];
  if (geraetVersion && !fwNeu()) displays.forEach((d, i) => {
    if (zeigtUhr(d) && d.richtungen.length <= 1) uhren.push('Display ' + (i + 1));
  });
  return {
    masterrow: teile.join(';'),
    timerow: zeitTeile.join(';'),
    displaysettings: displaysettingsBauen(),
    colourListe: farben.join(','),
    uhren: uhren,
    feiner: feiner
  };
}

// Die Rohzeile steht nicht mehr auf der Seite (Paul 23.10.2026). configBauen bleibt,
// davon lebt das Speichern; hier wird nur noch gezeichnet, wenn das Feld existiert.
function ausgabeZeichnen() {
  const el = document.getElementById('mrowAus');
  if (!el) return;
  if (!stationen.length) { el.textContent = '(noch keine Station)'; return; }
  const c = configBauen();
  el.textContent = (c.masterrow ? 'masterrow: ' + c.masterrow : '(keine feste Zeile)')
                 + (c.uhren.length ? '\n\nUhr ohne Station geht ab Firmware ' + FW_MIT_UHR
                                   + ', dein Ger\u00e4t meldet ' + geraetVersion
                                   + '. Fehlt die Seite am Ger\u00e4t, fehlt das Release:\n'
                                   + c.uhren.join(', ') : '')
                 + (c.timerow ? '\n\ntimerow: ' + c.timerow : '')
                 + (c.displaysettings ? '\n\ndisplaysettings: ' + c.displaysettings : '')
                 + '\n\nhelligkeit: ' + ['', 'dunkel', 'mittel', 'hell'][helligkeit]
                 + '\n\nnachtmodus: ' + (nacht.an ? nacht.von + '-' + nacht.bis + ' Uhr aus' : 'aus')
                 + (c.feiner.length ? '\n\nGehweg feiner als je Station (kennt die alte Firmware noch nicht):\n'
                                    + c.feiner.join('\n') : '');
}

// ---- Ans Geraet speichern ---------------------------------------------------------------
// Das Geraet nimmt die Config als Formular auf http://<host>/config entgegen. Es startet
// dabei von seiner BESTEHENDEN Config und ueberschreibt nur Felder, die mitkommen
// (Config new_config = global_settings.GetConfig() im Handler). Darum schicken wir genau
// das, was diese Oberflaeche einstellt, und fassen den Rest nicht an.
const GERAETE_HOSTS = (function () {
  const eigen = new URLSearchParams(location.search).get('device');
  return eigen ? [eigen] : ['catch.local', 'straba.local'];
})();

function stand(text) {
  const el = document.getElementById('speicherStand');
  if (el) el.textContent = text || '';
}

// Erreichbarkeit: HEAD ohne CORS. Die Antwort ist undurchsichtig, aber sie kommt nur,
// wenn der Host ueberhaupt da ist. Nach 4 Sekunden geben wir auf und nehmen den naechsten.
async function hostSuchen() {
  for (const h of GERAETE_HOSTS) {
    stand('Suche ' + h + ' ...');
    const steuer = new AbortController();
    const uhr = setTimeout(() => steuer.abort(), 4000);
    try {
      await fetch('http://' + h + '/', { method: 'HEAD', mode: 'no-cors', cache: 'no-store', signal: steuer.signal });
      clearTimeout(uhr);
      return h;
    } catch (e) {
      clearTimeout(uhr);
    }
  }
  return null;
}

function speichernFragen() {
  const c = configBauen();
  if (!c.masterrow && !c.timerow) {
    sagen('Nichts zu speichern', 'Es ist noch kein Display mit Linien da.');
    return;
  }
  dialogZeigen('Auf das Ger\u00e4t schreiben',
    'Die Einstellungen gehen an ' + GERAETE_HOSTS[0] + '. Dein catch it startet danach neu.',
    [{ text: 'Abbrechen', still: true }, { text: 'Speichern', tun: speichern }], 'warnung');
}

// Laeuft die Seite im Geraete-Portal (catch.local/lines zeigt uns in einem iframe)?
// Dann darf sie NICHT selbst zu http://catch.local greifen: das Portal laedt uns ueber
// https, der Browser blockt den Mischverkehr. Stattdessen reicht die Elternseite die
// Config weiter, genau wie bei catchit-cities (Paul 23.10.2026).
function imRahmen() {
  try { return !!(window.parent && window.parent !== window); } catch (e) { return false; }
}

// Ein Datensatz fuer beide Wege. Das Geraete-Portal setzt ALLE Formularfelder und
// nimmt fuer fehlende seine Vorgaben, darum schicken wir auch die alten Einzelfelder
// mit, sonst faende sich danach Helligkeit 3 und Nachtmodus aus wieder.
function geraeteDaten() {
  const c = configBauen();
  const erste = displays[0];
  const e = erste ? einstFuer(erste) : standardEinst();
  // rbl und filter MUESSEN mit: die Seite des Geraets schickt ihr Formular nur ab,
  // wenn data.rbl gesetzt ist (fillAndSubmit: "if (data.rbl) { ... form.submit(); }").
  // Ohne das fuellt sie brav alle Felder und tut dann nichts (Paul 23.10.2026).
  // Inhaltlich gewinnt ohnehin die masterrow, die positionalen Felder baut das Geraet
  // daraus neu.
  const rbls = [], filter = [];
  (c.masterrow + ';' + c.timerow).split(';').forEach(function (seg) {
    seg = seg.trim();
    if (!seg) return;
    const teile = seg.split('|');
    if (teile.length < 2) return;
    rbls.push(teile[0]);
    // In das alte filter-Feld gehoeren NUR Liniennamen, keine Richtungen. Die Tokens
    // der masterrow tragen seit 23.10.2026 ein ">Richtung", und das haette hier
    // "U8>p1 (U8)s100003" als Liniennamen ergeben, den keine Abfahrt traegt. Das Feld
    // ist ohnehin nur der Rueckfall, die Wahrheit steht in der masterrow.
    const feld = teile[1].trim();
    if (!feld || feld === '*') { filter.push('*'); return; }
    const namen = [];
    feld.split(',').forEach(function (tok) {
      tok.split('+').forEach(function (teil) {
        const n = teil.split('>')[0].trim();
        if (n && namen.indexOf(n) < 0) namen.push(n);
      });
    });
    filter.push(namen.join(',') || '*');
  });
  return {
    type: 'setRBL',
    rbl: rbls.join(','),
    filter: filter.join('|'),
    // IMMER 1. Die 2 ist NICHT "mehrere Bretter", sondern die alte Slideshow: das Geraet
    // zerlegt dann JEDES Brett zusaetzlich in eine Seite je Linie und Richtung, und
    // sowohl die feste Zeilenfolge als auch die chronologische sind dabei aus (beide
    // pruefen _displayMode != 2). Pauls U8 und U2 standen darum auf zwei Seiten statt
    // untereinander. Zwischen den Brettern blaettert das Geraet auch in Modus 1
    // (Firmware-Sitzung 23.10.2026).
    displaymode: '1',
    // Ohne dieses Feld setzt die Geraeteseite die Zeilenzahl auf 2. Die Wahrheit steht
    // je Eintrag in der masterrow, das hier ist nur der Rueckfall.
    zeilen: String(displays.reduce(function (m, d) { return Math.max(m, zeilenVon(d)); }, 1)),
    masterrow: c.masterrow,
    timerow: c.timerow,
    displaysettings: c.displaysettings,
    // Die Designs der eigenen Displays. Ohne das Feld setzt die Geraeteseite es leer
    // und das Aussehen waere nach dem Speichern weg.
    customrow: customrowBauen(),
    colour: c.colourListe,
    // Ohne sortmode behaelt das Geraet seinen alten Wert. Steht dort 2 (chronologisch),
    // ignoriert es unsere feste Zeilenfolge. Displays in der timerow erzwingen 2 selbst.
    sortmode: c.masterrow ? '1' : '2',
    displaylight: String(helligkeit),
    nightmode: nacht.an ? '1' : '0',
    nightstart: String(nacht.von),
    nightend: String(nacht.bis),
    stopinterval: String(standzeitVon(e, erste ? zeigtUhr(erste) : false)),
    // Alt-Felder je Geraet: seit 2.6 zaehlen die Werte im Eintrag, aber das Portal
    // wuerde sie sonst auf Vorgabe setzen.
    chopper: String(e.h || 0),
    niederflurblink: String(e.n || 0),
    silberpfeil: String(e.k || 0),
    textcolor: String(e.t || 1),
    wienbadges: String(e.u || 0)
  };
}

async function speichern() {
  const daten = geraeteDaten();
  if (imRahmen()) {
    // Im Portal: die Elternseite fuellt ihr Formular und schickt es ab, danach startet
    // das Geraet neu. Eine Antwort bekommen wir nicht, darum sagen wir es direkt.
    stand('Schicke an das Ger\u00e4t ...');
    try { window.parent.postMessage(daten, '*'); } catch (e) {}
    setTimeout(function () {
      stand('Gespeichert um ' + uhrText().slice(0, 5) + '.');
      sagen('Gespeichert', 'Dein catch it startet gerade neu.');
    }, 600);
    return;
  }

  const host = await hostSuchen();
  if (!host) {
    stand('');
    dialogZeigen('Kein Ger\u00e4t gefunden',
      GERAETE_HOSTS.join(' und ') + ' antwortet nicht. Ist dein catch it eingeschaltet, '
      + 'und h\u00e4ngst du im selben WLAN?',
      [{ text: 'Alles klar' }], 'warnung');
    return;
  }
  // Wie der alte Konfigurator: ein echtes Formular an http://<host>/config. Der Browser
  // wechselt dabei auf die Seite des Geraets, die sagt, dass gespeichert wird und neu
  // gestartet. Das umgeht auch jede CORS-Frage, wir muessen die Antwort nicht lesen
  // (Paul 23.10.2026).
  stand('Speichere auf ' + host + ' ...');
  const f = document.createElement('form');
  f.method = 'POST';
  f.action = 'http://' + host + '/config';
  Object.keys(daten).forEach(function (k) {
    if (k === 'type') return;
    const i = document.createElement('input');
    i.type = 'hidden';
    i.name = k;
    i.value = daten[k];
    f.appendChild(i);
  });
  document.body.appendChild(f);
  f.submit();

}

function gewaehlteNamen(st) {
  const linien = linienAus(st.abfahrten);
  const raus = [];
  linien.forEach(l => {
    const k = l.name + '|' + l.ziel;
    if (!st.gewaehlt.size || st.gewaehlt.has(k)) { if (raus.indexOf(l.name) < 0) raus.push(l.name); }
  });
  return raus;
}


// Das w-Feld traegt STUNDEN ("6-22"), nicht Uhrzeiten: die Firmware liest beide Seiten
// mit toInt und vergleicht sie gegen die aktuelle Stunde (isTimeWindowActiveNow).
// "0700-0900" waere 700 und 900 und damit nie aktiv.
// Wien (WL/WLB) ist der Sonderfall beim Zusammenlegen, darum eigens geprueft.
function istWienDisplay(d) {
  return ((d && d.richtungen) || []).some(k => {
    const r = richtungFinden(k);
    return !!(r && /^WLB?$/i.test(String(r.station.netz || '')));
  });
}

// ---- Uhr-Display -----------------------------------------------------------------------
// Ein Display, das keine Abfahrten zeigt, sondern nur die Uhrzeit, gross in Poppins.
// Farben kommen aus dem jeweiligen Stil, damit die Uhr aussieht wie das Brett daneben.
// Die Werte stammen 1:1 aus display-renderer.js (Paul 22.10.2026).
function uhrLook(c, d) {
  const e = d ? einstFuer(d) : einstVon(c);
  const ci = parseInt(c, 10);
  switch (ci) {
    case 1: case 3:
      return { bg: (e.b === 1 ? '#051e0f' : '#000500'),
               fg: (e.t === 2 ? '#ffffff' : (e.t === 3 ? '#f8a400' : '#fff05d')) };
    case 11: case 12: case 14:
      return { bg: '#000094', fg: '#ffffff' };
    case 2: case 15: case 18: case 21: case 23: {
      const v = (ci === 2) ? 2 : ((ci === 15 || ci === 18) ? 3 : (ci === 21 ? 1 : e.t));
      return v === 2 ? { bg: '#001405', fg: '#94ce39', raster: '#001e0a' }
           : v === 3 ? { bg: '#0f0500', fg: '#ff8c00', raster: '#281200' }
                     : { bg: '#000000', fg: '#ffffff', raster: '#181818' };
    }
    case 5:  return { bg: '#0a1628', fg: '#ffffff' };
    case 24: return { bg: '#ffffff', fg: '#1a1a1a' };
    case 25: return { bg: '#264c9a', fg: '#ffffff' };
    // Seit dem Release geht z1 fuer ALLE Stile (Firmware-Sitzung 23.10.2026). Wo wir
    // die Hausfarben nicht kennen, zeigt die Uhr weiss auf schwarz.
    default: return { bg: '#000000', fg: '#ffffff' };
  }
}
// Die Uhr ist eine ZEILE wie eine Linie: man legt sie unten aus der Liste aufs Display.
// Ist sie die einzige Zeile, wird das ganze Brett zur Uhr (Feld z1 am Geraet), sonst
// belegt sie die unterste Zeile (z2) (Paul 23.10.2026).
const UHR_KEY = '@UHR';
function istUhrKey(k) { return k === UHR_KEY; }
function hatUhrZeile(d) { return !!(d && d.richtungen && d.richtungen.indexOf(UHR_KEY) >= 0); }

// Die Uhr ist von Haus aus AUS. Erst der Schalter unter Erweitert holt sie hervor,
// dann erscheint auch die Formatwahl und die Zeile im Linien-Topf (Paul 23.10.2026).
let uhrAn = false;
let uhrSekunden = true;          // Format, sobald die Uhr an ist
// Leere Displays soll es nicht geben (Paul 23.10.2026). Nur das eine, das gerade per
// Plus-Kachel entstanden ist, darf kurz leer sein, bis eine Linie darauf liegt.
function leereWeg(ausnahme) {
  for (let i = displays.length - 1; i >= 0; i--) {
    if (displays[i] !== ausnahme && !(displays[i].richtungen || []).length) displays.splice(i, 1);
  }
}

function uhrFeatureSchalten() {
  uhrAn = !uhrAn;
  if (!uhrAn) {
    // Ausgeschaltet heisst ausgeschaltet: liegengebliebene Uhr-Zeilen kommen weg, sonst
    // steht in der Config ein z, das die Oberflaeche gar nicht mehr zeigt. Ein Display,
    // das nur die Uhr trug, ist danach leer und faellt mit weg.
    displays.forEach(d => { d.richtungen = (d.richtungen || []).filter(k => !istUhrKey(k)); });
    leereWeg(null);
    allesZeichnen();
    return;
  }
  // Einschalten legt eine eigene Uhr-Seite an und rollt nach oben, damit man sieht, was
  // passiert ist. Steht schon ein leeres Display herum, bekommt das die Uhr, statt noch
  // eines danebenzulegen.
  if (!displays.some(d => hatUhrZeile(d))) {
    let ziel = displays.find(d => !(d.richtungen || []).length);
    if (ziel) ziel.richtungen = [UHR_KEY];
    else {
      ziel = { richtungen: [UHR_KEY], vomNutzer: true, stil: stilVon(displays[0] || {}) };
      displays.push(ziel);
    }
    allesZeichnen();
    zumDisplay(displays.indexOf(ziel));
    const kopf = document.querySelector('h1');
    if (kopf) kopf.scrollIntoView({ block: 'start', behavior: 'smooth' });
    return;
  }
  allesZeichnen();
}
function sekundenSetzen(wert) { uhrSekunden = !!wert; allesZeichnen(); }

// Die Uhr wird gesetzt wie normaler Text, in den echten Poppins-Breiten. Damit sie
// trotzdem nicht zappelt, haengt sie an einem festen Anker statt an der Mitte:
//   x0 = (Breite - Breite("HH:MM:") - Breite("00")) / 2
// Ab x0 steht "HH:MM:SS" linksbuendig. Dadurch ruehrt sich eine Minute lang nichts,
// nur die letzte Ziffer rueckt, und beim Minutenwechsel zentriert es sich neu
// (Firmware-Sitzung 23.10.2026). Die Zellen-Variante von vorhin ist damit hinfaellig.
let _uhrMass = null;
function uhrMess(fs) {
  if (!_uhrMass) _uhrMass = document.createElement('canvas').getContext('2d');
  _uhrMass.font = '700 ' + fs + 'px Poppins, sans-serif';
  return _uhrMass;
}
function uhrAnker(txt, fs, breite) {
  const ctx = uhrMess(fs);
  const dp = String(txt).lastIndexOf(':');
  const kopf = dp >= 0 ? String(txt).slice(0, dp + 1) : '';
  return Math.round((breite - ctx.measureText(kopf).width - ctx.measureText('00').width) / 2);
}

function uhrText() {
  const d = new Date(), z = n => (n < 10 ? '0' + n : String(n));
  return z(d.getHours()) + ':' + z(d.getMinutes()) + (uhrSekunden ? ':' + z(d.getSeconds()) : '');
}
function uhrHTML(c, el, d) {
  const look = uhrLook(c, d);
  if (!look) return '';
  el.style.background = look.bg;
  el.style.backgroundImage = look.raster
    ? 'radial-gradient(circle, ' + look.raster + ' 1.5px, transparent 1.5px)' : 'none';
  el.style.backgroundSize = look.raster ? '5px 5px' : 'auto';
  const t = uhrText();
  return '<div class="uhr-flaeche" style="color:' + look.fg + '">'
       + '<span class="uhr-zeit" data-fs="34" data-breite="320" style="left:'
       + uhrAnker(t, 34, 320) + 'px">' + escapeHtmlFt(t) + '</span></div>';
}
// Ganzes Brett = Uhr: wenn die Uhr die EINZIGE Zeile ist.
// Eine Seite mit weniger Zeilen als der groesste Bruder desselben Stils: die Zeilen
// behalten ihre Hoehe und Schrift, verteilen sich aber ueber den ganzen Schirm, jede
// mittig in ihrem Fach. Der Renderer hat sie vorher dicht untereinander gesetzt, hier
// ruecken sie auf ihren Platz (Firmware-Sitzung 23.10.2026).
// Die gezeichneten Zeilen in ihrer Reihenfolge einsammeln. Die meisten Renderer legen
// sie in einen Rahmen von 320 mal 170, darum eine Ebene tiefer mitsuchen.
function zeilenElemente(el, kopf, zeilenH, anzahl) {
  const raus = [];
  if (!el) return raus;
  let kandidaten = [];
  Array.prototype.forEach.call(el.children, k => {
    kandidaten.push(k);
    if (!k.style.top) kandidaten = kandidaten.concat(Array.prototype.slice.call(k.children));
  });
  kandidaten.forEach(k => {
    const oben = parseFloat(k.style.top);
    if (isNaN(oben)) return;
    const i = Math.round((oben - kopf) / zeilenH);
    if (i < 0 || i >= anzahl) return;
    if (Math.abs((kopf + i * zeilenH) - oben) > 1) return;   // keine Zeile, z.B. die Min-Leiste
    raus[i] = k;
  });
  return raus;
}

function seiteVerteilen(zeilen, kopf, zeilenH, fach, eigene) {
  if (fach <= zeilenH) return;
  const versatz = Math.floor((fach - zeilenH) / 2);
  zeilen.forEach((k, i) => {
    if (!k || i >= eigene) return;
    k.style.top = (kopf + i * fach + versatz) + 'px';
  });
}

// Blinken bei 0, nur Matrix. o1 laesst die Null blinken, o2 nimmt die Zahl weg und
// laesst daf\u00fcr das Ziel blinken. Die Vorschau bildet das in der grossen Ansicht nach
// (bis 3 Zeilen), dort ist die Zeile Linie, Ziel, Zahl (Firmware-Sitzung 23.10.2026).
function nullBlinken(colour, zeilen, daten, d) {
  const kann = (STIL_KANN[parseInt(colour, 10)] || {}).blinken;
  const o = (d ? einstFuer(d) : einstVon(colour)).o;
  if (!kann || !o) return;
  zeilen.forEach((k, i) => {
    const dep = daten[i];
    if (!k || !dep || parseInt(dep.time, 10) !== 0) return;
    const teile = Array.prototype.slice.call(k.children);
    if (teile.length < 3) return;          // kleine Ansicht sieht anders aus
    const zahl = teile[teile.length - 1];
    const ziel = teile[1];
    if (o === 1) { zahl.classList.add('blinkt'); }
    else { zahl.style.visibility = 'hidden'; ziel.classList.add('blinkt'); }
  });
}

// Die Uhrzeit in ihrer Zeile, in der Schrift des Stils. Ab 4 Zeilen wird sie klein,
// genau wie die Linien und Abfahrten daneben (Paul 23.10.2026).
function uhrZeileHTML(colour, daten, zeilen, d) {
  const i = daten.findIndex(x => x && x.uhr);
  if (i < 0) return '';
  const look = uhrLook(colour, d) || { bg: '#000', fg: '#fff' };
  const kopf = (parseInt(colour, 10) === 22) ? 18 : 0;   // MVG traegt oben die Min-Leiste
  const rowH = Math.floor((170 - kopf) / zeilen);
  const oben = kopf + i * rowH;
  const klein = zeilen >= 4;
  const ci = parseInt(colour, 10);
  let inhalt;
  if ([2, 15, 18, 21, 23].indexOf(ci) >= 0 && typeof dvLedTextSvg === 'function') {
    // Matrix zeichnet mit dem LED-Font: gross = Pixelgroesse 4, klein = 2.
    inhalt = dvLedTextSvg(uhrText(), klein ? 2 : 4, look.fg, true);
  } else {
    const fs = Math.min(klein ? 22 : 34, Math.round(rowH * 0.62));
    const t = uhrText();
    inhalt = '<span class="uhr-zeit" data-fs="' + fs + '" data-breite="320"'
           + ' style="font-family:\'Poppins\',sans-serif;font-weight:700;'
           + 'font-size:' + fs + 'px;left:' + uhrAnker(t, fs, 320) + 'px">'
           + escapeHtmlFt(t) + '</span>';
  }
  return '<div style="position:absolute;left:0;top:' + oben + 'px;width:320px;height:' + rowH
       + 'px;color:' + look.fg + ';">' + inhalt + '</div>';
}

function zeigtUhr(d) {
  return !!(d && hatUhrZeile(d) && zeilenEinheiten(d).length === 1);
}
// Eine Uhr-Zeile neben Abfahrten.
function hatUhrNeben(d) { return hatUhrZeile(d) && !zeigtUhr(d); }

// Die Uhr-Zeile ist frei verschiebbar wie jede andere Zeile (Paul 23.10.2026). Darum
// braucht das Geraet ihre Position: z1 = ganzes Brett, sonst z<Zeile+1>, also z2 fuer
// die erste Zeile, z3 fuer die zweite und so weiter.
function uhrZeilenNr(d) {
  if (!d || !hatUhrZeile(d)) return 0;
  const i = zeilenEinheiten(d).findIndex(teil => teil.length === 1 && istUhrKey(teil[0]));
  return i < 0 ? 0 : (i + 1);
}
function uhrToken(d) {
  if (zeigtUhr(d)) return '|z1';                 // ganzes Brett, geht bei jedem Stil
  if (!hatUhrNeben(d)) return '';
  if (!kannUhrZeile(stilVon(d))) return '';      // dort ignoriert die Firmware z2..z5
  return '|z' + (uhrZeilenNr(d) + 1);
}

function fensterToken(d) {
  const f = d && d.fenster;
  if (!f) return '';
  return parseInt(f.von, 10) + '-' + parseInt(f.bis, 10);
}

function fensterSchalten(di) {
  const d = displays[di];
  if (!d) return;
  d.fenster = d.fenster ? null : { von: '07:00', bis: '09:00' };
  allesZeichnen();
}
function fensterSetzen(di, welches, wert) {
  const d = displays[di];
  if (!d || !d.fenster) return;
  d.fenster[welches] = wert;
  allesZeichnen();
}
// displaysettings fuers Geraet: je Anzeige-Stil ein Segment mit Zeilen und Zeitfenster.
function displaysettingsBauen() {
  const proStil = new Map();
  displays.forEach(d => {
    const c = stilVon(d);
    const alt = proStil.get(c) || { r: 0, w: '', s: 0 };
    alt.r = Math.max(alt.r, zeilenVon(d));
    // Rueckfall fuer aeltere Geraete: die kennen das Fenster nur je Anzeige-Stil.
    if (d.fenster && !alt.w) alt.w = fensterToken(d);
    // Sortierung haengt am Stil, nicht am Display. Will EIN Display dieses Stils
    // chronologisch, gilt das fuer alle mit diesem Stil.
    if (!alt.s && zeitbasiert(d)) alt.s = 3;
    proStil.set(c, alt);
  });
  const teile = [];
  proStil.forEach((v, c) => { teile.push(dsSegment(c, v.r, v.w, v.s || 1)); });
  return teile.join(';');
}

// Zeile innerhalb eines Displays verschieben. Gezaehlt wird in ZEILEN, nicht in
// Richtungen: eine zusammengefasste Zeile wandert mit allen ihren Mitgliedern.
function zeileSchieben(di, i, richtung) {
  const d = displays[di];
  if (!d) return;
  const einheiten = zeilenEinheiten(d);
  const j = i + richtung;
  if (j < 0 || j >= einheiten.length) return;
  const t = einheiten[i]; einheiten[i] = einheiten[j]; einheiten[j] = t;
  d.richtungen = einheiten.reduce((alle, teil) => alle.concat(teil), []);
  d.vomNutzer = true;
  allesZeichnen();
}

// ---- Zeilen ziehen -------------------------------------------------------------------
// Die Pfeile bleiben, aber man kann eine Zeile auch einfach nehmen und verschieben
// (Paul 23.10.2026). Auf dem Handy erst nach kurzem Halten, sonst waere das Scrollen
// der Seite blockiert. Waehrend des Ziehens wird nur das DOM umgehaengt, die Daten
// kommen beim Loslassen dran, sonst wuerde der Neuaufbau das gezogene Element wegreissen.
let ziehen = null;
function zeileGreifen(ev, di, el) {
  if (ev.target.closest('button, input, select, a')) return;
  const z = { di: di, el: el, y: ev.clientY, id: ev.pointerId, aktiv: false };
  z.timer = setTimeout(function () {
    z.aktiv = true;
    el.classList.add('zieht');
    el.style.touchAction = 'none';
    try { el.setPointerCapture(z.id); } catch (e) {}
  }, 180);
  ziehen = z;
}
function zeileZiehen(ev) {
  if (!ziehen) return;
  if (!ziehen.aktiv) {
    // Finger wandert, bevor das Halten durch ist: das war Scrollen, kein Ziehen.
    if (Math.abs(ev.clientY - ziehen.y) > 8) { clearTimeout(ziehen.timer); ziehen = null; }
    return;
  }
  ev.preventDefault();
  const liste = ziehen.el.parentElement;
  let davor = null;
  Array.prototype.forEach.call(liste.children, function (x) {
    if (x === ziehen.el || !x.classList.contains('linie')) return;
    const r = x.getBoundingClientRect();
    if (!davor && ev.clientY < r.top + r.height / 2) davor = x;
  });
  if (davor !== ziehen.el.nextElementSibling) liste.insertBefore(ziehen.el, davor);
}
function zeileLoslassen() {
  if (!ziehen) return;
  clearTimeout(ziehen.timer);
  const z = ziehen;
  ziehen = null;
  if (!z.aktiv) return;
  z.el.classList.remove('zieht');
  z.el.style.touchAction = '';
  const folge = Array.prototype.filter.call(z.el.parentElement.children,
                  x => x.classList.contains('linie'))
                .map(x => parseInt(x.dataset.idx, 10));
  zeilenNeuOrdnen(z.di, folge);
}
// Reihenfolge der Zeilen uebernehmen: aus den Einheiten in der neuen Folge wieder die
// flache Liste der Richtungen bauen.
function zeilenNeuOrdnen(di, folge) {
  const d = displays[di];
  if (!d) return;
  const einheiten = zeilenEinheiten(d);
  const neu = folge.map(n => einheiten[n]).filter(Boolean);
  if (neu.length !== einheiten.length) { allesZeichnen(); return; }
  d.richtungen = neu.reduce((alle, teil) => alle.concat(teil), []);
  d.vomNutzer = true;
  allesZeichnen();
}

// ---- Zeilen zusammenfassen -----------------------------------------------------------
// Der Dialog erklaert kurz, wozu das gut ist, und laesst die Richtungen dieses Displays
// ankreuzen. Zwei reichen; wer mehr nimmt, legt sie alle in eine Zeile.
let gruppeWahl = new Set();

function gruppeFragen(di, vorgabe) {
  const d = displays[di];
  if (!d) return;
  gruppeWahl = new Set(vorgabe || []);
  gruppeDialogZeichnen(di);
}

function gruppeHaken(di, key) {
  if (gruppeWahl.has(key)) gruppeWahl.delete(key); else gruppeWahl.add(key);
  // Der Dialog wird komplett neu gezeichnet. Ohne gemerkte Scroll-Position springt die
  // Liste bei jedem Haken an den Anfang, und bei zehn Linien hakt man blind
  // (Paul 25.10.2026).
  const merker = [];
  document.querySelectorAll('#schleier *').forEach(el => {
    if (el.scrollTop > 0) merker.push([el.className, el.scrollTop]);
  });
  gruppeDialogZeichnen(di);
  merker.forEach(([klasse, oben]) => {
    const el = klasse ? document.querySelector('#schleier .' + String(klasse).split(' ')[0]) : null;
    if (el) el.scrollTop = oben;
  });
}

function gruppeDialogZeichnen(di) {
  const d = displays[di];
  if (!d) return;
  const frei = zeilenEinheiten(d).length - 1;   // so viele Zeilen hat das Display danach
  const drauf = new Set(d.richtungen || []);
  // Auch Linien anbieten, die noch NICHT auf diesem Display liegen. Wer S4, S5 und S6
  // zusammenfassen will, soll sie hier ankreuzen koennen, statt sie vorher einzeln
  // herueberzutippen. Beim Gruppieren kommen sie automatisch mit (Paul 24.10.2026).
  const reihenfolge = (d.richtungen || []).concat(
    alleRichtungen().map(r => r.key).filter(k => !drauf.has(k)));
  let liste = '';
  reihenfolge.forEach((k, nr) => {
    const r = richtungFinden(k);
    if (!r) return;
    const dazu = !drauf.has(k);
    if (dazu && nr === drauf.size) liste += '<div class="wahltrenner">Noch nicht auf diesem Display</div>';
    const schon = gruppeVon(d, k);
    const an = gruppeWahl.has(k);
    const f = badgeFarben(r.dep);
    liste += '<div class="linie' + (an ? ' gewaehlt' : '') + (schon ? ' fest' : '') + '"'
           + (schon ? '' : ' onclick="gruppeHaken(' + di + ',\'' + k.replace(/'/g, "\\'") + '\')"')
           + ' style="cursor:' + (schon ? 'default' : 'pointer') + '">'
           + '<span class="haken">' + (an ? '&#10003;' : '') + '</span>'
           + '<b style="background:' + f.bg + ';color:' + f.fg + '">' + escapeHtmlFt(r.dep.line) + '</b>'
           + '<div class="rumpf"><div class="ziel">' + escapeHtmlFt(r.dep.dest) + '</div>'
           + '<div class="halt">' + escapeHtmlFt(r.station.name)
           + (schon ? ' &middot; steht schon in einer Zeile zusammen'
                    : (dazu ? ' &middot; kommt dann auf dieses Display' : '')) + '</div></div>'
           + '</div>';
  });
  const reicht = gruppeWahl.size > 1;
  dialogZeigen('Gruppieren',
    'Richtungen, die dieselbe Strecke fahren, brauchen keine eigene Zeile. Kreuze an, '
    + 'welche sich eine teilen sollen. Das Display zeigt dann die n\u00e4chste Abfahrt davon '
    + 'und hat eine Zeile mehr frei.',
    [{ text: 'Abbrechen', still: true },
     { text: reicht ? 'Gruppieren' : 'Mindestens zwei w\u00e4hlen', aus: !reicht, offen: !reicht,
       tun: function () { gruppeAnlegen(di); } }],
    'doppelt',
    '<div class="wahlliste">' + (liste || '<div class="leer">Keine Richtung da.</div>')
      + '</div>');
}

function gruppeAnlegen(di) {
  const d = displays[di];
  if (!d) return;
  // Angekreuztes, das noch woanders liegt, kommt zuerst auf dieses Display.
  gruppeWahl.forEach(k => {
    if (d.richtungen.indexOf(k) < 0 && richtungFinden(k)) {
      d.richtungen.push(k);
      abgelegt.delete(k);
    }
  });
  const teil = (d.richtungen || []).filter(k => gruppeWahl.has(k) && !gruppeVon(d, k));
  if (teil.length < 2) return;
  if (!d.gruppen) d.gruppen = [];
  d.gruppen.push(teil);
  // Die Mitglieder ruecken zusammen, damit die Zeile dort steht, wo das erste Mitglied war.
  d.vomNutzer = true;
  gruppeWahl = new Set();
  allesZeichnen();
}

// Eine zusammengefasste Zeile wieder in ihre Richtungen aufloesen.
function gruppeLoesen(di, i) {
  const d = displays[di];
  if (!d) return;
  const teil = zeilenEinheiten(d)[i];
  if (!teil || teil.length < 2) return;
  d.gruppen = gruppenVon(d).filter(g => g !== gruppeVon(d, teil[0]));
  if (!d.gruppen.length) delete d.gruppen;
  allesZeichnen();
}

// Das x nimmt die ganze Zeile vom Display, also auch alle Richtungen einer Gruppe.
function zeileWeg(di, i) {
  const d = displays[di];
  if (!d) return;
  const teil = zeilenEinheiten(d)[i];
  if (!teil) return;
  teil.forEach(k => richtungSchalten(di, k, false));
}

// Zusammenfassen: zwei Spuren laufen zu einer zusammen, wie beim Einfaedeln. Der alte
// Pfeil zeigte nach rechts, waehrend die Linien nach links liefen (Paul 22.10.2026).
const SYM_ZUSAMMEN =
  '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"'
  + ' stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M3 6h3.5Q12 6 12 12M3 18h3.5Q12 18 12 12M12 12h6.5"/>'
  + '<path d="m16.2 8.8 3.2 3.2-3.2 3.2"/></svg>';

// Entfernen: ein sauberes Kreuz mit runden Enden, statt des duennen Schriftzeichens.
const SYM_X =
  '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"'
  + ' stroke-width="2.6" stroke-linecap="round" aria-hidden="true">'
