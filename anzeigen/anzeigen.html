<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine Anzeigen</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --papier: #f2ead9; --karte: #faf5ec; --tinte: #1b1b1b;
    --grau: #8b8378; --linie: #ded5c4; --akzent: #eb3924;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 18px 0 80px; background: var(--papier); color: var(--tinte);
    font-family: 'Poppins', system-ui, sans-serif;
  }
  .bahn { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* Stadtplan als Hintergrund. Liegt hinter allem, nimmt keine Klicks an und ist
     entfaerbt, damit die Anzeigen davor lesbar bleiben. */
  #karte {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-repeat: repeat; background-size: 768px 512px;
    opacity: .35;
  }
  #karte::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(242,234,217,.35), rgba(242,234,217,.92) 70%);
  }
  body > *:not(#karte) { position: relative; z-index: 1; }
  .leaflet-container { background: var(--papier); }
  h1 { font-size: 24px; margin: 0 0 2px; }
  .unter { color: var(--grau); font-size: 13px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 22px 0 8px; letter-spacing: .2px; }

  /* ---- Wisch-Leiste der Bildschirme ---- */
  /* Seitliche Polster von einer halben Bildschirmbreite minus halber Karte: dadurch
     kann AUCH die erste und die letzte Karte in der Mitte einrasten. Ohne das klebte
     die erste Karte links am Rand. */
  .streifen {
    display: flex; gap: 14px; overflow-x: auto;
    padding: 18px calc(50vw - 150px) 26px;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    perspective: 1100px;          /* macht die Drehung der Nachbarkarten raeumlich */
    perspective-origin: 50% 50%;
  }
  .streifen::-webkit-scrollbar { display: none; }
  /* Die Leiste bleibt beim Runterscrollen oben stehen: was du unten einstellst, siehst du
     sofort in der Vorschau (Paul 23.10.2026). "body >" schlaegt die Regel fuer alle Kinder
     von body (position: relative). Grund und Schatten erst, wenn sie wirklich klebt
     (Klasse .klebt, siehe leisteKlebt), sonst laege oben ein Balken ueber dem Stadtplan. */
  body > #streifen.streifen { position: sticky; top: 0; z-index: 5; }
  body > #streifen.streifen.klebt {
    background-color: var(--papier);
    box-shadow: 0 10px 18px -14px rgba(27, 27, 27, .5);
  }
  /* Was wir per scrollIntoView ansteuern, landet unter der Leiste statt dahinter. --leiste
     setzt leisteKlebt auf ihre Hoehe. Bewusst kein scroll-padding am Dokument: das wirkte
     auch auf das scrollIntoView der aktiven Karte IN der Leiste und zoege die Seite bei
     jedem Neuzeichnen wieder nach oben. */
  .klapp > .klapp-kopf, #stationsliste { scroll-margin-top: calc(var(--leiste, 0px) + 10px); }
  /* Die Karten stehen raeumlich: die mittlere vorn und gerade, die Nachbarn gedreht und
     kleiner. Dadurch sieht man auf einen Blick, dass sich seitwaerts wischen laesst.
     Den Wert setzt das Skript beim Scrollen, siehe raumWirkung(). */
  /* WICHTIG: die Karte ist NUR das Snap-Ziel und bleibt unverdreht. Gedreht wird das
     Innere (.raum). Vorher trug dieselbe Box beides: der Browser rastete auf die
     verdrehte Flaeche ein, das Einrasten verschob den Scrollwert um Bruchteile, das
     aenderte die Drehung, und so weiter. Die Karte zitterte dauerhaft, ohne dass
     jemand sie anfasste (gemessen: 265 Scroll-Ereignisse in 2 Sekunden im Leerlauf,
     Paul 23.10.2026). */
  .schirm { scroll-snap-align: center; flex: 0 0 auto; cursor: pointer; }
  .schirm > .raum {
    transform-style: preserve-3d; will-change: transform;
    transition: filter .18s ease-out;
  }
  /* Das Geraet ist 320 mal 170 Pixel. Die Karte zeigt es verkleinert, aber VOLLSTAENDIG:
     frueher war die Karte schmaler und schnitt rechts die Minuten ab. */
  .schirm .glas {
    width: 300px; height: 159px; position: relative; overflow: hidden;
    border: 2px solid var(--tinte); border-radius: 12px; background: #000;
    box-shadow: 4px 4px 0 var(--tinte), 0 10px 24px rgba(27,27,27,.22);
    transition: box-shadow .18s ease-out;
  }
  .schirm .glas > .bild {
    position: absolute; top: 0; left: 0; width: 320px; height: 170px;
    transform: scale(0.9375); transform-origin: top left;
  }
  .schirm.aktiv .glas { outline: 3px solid var(--akzent); outline-offset: 3px; }
  .schirm:active .glas { box-shadow: 2px 2px 0 var(--tinte); }
  .schirm .fuss { margin-top: 8px; text-align: center; font-size: 13px; font-weight: 600; }
  .schirm .fuss span { display: block; font-weight: 400; color: var(--grau); font-size: 11px; }
  .neu .glas {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--karte); color: var(--akzent); gap: 6px;
  }
  .neu .glas .plus { font-size: 34px; font-weight: 300; line-height: 1; }
  .neu .glas .wort { font-size: 13px; font-weight: 600; }

  /* ---- Karten ---- */
  /* Waehrend geladen wird, steht EIN Ladeschirm da. Die leeren Karten daneben sahen aus,
     als waere die Seite halb kaputt (Paul 26.10.2026). */
  .laden { display: none; flex-direction: column; align-items: center; text-align: center;
           gap: 14px; padding: 54px 20px 64px; }
  .laden.an { display: flex; }
  .laden .ladenTitel { font-size: 16px; font-weight: 700; color: var(--tinte); }
  .laden .ladenUnter { font-size: 13px; color: var(--grau); max-width: 34ch; line-height: 1.5; }
  body.laedt .streifen, body.laedt .bahn > .karte, body.laedt .bahn > .reihe,
  body.laedt .reiter { display: none !important; }
  .laden .ring { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto;
                 border: 4px solid var(--rand); border-top-color: var(--akzent);
                 animation: dreh .8s linear infinite; }
  @keyframes dreh { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .laden .ring { animation-duration: 3s; } }

  .karte {
    background: var(--karte); border: 2px solid var(--tinte); border-radius: 14px;
    box-shadow: 4px 4px 0 var(--tinte); padding: 14px; margin-bottom: 16px;
  }
  .kopf { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .kopf .titel { font-size: 17px; font-weight: 700; }
  .kopf .modus { font-size: 12px; color: var(--akzent); font-weight: 600; }

  .zeile {
    border: 1px solid var(--linie); border-radius: 10px; padding: 10px 12px;
    margin-top: 8px; background: #fff;
  }
  .zeile .marke { font-size: 11px; font-weight: 700; letter-spacing: .4px;
                  text-transform: uppercase; color: var(--grau); margin-bottom: 4px; }
  .zeile .wahl { font-size: 14px; font-weight: 600; color: var(--akzent); cursor: pointer; }
  .zeile .jetzt { font-size: 13px; color: var(--grau); margin-top: 2px; }

  select, input[type=text] {
    font-family: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px;
    border: 2px solid var(--tinte); background: #fff; color: var(--tinte); width: 100%;
  }
  label.feld { display: block; font-size: 11px; font-weight: 700; letter-spacing: .4px;
               text-transform: uppercase; color: var(--grau); margin: 10px 0 4px; }
  button {
    font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
    border: 2px solid var(--tinte); border-radius: 10px; padding: 9px 15px;
    background: var(--akzent); color: #fff; box-shadow: 3px 3px 0 var(--tinte);
  }
  button.still { background: #fff; color: var(--tinte); }
  button.klein { font-size: 12px; padding: 6px 10px; box-shadow: 2px 2px 0 var(--tinte); }
  .reihe { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }

  /* Reiter ueber der Karte, wie Browser-Tabs: der aktive haengt an der Karte und hat
     unten keine Kante, der andere sitzt daneben und ist gedaempft. Die Wahl aendert
     alles darunter, darum steht sie ueber der Karte und nicht darin (Paul 25.10.2026). */
  .reiter { display: flex; gap: 6px; padding-left: 12px; position: relative; z-index: 2;
            margin-bottom: -2px; }
  .reiter button {
    font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    border: 2px solid var(--tinte); border-bottom: none; border-radius: 12px 12px 0 0;
    padding: 8px 15px 8px; background: #e2d7c2; color: var(--grau);
    box-shadow: none; margin-top: 4px;
  }
  .reiter button.an {
    background: var(--karte); color: var(--tinte);
    padding-bottom: 10px; margin-top: 0; margin-bottom: -2px;
  }
  .reiter button:disabled { cursor: default; opacity: .55; }
  @media (max-width: 460px) { .reiter button { padding: 8px 11px; font-size: 12px; } }

  .schalter { display: flex; background: #ece3d2; border-radius: 10px; padding: 4px; gap: 4px; }
  .schalter button { flex: 1; box-shadow: none; border: none; background: transparent; color: var(--grau); }
  .schalter button.an { background: #fff; color: var(--tinte); box-shadow: 0 1px 2px rgba(0,0,0,.15); }

  /* Schmales Geraet: die Karte kleiner machen, damit die Nachbarn sichtbar hereinragen.
     Sonst fuellt eine 300er Karte den Bildschirm fast ganz aus und niemand sieht, dass
     es seitwaerts weitergeht. Das Bild bleibt 320 mal 170 und wird nur staerker skaliert. */
  @media (max-width: 460px) {
    .streifen { padding-left: calc(50vw - 125px); padding-right: calc(50vw - 125px); gap: 12px; }
    .schirm .glas { width: 250px; height: 133px; }
    .schirm .glas > .bild { transform: scale(0.78125); }
    .schirm .fuss { font-size: 12px; }
  }

  /* Eine Zeile je Linie und Richtung: Badge und Ziel gross, die Station ruhig darunter. */
  .linie {
    display: flex; align-items: center; gap: 11px; cursor: pointer;
    border: 1px solid var(--linie); border-radius: 10px; padding: 10px 12px;
    margin-top: 8px; background: #fff;
  }
  .linie.aus { opacity: .45; }
  .linie b {
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    min-width: 40px; height: 30px; padding: 0 9px; border-radius: 8px;
    font-size: 15px; font-weight: 800; letter-spacing: .2px;
  }
  .linie .rumpf { flex: 1; min-width: 0; }
  .linie .ziel {
    font-size: 16px; font-weight: 600; color: var(--tinte);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .linie .ziel::before { content: '\2192\00a0'; color: var(--grau); }
  .linie .ziel.alles::before { content: none; }
  .linie .halt { font-size: 12px; color: var(--grau); margin-top: 1px; }
  .linie.gewaehlt { border-color: var(--akzent); border-width: 2px; }
  .neu-badge {
    display: inline-block; vertical-align: middle; margin-left: 6px;
    background: var(--akzent); color: #fff; border-radius: 999px;
    padding: 2px 7px; font-size: 10px; font-weight: 700; letter-spacing: .3px;
    text-transform: uppercase;
  }
  .klapp-kopf .neu-platz { display: inline; }
  .linie.ziehbar { cursor: grab; }
  .linie.zieht {
    cursor: grabbing; opacity: .75; border-color: var(--akzent);
    box-shadow: 3px 3px 0 var(--tinte); position: relative; z-index: 3;
  }
  /* Noch nirgends zugewiesen: faellt auf, ohne zu zappeln. */
  @keyframes pochen {
    0%, 100% { box-shadow: 0 0 0 0 rgba(235, 57, 36, 0); }
    50%      { box-shadow: 0 0 0 5px rgba(235, 57, 36, .13); }
  }
  .linie.neu-dran { border-color: var(--akzent); animation: pochen 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .linie.neu-dran { animation: none; } }
  .linie .haken { flex: 0 0 auto; width: 18px; color: var(--akzent); font-weight: 800; }
  .weg-x { color: var(--akzent); font-size: 13px; }
  .weg { font-size: 12px; color: var(--akzent); font-weight: 600; cursor: pointer; flex: 0 0 auto; }
  .linie .doppel { flex: 0 0 auto; display: flex; color: var(--grau); }

  /* Eigener Dialog im Papier-Stil. Die Kaesten des Browsers nennen die Adresse und
     passen nicht zum Rest (Paul 22.10.2026). */
  /* body > :not(#karte) setzt alles auf relative und zaehlt wegen :not(#id) als ID.
     Darum hier ebenfalls mit body > davor, sonst klebt der Dialog im Seitenfluss. */
  body > #schleier {
    position: fixed; inset: 0; z-index: 1200; display: none;
    background: rgba(27, 27, 27, .45); align-items: center; justify-content: center; padding: 20px;
  }
  body > #schleier.an { display: flex; }
  #schleier .blatt {
    background: var(--karte); border: 2px solid var(--tinte); border-radius: 14px;
    box-shadow: 6px 6px 0 var(--tinte); padding: 22px 20px 18px; max-width: 400px; width: 100%;
    text-align: center;
  }
  #schleier .sinn {
    width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  #schleier .sinn.warnung { background: rgba(235, 57, 36, .12); color: var(--akzent); }
  #schleier .sinn.doppelt { background: rgba(27, 27, 27, .08); color: var(--tinte); }
  #schleier h3 { margin: 0 0 8px; font-size: 17px; }
  #schleier p { margin: 0 auto; font-size: 14px; line-height: 1.55; max-width: 32ch; }
  #schleier .knoepfe { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }

  /* Regler mit Beschriftung links und Wert rechts, wie im alten Konfigurator. */
  .regler { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .regler .wort { font-size: 13px; font-weight: 600; flex: 0 0 86px; }
  .regler input[type=range] { flex: 1; accent-color: var(--akzent); min-width: 0; }
  .regler .wert { font-size: 13px; font-weight: 700; flex: 0 0 34px; text-align: right; }

  .zeilenkopf { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .zeilenkopf h2 { margin-bottom: 0; }
  button.link {
    background: none; border: 0; box-shadow: none; padding: 0; font: inherit;
    font-size: 12px; font-weight: 700; color: var(--akzent); cursor: pointer; text-decoration: underline;
  }

  /* Zusammengefasste Zeile: die Marken der beteiligten Richtungen nebeneinander, darunter
     die Ziele mit Mittelpunkt getrennt. Eine Zeile am Geraet, also auch hier eine. */
  .linie .marken { flex: 0 0 auto; display: flex; gap: 3px; flex-wrap: wrap; max-width: 96px; }
  .linie.zusammen { border-color: var(--akzent); }
  .linie .zusatz { font-size: 11px; color: var(--akzent); font-weight: 700; margin-top: 2px; }

  /* Auswahl im Dialog: je Richtung eine antippbare Zeile mit Haken. */
  /* Formulare lesen sich linksbuendig. Mittig bleibt nur, was Ueberschrift ist. */
  #dlgInhalt { text-align: left; margin-top: 14px; }
  #dlgInhalt .linie { margin: 0; }
  #dlgInhalt > input[type=text] { width: 100%; }
  /* Waehrend der Baukasten offen ist, steht das bearbeitete Display UEBER dem Schleier:
     man stellt ja genau daran ein (Paul 26.10.2026). */
  body.designt .streifen { position: relative; z-index: 60; }
  body.designt .schirm:not(.aktiv) { opacity: .25; }
  #schleier .wahlliste { margin: 14px 0 0; max-height: 46vh; overflow: auto; text-align: left; }
  #schleier .wahlliste .linie { margin: 0 0 6px; }
  #schleier .wahlliste .linie:last-child { margin-bottom: 0; }
  #schleier .wahlliste .linie.fest { opacity: .55; }
  #schleier .leer { font-size: 13px; color: var(--grau); text-align: center; margin: 14px 0 0; }

  .pfeile { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
  .pfeil {
    width: 34px; height: 26px; padding: 0; font-size: 12px; line-height: 1;
    background: #fff; color: var(--tinte); box-shadow: none; border-width: 1px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .pfeil:disabled { opacity: .3; }

  .hinweis { font-size: 12px; color: var(--grau); line-height: 1.55; margin-top: 8px; }
  /* Weg zurueck in die Stations- und Linienauswahl. */
  .zurueck {
    background: none; border: 0; box-shadow: none; color: var(--akzent);
    font-size: 14px; font-weight: 700; padding: 6px 0; margin-bottom: 2px;
  }
  .zurueck:hover { text-decoration: underline; }

  /* Uhr-Display: gross, mittig, in unserer Schrift. Feste Ziffernbreite, damit beim
     Ticken nichts springt. */
  /* Blinken bei 0: ein Takt fuer alle Zeilen, weil alle gleichzeitig entstehen. */
  @keyframes blinkNull { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .blinkt { animation: blinkNull 1s steps(1, end) infinite; }
  /* Winzige Probe im Knopf: zeigt in LED-Schrift, was die Wahl tut. */
  .bprobe {
    display: block; margin: 4px auto 0; padding: 3px 6px; border-radius: 4px;
    width: fit-content; line-height: 0;
  }
  .schalter button { line-height: 1.25; }
  @media (prefers-reduced-motion: reduce) { .blinkt { animation: none; opacity: .5; } }

  .uhr-flaeche {
    position: absolute; inset: 0;
    font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 0;
  }
  /* Die Uhr haengt am Anker, nicht an der Mitte: siehe uhrAnker(). tabular-nums waere
     hier wirkungslos, Poppins bringt keine gleich breiten Ziffern mit. */
  .uhr-zeit { position: absolute; top: 50%; transform: translateY(-50%); white-space: pre; }

  /* Grosse Klappbloecke unter den Linien. Eingeklappt steht nur der Name da, ein Tipp
     oeffnet den Inhalt (Paul 22.10.2026). */
  .klapp { padding: 0; }
  .klapp .klapp-kopf small { display: block; font-size: 12px; font-weight: 400; color: var(--grau); margin-top: 2px; }
  .klapp > .klapp-kopf {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 18px 16px; background: none; border: 0; box-shadow: none;
    color: var(--tinte); font-size: 16px; font-weight: 700; text-align: left;
  }
  .klapp .klapp-pfeil { flex: 0 0 auto; display: flex; color: var(--grau); transition: transform .18s; }
  .klapp.offen .klapp-pfeil { transform: rotate(180deg); }
  .klapp .klapp-koerper { padding: 0 16px 16px; }
  .pooltrenner { border-top: 2px solid var(--linie); padding-top: 14px; margin-top: 18px; }

  /* Schieber fuer die Ja-Nein-Schalter, im Stil der Karten statt als Systemschalter. */
  .schieber { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; }
  .schieber + .schieber { border-top: 1px solid var(--linie); }
  .schieber .wort { font-size: 14px; font-weight: 700; }
  .schieber .wort small { display: block; font-size: 12px; font-weight: 400; color: var(--grau); margin-top: 2px; }
  .schiene {
    width: 54px; height: 30px; flex: 0 0 auto; border-radius: 15px; padding: 0;
    border: 2px solid var(--tinte); background: #fff; box-shadow: none; position: relative;
  }
  .schiene .kugel {
    position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--tinte); transition: transform .15s;
  }
  /* Farbwahl im Baukasten der eigenen Displays: ein Feld je Farbe, Beschriftung darunter. */
  .farbfelder { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  .farbfeld { display: flex; flex-direction: column; align-items: center; gap: 4px;
              font-size: 11px; color: var(--grau); }
  .farbfeld input[type=color] {
    width: 52px; height: 36px; padding: 0; border: 2px solid var(--rand);
    border-radius: 10px; background: none; cursor: pointer;
  }
  .farbfeld input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  .farbfeld input[type=color]::-webkit-color-swatch { border: none; border-radius: 7px; }
  .wahltrenner { font-size: 11px; font-weight: 700; letter-spacing: .04em;
                 text-transform: uppercase; color: var(--grau); margin: 14px 0 6px; }
  /* Ueberschrift je Station in der Liste "nach Abfahrt". */
  /* Die Station ist die Ueberschrift ihrer Linien, also sieht sie auch so aus: groesser,
     dunkel, mit einer Linie darunter und Luft darueber (Paul 26.10.2026). */
  .haltkopf { display: flex; align-items: center; justify-content: space-between; gap: 8px;
              margin: 22px 0 8px; padding-bottom: 7px; border-bottom: 2px solid var(--linie);
              font-size: 15px; font-weight: 800; letter-spacing: .1px; color: var(--tinte); }
  .haltkopf:first-child { margin-top: 4px; }
  .haltkopf svg { width: 17px; height: 17px; color: var(--grau); }
  /* Umschalter in der Stationszeile: klein, aber als Schalter erkennbar. */
  .haltwahl { display: inline-flex; background: #ece3d2; border-radius: 9px; padding: 3px; gap: 3px;
              flex: 0 0 auto; }
  .haltwahl button { font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .2px;
                     padding: 4px 10px; border: none; border-radius: 7px; background: transparent;
                     color: var(--grau); box-shadow: none; cursor: pointer; }
  .haltwahl button.an { background: #fff; color: var(--tinte); box-shadow: 0 1px 2px rgba(0,0,0,.15);
                        cursor: default; }
  .farbfelder { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
                gap: 10px; margin: 2px 0 14px; }
  .farbfeld { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }

  STV: [23, 3], STVG: [23, 3], SALZBURG: [23, 3], KAERNTEN: [23, 3],
  VOR: [23, 3], VVT: [23, 3], VVV: [23, 3], INNSBRUCK: [23, 3],
  OEBB: [12, 0], OEBB_FERN: [12, 0], OEBB_REGIONAL: [12, 0], OEBB_SBAHN: [12, 0],

  NL_OEFFI: [23, 3], GB_LOCAL: [23, 3], TBILISI: [23, 3], SYDNEY: [23, 3],

  if (k.schrift) aus += '|t' + e.t;

  if (k.fahrzeug) aus += '|h' + e.h + '|n' + e.n + '|k' + e.k;

  if (k.verspaetung) aus += '|p' + e.d;

function dsSegment(c, zeilenZahl, fenster, sortierung, d) {

  // die displaysettings kennen nur die colour.

  // s2 stehen und wirft unsere feste Reihenfolge um.
  if (sortierung && kannSortieren(c)) seg += '|s' + sortierung;
  const standzeit = standzeitVon(e, d ? zeigtUhr(d) : false);
  if (standzeit !== STANDZEIT_VORGABE) seg += '|i' + standzeit;
  if (e.x) seg += '|x' + e.x;
  if (e.y) seg += '|y' + e.y;
  if (k.matrixSchrift && e.f) seg += '|f' + e.f;
  if (k.verspaetung && e.d) seg += '|d' + e.d;
  if (k.schrift && e.t !== 1) seg += '|t' + e.t;
  if (k.grund && e.b) seg += '|b' + e.b;
  if (k.badges && e.u) seg += '|u' + e.u;
  if (k.badges && e.u && e.v !== 4) seg += '|v' + e.v;
  // Diese drei sind am Geraet von Haus aus aus, darum steht nur die 1 in der Zeile.
  if (k.fahrzeug && e.h) seg += '|h' + e.h;
  if (k.fahrzeug && e.h && e.n) seg += '|n' + e.n;

// ---- Zusammengefasste Zeilen ---------------------------------------------------------
// Zwei Richtungen, die dieselbe Strecke fahren, brauchen keine zwei Zeilen. Wer sie
// zusammenfasst, bekommt eine Zeile zurueck. Das Geraet kennt das als '+'-Merge.
function gruppenVon(d) { return (d && d.gruppen) || []; }
function gruppeVon(d, key) { return gruppenVon(d).find(g => g.indexOf(key) >= 0) || null; }

// Die Zeilen eines Displays in ihrer Reihenfolge. Eine Gruppe steht dort, wo ihr erstes
// Mitglied steht, und zaehlt als EINE Zeile.
function zeilenEinheiten(d) {
  const keys = (d && d.richtungen) || [];
  const fertig = new Set();
  const raus = [];
  keys.forEach(k => {
    if (fertig.has(k)) return;
    const g = gruppeVon(d, k);
    if (g) {

      teil.forEach(x => fertig.add(x));

    .map(g => g.filter(k => drauf.has(k)))
    .filter(g => g.length > 1);

// Zeilen stellt niemand mehr ein: so viele wie zugewiesen, gedeckelt auf das, was der

// Abfahrten, sofern der Stil drei Zeilen kann (Paul 22.10.2026).

// der groessten Zeilenzahl aller Seiten dieses Stils an und zeichnet kleinere Seiten
// mittig in dieselbe Zeilenhoehe (Firmware-Sitzung 23.10.2026).

// Groesste Zeilenzahl aller Displays dieses Stils: danach richtet sich die Zeilenhoehe.

  // wie das Brett hergibt. Darum zaehlt er nicht als eine Zeile, sondern holt das

  if ((d.richtungen || []).some(istAlleKey)) return maxZeilen(stilVon(d));

const EIGEN_SCHRIFT = [['1', 'Modern'], ['2', 'Klassisch'], ['3', 'Matrix']];

const STIL_OHNE_SORTIERUNG = [5, 6, 11, 12, 14, 25];   // DISPLAY_TYPE_FEATURES.sorting = false

// Aufklappliste eines Displays: erst was zu seinen Netzen passt, dann der Rest,
// am Ende der Weg zum eigenen Design.
function stilOptionen(d) {
  const netze = new Set();
  (d && d.richtungen || []).forEach(k => { const r = richtungFinden(k); if (r) netze.add(r.station.netz || 'WL'); });
  if (!netze.size) netze.add('WL');

  netze.forEach(n => {
    const v = NETZ_VORGABE[n];

  netze.forEach(n => (NETZ_STILE[n] || []).forEach(c => { if (passend.indexOf(c) < 0) passend.push(c); }));
  STILE_UNIVERSELL.forEach(c => { if (passend.indexOf(c) < 0) passend.push(c); });

    const x = STILE.find(y => y.id === id);

    return x ? '<option value="' + x.id + '"' + (x.id === jetzt ? ' selected' : '') + '>' + escapeHtmlFt(stilTitel(x.id)) + '</option>' : '';
  };

  const nurMarke = markenStile();
  if (nurMarke) {

    h += '<optgroup label="F\u00fcr dein Ger\u00e4t">' + nurMarke.map(eintrag).join('') + '</optgroup>';

// fuer echte Abfahrten haelt.
function beispielZeiten(anzahl) {
  const raus = [];
  for (let i = 0; i < anzahl; i++) raus.push(Math.floor(Math.random() * 10));
  return raus.sort((a, b) => a - b);
}
function beispielAbfahrten(st) {
  // Am liebsten die Linien, die hier schon einmal gefahren sind. Sonst die Vorgabe

  if (!paare && st.vorgabe) paare = [st.vorgabe];
  if (!paare) return [];
  const raus = [];
  paare.forEach(pz => {
    beispielZeiten(4).forEach(t => {
      raus.push({ line: pz.line, dest: pz.dest, time: t, vt: pz.vt || '',
                  lineColor: pz.lineColor || null, lineTextColor: pz.lineTextColor || null,
                  beispiel: true });

}
// Was hier faehrt, fuer spaeter merken: daraus entstehen nachts die Beispielzeiten.
// Die Linien einer Haltestelle, fuer den Stations-Block. ALLE Quellen zusammen: was die
// Linienauswahl mitschickt, was wir uns gemerkt haben und was gerade faehrt. Jede
// einzelne Quelle zeigt nur, was zu IHREM Zeitpunkt unterwegs war, und nachts waere das
// eine Linie statt sechs. Nur Namen, sortiert wie im Picker.
function halteLinien(st) {
  const raus = [];
  const nimm = n => {
    const x = String(n || '').trim();
    if (x && raus.indexOf(x) < 0) raus.push(x);
  };
  (st.linienAmHalt || []).forEach(nimm);
  (st.letzteLinien || []).forEach(d => nimm(d.line));
  (st.abfahrten || []).forEach(d => nimm(d.line));
  // Und was der Nutzer ausgewaehlt hat, auch wenn die Station gerade nichts liefert:
  // sonst steht eine zusammengefasste Station ohne ihre Linien da (Paul 26.10.2026).
  (st.gewaehlt ? [...st.gewaehlt] : []).forEach(k => {
    const i = String(k).indexOf('|');
    nimm(i < 0 ? k : String(k).slice(0, i));
  });
  return raus.sort((a, b) => a.localeCompare(b, 'de', { numeric: true }));
}

// Die kleinen Linien-Marken unter dem Namen der Station.
function miniMarken(deps) {
  if (!deps || !deps.length) return '';
  const gesehen = [];
  const stueck = [];
  deps.forEach(d => {
    if (gesehen.indexOf(d.line) >= 0) return;
    gesehen.push(d.line);
    const fz = badgeFarben(d);
    stueck.push('<i style="background:' + fz.bg + ';color:' + fz.fg + '">'
              + escapeHtmlFt(d.line) + '</i>');
  });
  return '<div class="minilinien">' + stueck.join('') + '</div>';
}

// Alle Linien, die an dieser Station halten. Fuer den "Alle Abfahrten"-Block.
function miniLinien(st) {
  return miniMarken(halteLinien(st).map(name =>
    (st.letzteLinien || []).find(x => x.line === name)
    || (st.abfahrten || []).find(x => x.line === name)
    || { line: name }));
}

function linienMerken(st) {
  const gesehen = new Set(), paare = [];
  st.abfahrten.forEach(d => {
    const k = d.line + '|' + d.dest;
    if (gesehen.has(k)) return;
    gesehen.add(k);
    paare.push({ line: d.line, dest: d.dest, vt: d.vt, rid: d.rid || '',
                 lineColor: d.lineColor, lineTextColor: d.lineTextColor });
  });
  if (!paare.length) return;
  // Was frueher einmal hier fuhr, bleibt gemerkt. Sonst verloere eine Linie, die abends
  // nicht mehr faehrt, auch ihre Farbe und ihre Richtungs-Id (Paul 24.10.2026).
  (st.letzteLinien || []).forEach(alt => {
    if (!gesehen.has(alt.line + '|' + alt.dest)) paare.push(alt);
  });
  st.letzteLinien = paare;
}
// Kurzfuehrungen gehoeren zu ihrer Richtung, nicht daneben. Regel wie im Konfigurator
// (Paul 20.09.2026): die Richtungs-Id ist die physische Richtung, mehrere Zieltexte
// darunter sind Aeste oder Kurzfuehrungen DERSELBEN Richtung. Hat eine Linie an diesem
// Halt nur EINE Richtungs-Id, trennt die nichts, dann sind die Zieltexte die Richtungen.
// Linz Unionkreuzung, Linie 1: Auwiesen und Remise Kleinmuenchen teilen sich
// st444518499l1, Universitaet hat st444518401l1. Also zwei Richtungen, nicht drei
// (Paul 23.10.2026). Der echte Zieltext bleibt als destRoh erhalten.
function kurzfuehrungenFalten(liste) {
  const proLinie = new Map();
  liste.forEach(d => {
    if (!d.rid) return;
    if (!proLinie.has(d.line)) proLinie.set(d.line, new Map());
    const rids = proLinie.get(d.line);
    if (!rids.has(d.rid)) rids.set(d.rid, new Map());
    const ziele = rids.get(d.rid);
    ziele.set(d.dest, (ziele.get(d.dest) || 0) + 1);
  });
  const haupt = new Map();   // Linie|rid -> Ziel der Hauptrichtung
  proLinie.forEach((rids, linie) => {
    if (rids.size < 2) return;       // eine einzige Id trennt nichts
    rids.forEach((ziele, rid) => {
      if (ziele.size < 2) return;
      let best = '', n = -1;
      ziele.forEach((zahl, ziel) => { if (zahl > n) { n = zahl; best = ziel; } });
      haupt.set(linie + '|' + rid, best);
    });
  });
  liste.forEach(d => {
    const b = haupt.get(d.line + '|' + d.rid);
    if (b && b !== d.dest) { d.destRoh = d.dest; d.dest = b; }
  });
  return liste;
}

// Abfahrten einer Station setzen, mit Beispiel-Rueckfall.
function abfahrtenSetzen(st, liste) {
  if (liste && liste.length) {
    st.abfahrten = kurzfuehrungenFalten(liste);
    st.beispiel = false;
    linienMerken(st);
  } else {
    st.abfahrten = beispielAbfahrten(st);
    st.beispiel = st.abfahrten.length > 0;
  }
}

// ---- Daten holen ---------------------------------------------------------------------
async function abfahrten(rbl) {
  const r = await fetch(DEP_API + '?rbl=' + encodeURIComponent(rbl) + '&_=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return abfahrtenAus(await r.json());
}

// Dieselbe Antwort, nur schon geholt: die Linienauswahl hat die Abfahrten beim Laden
// ohnehin abgefragt und reicht sie mit. Zweimal dasselbe zu holen kostet nur Zeit, und
// beim Kunden waren das die Sekunden, in denen die Seite leer stand (Paul 26.10.2026).
function abfahrtenAus(d) {
  const raus = [];
  ((d && d.data && d.data.monitors) || []).forEach(m => {
    if (!m || !m.lines) return;
    m.lines.forEach(l => {
      const deps = (l.departures && l.departures.departure) || [];
      deps.forEach(dep => {
        const cd = dep && dep.departureTime && dep.departureTime.countdown;
        if (cd == null) return;
        raus.push({ line: l.name || '?', dest: l.towards || '', time: cd,
                    // Richtungs-Id des Servers. Bei OOEVV ist das der Bahnsteig
                    // ("st444518401l1"), anderswo H/R oder eine Nummer. Sie ist die
                    // genaue Richtungs-Referenz, der Zieltext nur der Rueckfall.
                    rid: l.richtungsId || '',
                    vt: l.type || '', lineColor: l.lineColor || null,
                    lineTextColor: l.lineTextColor || null });
      });
    });
  });
  raus.sort((a, b) => a.time - b.time);
  return raus;
}

// Linien einer Station aus ihren Abfahrten: je Linie und Ziel ein Eintrag.
function linienAus(abf) {
  const map = new Map();
  abf.forEach(d => {
    const k = d.line + '|' + d.dest;
    if (!map.has(k)) map.set(k, { name: d.line, ziel: d.dest, typ: d.vt, rid: d.rid || '' });
  });
  return Array.from(map.values());
}

// ---- Bildschirme berechnen -----------------------------------------------------------
// Beide Modi enden in derselben Darstellung: einer Folge von Bildschirmen zum Wischen.
// Spielerisch: ein Bildschirm je Station. Kompakt: alle Stationen auf einem Display,
// das bei mehr Linien als Zeilen auf mehrere Seiten umbricht.
// Alle waehlbaren Richtungen ueber alle Stationen: je Linie und Ziel eine.
// Zurueck in die Linien- und Stationsauswahl. Wir sind von dort gekommen, darum
// zuerst die Geschichte: so bleiben Marke und Geraete-Parameter in der Adresse
// erhalten. Nur wenn es keine gibt, direkt auf die Datei daneben (Paul 23.10.2026).
function zurueckZuLinien() {
  if (window.history.length > 1) { window.history.back(); return; }
  window.location.href = '../catchit-cities.html';
}

// ---- Was ist neu ---------------------------------------------------------------------
// Jede neue Funktion traegt vier Wochen lang ein NEU, einmal oben am Block und einmal
// am Schalter selbst (Paul 23.10.2026). Datum = Tag, an dem es eingebaut wurde.
const NEU_WOCHEN = 4;
const NEU_SEIT = {
  uhr:     '2026-10-23',   // Uhrzeit als Zeile oder als ganzes Display
  blinken: '2026-10-23'    // Blinken bei 0 (Matrix)
};
// Welcher Block zeigt das NEU oben? Ein Block ist neu, solange eine seiner Funktionen neu ist.
const NEU_BLOCK = {
  klappMehr:    ['uhr'],
  klappFahrzeug:['blinken'],
  klappLinien:  ['uhr']
};
function istNeu(name) {
  const tag = NEU_SEIT[name];
  if (!tag) return false;
  const bis = new Date(tag + 'T00:00:00');
  bis.setDate(bis.getDate() + NEU_WOCHEN * 7);
  return new Date() < bis;
}
function neuBadge(name) { return istNeu(name) ? '<span class="neu-badge">Neu</span>' : ''; }
// Die Koepfe der Bloecke sind festes Markup, darum hier nachtragen.
function neuMarkieren() {
  Object.keys(NEU_BLOCK).forEach(id => {
    const platz = document.querySelector('#' + id + ' .neu-platz');
    if (!platz) return;
    platz.innerHTML = NEU_BLOCK[id].some(istNeu) ? '<span class="neu-badge">Neu</span>' : '';
  });
}

// ---- Gehweg und Nachtmodus -------------------------------------------------------------
// Gehweg = Minuten bis zur Haltestelle. Abfahrten darunter schaffst du nicht mehr, sie
// fallen weg. Grundwert je Station, bei Bedarf feiner je Linie und Richtung.
// Nachtmodus haengt NICHT an der masterrow, das Geraet hat dafuer eigene Felder
// (nightModeEnabled/Start/End, Vorgabe 22 bis 7).
let nacht = { an: false, von: 22, bis: 7 };
let helligkeit = 3;            // 1 dunkel, 2 mittel, 3 hell — gilt fuers ganze Geraet
const gwOffen = new Set();        // welche Station gerade feiner eingestellt wird

// Drei Stufen, von grob nach fein. Die feinste gewinnt:
//   Station  -> Richtung (alle Linien mit demselben Ziel) -> einzelne Linie dorthin.
// Der Gehweg haengt am Steig, darum ist die Richtung die wichtigste Zwischenstufe:
// stadteinwaerts stehst du oft auf der anderen Strassenseite (Paul 22.10.2026).
function gehwegStation(st) { return (st && st.gehweg) || 0; }
function gehwegRichtung(st, ziel) {
  const v = st && st.gehwegRichtungen && st.gehwegRichtungen[ziel];
  return (v != null) ? v : null;
}
function gehwegFuer(st, key) {
  const lokal = keyLokal(key);
  const eigen = st && st.gehwegLinien && st.gehwegLinien[lokal];
  if (eigen != null) return eigen;
  const ziel = lokal.split('|')[1] || '';
  const r = gehwegRichtung(st, ziel);
  return (r != null) ? r : gehwegStation(st);
}
function gehwegRichtungSetzen(si, ziel, wert) {
  const st = stationen[si];
  if (!st) return;
  if (!st.gehwegRichtungen) st.gehwegRichtungen = {};
  const n = parseInt(wert, 10);
  if (String(wert).trim() === '' || isNaN(n)) delete st.gehwegRichtungen[ziel];
  else st.gehwegRichtungen[ziel] = Math.max(0, Math.min(99, n));
  allesZeichnen();
}
function gehwegStationSetzen(si, wert) {
  const st = stationen[si];
  if (!st) return;
  st.gehweg = Math.max(0, Math.min(99, parseInt(wert, 10) || 0));
  allesZeichnen();
}
function gehwegLinieSetzen(si, key, wert) {
  const st = stationen[si];
  if (!st) return;
  if (!st.gehwegLinien) st.gehwegLinien = {};
  const n = parseInt(wert, 10);
  if (String(wert).trim() === '' || isNaN(n)) delete st.gehwegLinien[key];
  else st.gehwegLinien[key] = Math.max(0, Math.min(99, n));
  allesZeichnen();
}
function gwGenauer(rbl) {
  if (gwOffen.has(rbl)) gwOffen.delete(rbl); else gwOffen.add(rbl);
  allesZeichnen();
}
function nachtSchalten() { nacht.an = !nacht.an; allesZeichnen(); }
function nachtZeitSetzen(feld, wert) { nacht[feld] = parseInt(wert, 10) || 0; allesZeichnen(); }

// Schluessel einer ZEILE. Die Station gehoert mit hinein: zwei Stationen koennen
// dieselbe Linie mit demselben Ziel fuehren (Paul 23.10.2026: M76 nach Lichtenrade an
// Walther-Schreiber-Platz UND am Knausplatz). Ohne die Station galten beide als eine
// Zeile, die zweite verschwand aus der Liste und in der Config bekam sie die Abfahrten
// der ersten. Innerhalb einer Station bleibt es bei "Linie|Ziel", davon leben
// gewaehlt und gehwegLinien.
// "Alle Abfahrten" ist KEINE Linie, sondern die ganze Station. Im Geraeteformat steht
// dafuer ein '*' im Linienfeld, und genau so fuehren wir es auch hier: EIN Block je
// Station statt einer Zeile je Linie. Vorher zerfiel die Wahl "alle Abfahrten" in so
// viele Zeilen, wie gerade zufaellig etwas fuhr, und der Nutzer sah etwas anderes als
// das, was er im Picker ausgewaehlt hatte (Paul 25.10.2026: "pro Station ein Block").
const ALLE_LINIE = '*';
// Ein Zug-Brett ist "von A nach B": die rbl traegt das Ziel ("OEBBFERN:8100002>8100173"),
// bei mehreren Zielen mit '~' getrennt. Die GATTUNGEN (RJ, IC, REX …) stehen im
// Linienfeld und sind ein FILTER, keine Zeilen. Vorher wurde jede Gattung eine eigene
// Zeile, und aus einer Verbindung wurden achtzehn (Paul 26.10.2026: "öbb soll er immer
// von a nach b machen und die ausgewaehlten Gattungen vom Picker laden"). Je gewaehltem
// ZIEL eine Zeile, denn zwei Ziele sind zwei Verbindungen.
function zugZiele(st) {
  const kahl = rblTeile((st && st.rbl) || '').kahl;
  const i = kahl.indexOf('>');
  if (i < 0) return [];
  // Namen der Ziele: am liebsten aus der Uebergabe. Steht dort nichts, stehen sie im
  // Stationsnamen hinter dem Pfeil ("Linz/Donau Hbf -> Wien Hbf, Wels Hbf"), so baut ihn
  // die Linienauswahl. Die blanke Id ist der letzte Ausweg (Paul 26.10.2026).
  let namen = (st && st.zielNamen) || [];
  if (!namen.length) {
    const n = String((st && st.name) || '');
    const pf = n.search(/[\u2192>]/);
    if (pf > 0) namen = n.slice(pf + 1).split(',').map(x => x.trim()).filter(Boolean);
  }
  return kahl.slice(i + 1).split('~').map(x => x.trim()).filter(Boolean)
    .map((id, n) => ({ id: id, name: String(namen[n] || '').trim() || id }));
}
function istZugStation(st) { return zugZiele(st).length > 0; }
const ALLE_TEXT = 'Alle Abfahrten';
// Zeichen fuer den Block: ein Stern waere im Badge kaum zu erkennen.
const ALLE_MARKE = '\u2630';
// Ein LEERER Zieltext heisst nicht "kein Ziel", sondern "Richtung ist per Id gewaehlt,
// den Text kennt gerade niemand": die Linie faehrt abends nicht oder lag nicht im Feed.
// Die Linienauswahl schreibt dafuer "Alle Richtungen", und genau so steht es hier auch,
// sonst sieht der Kunde eine halbe Zeile (Konfigurator-Sitzung 26.10.2026).
const RICHTUNG_UNBEKANNT = 'Alle Richtungen';
function depText(dep) {
  if (dep && dep.alleStation) return ALLE_TEXT;
  const z = String((dep && dep.dest) || '').trim();
  return z || RICHTUNG_UNBEKANNT;
}
function depMarke(dep) {
  if (dep && dep.alleStation) return ALLE_MARKE;
  return (dep && dep.line) || '?';
}
function zeilenKey(si, dep) { return si + '\u00a7' + dep.line + '|' + dep.dest; }
function istAlleKey(k) {
  const i = String(k).indexOf('\u00a7');
  return i >= 0 && String(k).slice(i + 1) === ALLE_LINIE + '|';
}
function keyLokal(k) {
  const m = /^(\d+)\u00a7([\s\S]*)$/.exec(String(k));
  return m ? m[2] : String(k);
}

function alleRichtungen() {
  const raus = [];
  stationen.forEach((st, si) => zeilenEintraege(st).forEach(d => {
    raus.push({ key: zeilenKey(si, d), dep: d, station: st, si: si });
  }));
  return raus;
}
function richtungFinden(key) { return alleRichtungen().find(r => r.key === key) || null; }

// Jede Richtung gehoert in GENAU EIN Display. Neue Richtungen wandern auf ein Brett mit
// Platz, sonst entsteht eines dazu. Verschwundene fliegen raus. Welches Brett Platz
// bekommt, entscheidet der Modus oben. Der Nutzer kann die Verteilung ueber die
// Plus-Kachel selbst bestimmen, solche Bretter bleiben unberuehrt.
// Ein Zeilen-Schluessel traegt den ZIELTEXT, und der ist nicht in Stein. Ueber den Tag
// wird aus "solarCity" schon mal "solarCity \u00b7 Remise Kleinm\u00fcnchen", abends faehrt eine
// Linie nur noch bis zur Schleife, und bei einem Ausfall der Abfahrtsdaten ist er kurz
// ganz weg. Bisher flog die Zeile dann vom Brett, und der Kunde sah seine Stationen
// beim Arbeiten verschwinden (Kunde Hannes, 26.10.2026: "sobald ich versuche das ganze
// zu sortieren verschwinden einfach bereits eingestellte Stationen wieder").
// Darum: erst heilen. Gibt es zu Station UND Linie noch eine Zeile, ist es dieselbe
// Zeile mit neuer Beschriftung, und der Schluessel wird nachgezogen. Nur wenn die Linie
// an dieser Station wirklich nicht mehr vorkommt, faellt sie weg.
function schluesselHeilen(k, alle, belegt) {
  const m = /^(\d+)\u00a7([\s\S]*)$/.exec(String(k));
  if (!m) return null;
  const si = parseInt(m[1], 10);
  const rest = m[2], i = rest.indexOf('|');
  const linie = (i < 0 ? rest : rest.slice(0, i)).trim().toUpperCase();
  if (!linie) return null;
  const treffer = alle.filter(r => r.si === si
                  && String(r.dep.line || '').trim().toUpperCase() === linie);
  if (!treffer.length) return null;
  // Genau eine Zeile dieser Linie: eindeutig.
  if (treffer.length === 1) return treffer[0].key;
  // Mehrere, die Linie faehrt also in beide Richtungen. Dann gewinnt die, die noch auf
  // keinem Brett liegt: die andere hat ihren Platz ja schon. Bleibt es mehrdeutig, wird
  // nicht geraten, denn raten hiesse womoeglich die Gegenrichtung anzuzeigen.
  const frei = treffer.filter(r => !belegt || !belegt.has(r.key));
  return frei.length === 1 ? frei[0].key : null;
}

function displaysAuffuellen() {
  const alle = alleRichtungen();
  const vorhanden = alle.map(r => r.key);
  // Einmal nachschlagen statt bei jedem Vergleich neu suchen.
  // Netze in der Reihenfolge, in der sie vorkommen: danach richtet sich spielerisch.
  const netzRang = new Map();
  stationen.forEach(st => {
    const n = st.netz || 'WL';
    if (!netzRang.has(n)) netzRang.set(n, netzRang.size);
  });
  const wissen = new Map();
  alle.forEach((r, i) => wissen.set(r.key, {
    // Der Anzeige-Stil der STATION. Ein Zug-Brett (OEBB, Westbahn, SBB) kann keine
    // Strassenbahnlinien zeigen, und es liegt am Geraet in der timerow statt in der
    // masterrow. Darum duerfen nur Zeilen zusammen auf ein Brett, deren Stationen
    // denselben Stil wollen. Ohne diese Regel kippte bei "kompakt" alles auf EIN
    // Brett, und das trug dann den Stil der ersten Zeile (Paul 26.10.2026).
    stil: stilVorschlagStation(r.station),
    typ: typRang(r.dep.vt),
    netz: netzRang.get(r.station.netz || 'WL') || 0,
    st: stationen.indexOf(r.station), linie: r.dep.line, i: i
  }));
  // Eine Richtung darf auf MEHREREN Displays stehen (Paul 22.10.2026: "U2 ist meine
  // Prioritaetslinie und soll immer fixiert sein"). Doppelt wird nur INNERHALB eines
  // Displays verhindert. Weggefallene Richtungen fliegen ueberall raus.
  // Was schon irgendwo liegt, zaehlt beim Heilen als vergeben.
  const belegt = new Set();
  displays.forEach(d => d.richtungen.forEach(k => belegt.add(k)));
  displays.forEach(d => {
    const drin = new Set();
    d.richtungen = d.richtungen.map(k => {
      if (istUhrKey(k) || vorhanden.indexOf(k) >= 0) return k;
      const neu = schluesselHeilen(k, alle, belegt);
      if (neu) { belegt.add(neu); return neu; }
      return k;
    }).filter(k => {
      if (istUhrKey(k)) return !drin.has(k) && drin.add(k) !== null;   // Uhr bleibt immer
      if (vorhanden.indexOf(k) < 0 || drin.has(k)) return false;
      drin.add(k); return true;
    });
  });
  const irgendwo = new Set();
  displays.forEach(d => d.richtungen.forEach(k => irgendwo.add(k)));
  const offen = vorhanden.filter(k => !irgendwo.has(k) && !abgelegt.has(k));
  // Reihenfolge. Kompakt: nach Fahrzeugart, also U-Bahn oben und Zug unten, danach nach
  // Station und Linie. Spielerisch: zuerst nach Station, denn dort gehoert jede Station
  // auf ihr eigenes Brett. Ohne das stand alles so da, wie die API es gerade liefert.
  offen.sort((a, b) => {
    const x = wissen.get(a) || {}, y = wissen.get(b) || {};
    if (modus === 'spielerisch' && x.netz !== y.netz) return x.netz - y.netz;
    if (x.typ !== y.typ) return x.typ - y.typ;
    if (x.st !== y.st) return x.st - y.st;
    return String(x.linie).localeCompare(String(y.linie), 'de', { numeric: true });
  });
  // Ein chronologisches Brett ("Naechste Abfahrten") traegt BELIEBIG viele Linien und
  // zeigt davon die naechsten N. Der Zeilen-Deckel gilt nur fuer feste Zeilen. Vorher
  // zerlegte die Verteilung eine Haltestelle mit zehn Linien in vier Bretter, obwohl
  // eines gereicht haette (Kundenmeldung Bernd, 25.10.2026).
  const stilAuf = d => {
    const k = (d.richtungen || []).find(x => !istUhrKey(x));
    const w = k ? wissen.get(k) : null;
    return w ? w.stil : null;
  };
  const platz = d => !d.vomNutzer
    && (zeitbasiert(d) || zeilenEinheiten(d).length < maxZeilen(stilVon(d)));
  // Passt diese Zeile stilistisch auf das Brett? Leere Bretter nehmen alles.
  const stilPasst = (d, meine) => {
    const vorhanden = stilAuf(d);
    return vorhanden == null || !meine || vorhanden === meine.stil;
  };
  offen.forEach(k => {
    const meine = wissen.get(k);
    let ziel = null;
    if (modus === 'spielerisch' && meine) {
      // Ein Brett, auf dem schon Linien DIESES NETZES stehen, sonst ein leeres.
      ziel = displays.find(d => platz(d) && stilPasst(d, meine) && d.richtungen.some(k2 => {
        const w = wissen.get(k2);
        return w && w.netz === meine.netz;
      })) || displays.find(d => platz(d) && !d.richtungen.length);
    } else {
      ziel = displays.find(d => platz(d) && stilPasst(d, meine));
    }
    if (!ziel) { ziel = { richtungen: [], vomNutzer: false }; displays.push(ziel); }
    ziel.richtungen.push(k);
  });
  displays.forEach(gruppenPruefen);
  // Leere Displays soll es nicht geben (Paul 23.10.2026). Ausnahme ist genau das eine,
  // das gerade per Plus-Kachel entstanden ist: es wartet ja auf seine erste Linie.
  for (let i = displays.length - 1; i >= 0; i--) {
    if (!displays[i].richtungen.length && displays[i] !== frischesDisplay) displays.splice(i, 1);
  }
}

// Alle Abfahrten EINER Richtung, schon um den Gehweg bereinigt: was du nicht mehr
// erreichst, zeigt auch das Geraet nicht.
function abfahrtenDerRichtung(key) {
  const r = richtungFinden(key);
  if (!r) return [];
  const gw = gehwegFuer(r.station, key);
  // Der Stations-Block steht fuer alles, was hier abfaehrt, nach Uhrzeit.
  if (r.dep.alleStation) return r.station.abfahrten.filter(x => x.time >= gw);
  return r.station.abfahrten.filter(x => x.line === r.dep.line && x.dest === r.dep.dest && x.time >= gw);
}

// Wie die Firmware entscheidet, ob ein Segment ein Wien-Segment ist (initDisplay):
// Prefix WL:/WLB: zaehlt immer, eine nackte Nummer nur bei colour 1 oder 4.
// Ob die Firmware Zeilen ueber stopId:Linie zuordnet, entscheidet sie am ersten
// Zeichen der rbl-Liste: useStopIdFormat = isDigit(rblString[0]). Das haengt NICHT am
// Anzeige-Stil. Sobald die rbls nackte Nummern sind (Wien), braucht darum jede Station
// ihren eigenen Eintrag, sonst binden sich alle Linien an den LETZTEN Stop.
// Am Geraet gesehen (Paul 23.10.2026): drei Wien-Stationen mit Matrix in einem Eintrag
// ergaben reihenfolge='4921:U1,4921:U2,4921:U3', also zeigte nur die U3.
function stopIdFormat(d) {
  const erste = ((d && d.richtungen) || []).find(k => !istUhrKey(k));
  const r = richtungFinden(erste);
  if (!r) return false;
  const rbl = String(r.station.rbl || '');
  // Wien bindet jede Linie an ihren BAHNSTEIG (stopId:Linie). Das gilt fuer nackte
  // Nummern UND fuer WL:/WLB:-Prefixe, und der Konfigurator schickt Wien inzwischen
  // immer mit Prefix. Ohne den zweiten Fall landeten drei Wiener Stationen in EINEM
  // Eintrag, und das Geraet band alle Linien an den LETZTEN Stop: statt U1, U1 und 13A
  // stand dreimal 13A auf dem Brett (Paul 23.10.2026).
  return /^\d/.test(rbl) || /^WLB?:/i.test(rbl);
}

function istWienSegment(d) {
  // Die erste ECHTE Richtung zaehlt: steht die Uhr-Zeile vorn, sagt sie nichts ueber
  // das Netz (Paul 23.10.2026, x1 fiel weg sobald die Uhr nach oben rutschte).
  const erste = ((d && d.richtungen) || []).find(k => !istUhrKey(k));
  const r = richtungFinden(erste);
  if (!r) return false;
  const rbl = String(r.station.rbl || '');
  if (/^WLB?:/i.test(rbl)) return true;
  if (rbl.indexOf(':') < 0) { const c = stilVon(d); return (c === 1 || c === 4); }
  return false;
}

// Jedes Display ist eine eigene Karte, auch zwei Wiener mit demselben Stil (Paul
// 23.10.2026: "zwei Wiener Linien soll einfach gehen"). Am Geraet legt die Firmware
// gleichfarbige Wien-Segmente heute noch zusammen, darum schreiben wir x1 in den
// Eintrag und sagen es in EINER Zeile, statt die Oberflaeche darum herum zu bauen.
const VORSCHAU_TRENNT_WIEN = true;

// Ist 2.6 schon auf den Geraeten? Damit kommen w, z1 und z2 bis z5, s und r je
// Eintrag, d<n>, CLOCK:<n>, die verteilten Zeilen, Wechselzeiten ab 2 s, das Blinken bei
// 0 und die entfernten Stile. Ein 2.5.15 gibt es nicht als Release, lokale Testbauten
// mit dieser Nummer gelten darum als zu alt. Solange nicht,
// lassen wir das Uhr-Brett weg: aeltere Firmware wuerde CLOCK:<n> beim Server abfragen,
// nichts bekommen und eine leere Seite zeigen (Firmware-Sitzung 23.10.2026). Die anderen
// Felder (d, z2..z5, s3) ueberliest sie dagegen folgenlos.
// Statt einer Konstante fragen wir das Geraet selbst: /debug nennt in der ersten Zeile
// die Firmware-Version. Ab 2.6 kann es CLOCK, d<n>, z2 bis z5 und die verteilten
// Zeilen (Paul 23.10.2026, vorher stand hier ein Schalter von Hand).
const FW_MIT_UHR = '2.6';
let geraetVersion = null;        // null = noch nicht erreicht
function versionMin(ist, soll) {
  const a = String(ist || '').split('.').map(x => parseInt(x, 10) || 0);
  const b = String(soll || '').split('.').map(x => parseInt(x, 10) || 0);
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) > (b[i] || 0);
  }
  return true;
}
// Solange wir das Geraet nicht kennen, bleiben wir vorsichtig: kein CLOCK schreiben.
// Ob das Geraet das NEUE Format kann, entscheidet die Linienauswahl und schickt es als
// dFeld mit. Selbst nachrechnen koennte ich nicht verlaesslich: im iframe ueber HTTPS
// komme ich gar nicht ans Geraet (Mixed Content plus Private Network Access), meine
// eigene Abfrage laeuft dort immer ins Leere. Und die Schwelle soll nur an EINER Stelle
// stehen, sonst zieht beim Verschieben jemand nicht nach (26.10.2026).
let dFeldVonAussen = null;
function fwNeu() {
  if (dFeldVonAussen != null) return !!dFeldVonAussen;
  return !!geraetVersion && versionMin(geraetVersion, FW_MIT_UHR);
}

async function versionHolen() {
  for (const h of GERAETE_HOSTS) {
    const steuer = new AbortController();
    const uhr = setTimeout(() => steuer.abort(), 3000);
    try {
      const r = await fetch('http://' + h + '/debug', { cache: 'no-store', signal: steuer.signal });
      clearTimeout(uhr);
      const t = await r.text();
      const m = t.match(/Firmware\s+([\d.]+)/);
      if (m) { geraetVersion = m[1]; allesZeichnen(); return; }
    } catch (e) { clearTimeout(uhr); }
  }
}

// Was das GERAET aus unseren Displays macht. Wien liefert je Bahnsteig ein eigenes
// Segment, darum legt die Firmware Wien-Segmente mit gleicher colour absichtlich zu
// EINEM Display zusammen. Zwei getrennte Wien-Bretter mit demselben Stil gibt es nicht
// (Firmware-Sitzung 22.10.2026, von Paul am Geraet gesehen: zwei Wien-Displays wurden
// ein Brett mit zwei Seiten).
function geraeteGruppen() {
  const raus = [];
  const wienZiel = new Map();
  displays.forEach((d, i) => {
    const c = stilVon(d);
    const mischt = !VORSCHAU_TRENNT_WIEN && !zeigtUhr(d) && istWienSegment(d);
    const ziel = mischt ? wienZiel.get(c) : undefined;
    if (ziel !== undefined) { raus[ziel].quellen.push(i); return; }
    if (mischt) wienZiel.set(c, raus.length);
    raus.push({ quellen: [i], colour: c });
  });
  return raus;
}

// Welches Display der Gruppe gerade bearbeitet wird. Normal das erste, ausser der
// Nutzer hat in der zusammengelegten Karte eines ausgewaehlt.
let bearbeitet = null;
function displayWaehlen(i) { bearbeitet = i; allesZeichnen(); }

function schirmeBauen() {
  schirme = [];
  if (!stationen.length) { displays = []; return; }
  displaysAuffuellen();
  displays.forEach(d => { if (d.stil == null) d.stil = stilVorschlag(d); });

  const gruppen = geraeteGruppen();
  gruppen.forEach(gruppe => {
    const quellen = gruppe.quellen;
    const erste = displays[quellen[0]];
    // Zeilen: das Geraet kennt sie je Stil, bei mehreren Quellen gewinnt die groesste.
    const proSeite = Math.max(1, Math.max.apply(null, quellen.map(i => zeilenVon(displays[i]))));
    // Ein Brett, auf dem nur Stations-Bloecke liegen, zeigt am Geraet die naechsten
    // Abfahrten dieser Stationen nach Uhrzeit. In der Vorschau genauso, sonst staende da
    // eine Zeile je Block statt der Abfahrten (Paul 25.10.2026).
    const nurBloecke = quellen.every(i => nurBloeckeAuf(displays[i]));
    const zeitlich = nurBloecke || quellen.some(i => zeitbasiert(displays[i]));
    let seiten;
    if (zeigtUhr(erste)) {
      seiten = [[]];
    } else if (zeitlich) {
      // Alle Abfahrten der zugewiesenen Richtungen, nach Zeit, keine Gruppierung.
      let alle = [];
      quellen.forEach(i => displays[i].richtungen.forEach(k => { alle = alle.concat(abfahrtenDerRichtung(k)); }));
      alle.sort((a, b) => a.time - b.time);
      // Keine einzige Abfahrt: dann wenigstens zeigen, WAS auf dem Brett stehen wird.
      // Bei einem Stations-Block sind das die Linien der Haltestelle mit ihrem Namen.
      if (!alle.length) {
        quellen.forEach(i => displays[i].richtungen.forEach(k => {
          const r = richtungFinden(k);
          if (!r) return;
          if (r.dep.alleStation) {
            halteLinien(r.station).slice(0, proSeite).forEach((ln, n) => {
              const bsp = (r.station.letzteLinien || []).find(x => x.line === ln) || { line: ln };
              alle.push(Object.assign({}, bsp, { line: ln, dest: r.station.name,
                                                 time: BEISPIEL_ZEIT[n % BEISPIEL_ZEIT.length],
                                                 beispiel: true }));
            });
          } else {
            alle.push(Object.assign({}, r.dep, { time: BEISPIEL_ZEIT[alle.length % BEISPIEL_ZEIT.length],
                                                 beispiel: true }));
          }
        }));
      }
      seiten = [alle.slice(0, proSeite)];
    } else {
      // Die Zeilen aller Quellen hintereinander, in Display-Reihenfolge.
      let einheiten = [];
      quellen.forEach(i => { einheiten = einheiten.concat(zeilenEinheiten(displays[i])); });
      if (einheiten.length === 1 && proSeite >= 3) {
        // Eine einzige Zeile: ihre naechsten Abfahrten untereinander. Bei einer Gruppe
        // sind das die Abfahrten ALLER Richtungen darin, nach Uhrzeit gemischt.
        let naechste = [];
        einheiten[0].forEach(k => { naechste = naechste.concat(abfahrtenDerRichtung(k)); });
        naechste.sort((a, b) => a.time - b.time);
        // Faehrt gerade nichts, zeigt das Brett wenigstens, WIE es aussehen wird:
        // dieselbe Zeile mit Beispielzeiten statt einer schwarzen Flaeche (Paul 26.10.2026).
        if (!naechste.length) {
          einheiten[0].forEach(k => {
            const r = richtungFinden(k);
            if (!r) return;
            BEISPIEL_ZEIT.slice(0, proSeite).forEach(z => {
              naechste.push(Object.assign({}, r.dep, { time: z, beispiel: true }));
            });
          });
          naechste.sort((a, b) => a.time - b.time);
        }
        seiten = [naechste.slice(0, proSeite)];
      } else {
        const alle = einheiten.map((teil, ti) => {
          // Die Uhr-Zeile bleibt als leere Zeile stehen, darueber legt die Vorschau
          // spaeter die Uhrzeit.
          if (teil.length === 1 && istUhrKey(teil[0])) return { uhr: true, line: '', dest: '', time: '' };
          const deps = teil.map(k => {
            const r = richtungFinden(k);
            if (!r) return null;
            // Der Block hat keine eigene Abfahrt: hier steht die naechste der Station.
            if (r.dep.alleStation) return abfahrtenDerRichtung(k)[0] || null;
            return r.dep;
          }).filter(Boolean);
          if (!deps.length) return null;
          // Eine ruhende Linie hat keine Zeit. Ein ganz leeres Brett sagt aber nichts
          // darueber, wie es aussehen WIRD, und sah einfach kaputt aus. Darum eine
          // Beispielzeit, so wie der Topf es bei einer Station ohne Abfahrten auch macht
          // (Paul 26.10.2026).
          const faehrt = deps.filter(x => x.time != null);
          if (!faehrt.length) {
            return Object.assign({}, deps[0],
                                 { time: BEISPIEL_ZEIT[ti % BEISPIEL_ZEIT.length], beispiel: true });
          }
          const vorn = faehrt.reduce((a, b) => (b.time < a.time ? b : a));
          return teil.length > 1 ? Object.assign({}, vorn, { zusammen: teil.length }) : vorn;
        }).filter(Boolean);
        seiten = [];
        for (let x = 0; x < Math.max(alle.length, 1); x += proSeite) seiten.push(alle.slice(x, x + proSeite));
      }
    }
    const wahl = (bearbeitet != null && quellen.indexOf(bearbeitet) >= 0) ? bearbeitet : quellen[0];
    const d = displays[wahl];
    const titel = quellen.length > 1
      ? 'Display ' + quellen.map(i => i + 1).join(' + ')
      : 'Display ' + (quellen[0] + 1);
    seiten.forEach((daten, si) => schirme.push({
      titel: titel,
      unter: (seiten.length > 1 ? 'Seite ' + (si + 1) + ' von ' + seiten.length
                                : (gruppen.length > 1 ? 'von ' + gruppen.length : 'einziges Display')),
      daten,
      zeilen: proSeite,
      station: (d.richtungen.length === 1 ? (richtungFinden(d.richtungen[0]) || {}).station : null),
      display: d, index: wahl, quellen: quellen, seite: si + 1, seiten: seiten.length
    }));
  });
  if (zeiger >= schirme.length) zeiger = Math.max(0, schirme.length - 1);
}

// zeiger zeigt auf einen SCHIRM, nicht auf ein Display: ein Display mit zwei Seiten
// belegt zwei Schirme. Darum den Schirm suchen, der zu diesem Display gehoert.
function zumDisplay(di) {
  schirmeBauen();
  const i = schirme.findIndex(x => x.index === di);
  zeiger = i >= 0 ? i : Math.max(0, schirme.length - 1);
  allesZeichnen();
}

// Plus-Kachel: legt ein leeres Display an und fragt sofort, was darauf soll.
let frischesDisplay = null;    // das eine Display, das gerade leer sein darf
function displayAnlegen() {
  frischesDisplay = { richtungen: [], vomNutzer: true };
  displays.push(frischesDisplay);
  zumDisplay(displays.length - 1);
  // Gleich zur Liste springen: das frische Display ist leer und will gefuellt werden.
  const liste = document.getElementById('stationsliste');
  if (liste) liste.scrollIntoView({ block: 'start', behavior: 'smooth' });
}
// Neue Seite direkt mit dieser Linie: der Ausweg aus dem Dialog "Display ist voll".
function displayMitLinie(key) {
  displays.push({ richtungen: [key], vomNutzer: true });
  abgelegt.delete(key);
  zumDisplay(displays.length - 1);
}
// Loeschen fragt nach: ein Display ist schnell weg und alles darauf gleich mit.
function displayLoeschen(i) {
  const d = displays[i];
  if (!d) return;
  const n = d.richtungen.length;
  const text = n ? 'Die ' + n + (n === 1 ? ' Linie darauf wandert' : ' Linien darauf wandern')
                   + ' zur\u00fcck zu deinen anderen Linien.'
                 : 'Das Display ist leer, es geht nichts verloren.';
  dialogZeigen('Display ' + (i + 1) + ' l\u00f6schen', text, [
    { text: 'Behalten', still: true },
    { text: 'L\u00f6schen', tun: function () {
        d.richtungen.forEach(k => {
          const nochWo = displays.some((x, xi) => xi !== i && x.richtungen.indexOf(k) >= 0);
          if (!nochWo) abgelegt.add(k);
        });
        displayWeg(i);
      } }
  ], 'loeschen');
}

function displayWeg(i) {
  if (!displays[i]) return;
  displays.splice(i, 1);
  zeiger = Math.max(0, Math.min(zeiger, displays.length - 1));
  allesZeichnen();
}
// Passt noch eine Zeile drauf? Im Zeitmodus immer, denn dort bestimmt die Zahl der
// Linien die Zeilen nicht: es stehen einfach die naechsten X Abfahrten darauf
// (Paul 22.10.2026). Sonst zeigt der Dialog gleich den Ausweg, eine neue Seite.
function platzFrei(d, di, key) {
  if (zeitbasiert(d)) return true;
  const max = maxZeilen(stilVon(d));
  // Zusammengefasste Richtungen teilen sich eine Zeile. Gezaehlt werden darum die
  // Zeilen, nicht die Linien, sonst meldet sich der Dialog viel zu frueh.
  if (zeilenEinheiten(d).length < max) return true;
  const stilName = (STILE.find(x => x.id === stilVon(d)) || {}).name || 'Dieser Stil';
  dialogZeigen('Display ' + (di + 1) + ' ist voll',
    stilName + ' zeigt h\u00f6chstens ' + max + (max === 1 ? ' Zeile' : ' Zeilen') + '.'
    + (max < 5 ? ' Mit dem Stil Matrix w\u00e4ren 5 Zeilen m\u00f6glich.' : '')
    + ' Oder die Linie kommt auf eine neue Seite.',
    [{ text: 'Nicht jetzt', still: true },
     { text: 'Neue Seite anlegen', tun: function () { displayMitLinie(key); } }], 'warnung');
  return false;
}

// Richtung auf DIESEM Display anlegen, ohne Rueckfragen.
function richtungDrauf(di, key) {
  const d = displays[di];
  if (!d || d.richtungen.indexOf(key) >= 0) return;
  if (d === frischesDisplay) frischesDisplay = null;
  d.richtungen.push(key);
  d.vomNutzer = true;
  abgelegt.delete(key);
  allesZeichnen();
}

// Richtung auf DIESEM Display an- oder abschalten. Andere Displays bleiben unberuehrt,
// dieselbe Linie darf also mehrfach stehen.
function richtungSchalten(di, key, an) {
  const d = displays[di];
  if (!d) return;
  if (an) {
    if (d.richtungen.indexOf(key) >= 0) return;
    if (!platzFrei(d, di, key)) return;          // der Dialog uebernimmt
    if (istUhrKey(key)) { richtungDrauf(di, key); return; }
    // Dieselbe Linie darf mehrfach stehen, aber nicht aus Versehen: einmal nachfragen.
    const wo = [];
    displays.forEach((x, xi) => { if (xi !== di && x.richtungen.indexOf(key) >= 0) wo.push(xi + 1); });
    if (wo.length) {
      const r = richtungFinden(key);
      const wie = r ? r.dep.line + ' nach ' + r.dep.dest : 'Diese Linie';
      dialogZeigen('Linie liegt schon woanders',
        wie + ' steht schon auf Display ' + wo.join(' und ')
        + '. Du kannst sie zus\u00e4tzlich auch auf dieses Display legen.',
        [{ text: 'Nein', still: true },
         { text: 'Trotzdem', tun: function () { richtungDrauf(di, key); } }], 'doppelt');
      return;
    }
    richtungDrauf(di, key);
    return;
  } else {
    d.richtungen = d.richtungen.filter(k => k !== key);
    // Liegt sie danach auf gar keinem Display mehr, bleibt sie bewusst liegen.
    const nochWo = displays.some(x => x.richtungen.indexOf(key) >= 0);
    if (!nochWo) abgelegt.add(key);
  }
  allesZeichnen();
}

// Beispielzeiten fuer die Vorschau, wenn gerade nichts faehrt. Bewusst kleine, runde
// Zahlen, damit niemand sie fuer echte Minuten haelt.
const BEISPIEL_ZEIT = [2, 4, 6, 9, 12];

function seitenTeilen(daten, proSeite) {
  const out = [];
  for (let i = 0; i < Math.max(daten.length, 1); i += proSeite) out.push(daten.slice(i, i + proSeite));
  return out;
}

// EINE Zeile je gewaehlter Richtung, mit deren naechster Abfahrt. Das ist das Modell des
// Geraets: pro Linie und Richtung eine Zeile, nicht eine Zeile je Abfahrt. Vorher wurde ueber
// jede einzelne Abfahrt geblaettert, dadurch wurden aus drei Richtungen fuenfzehn Displays
// statt zwei (Paul 22.10.2026: "das waere dann ein Display und die 2 waere dann ein Plus").
function zeilenEintraege(st) {
  // Ganze Station: ein einziger Block. Die Zeit der naechsten Abfahrt kommt mit, damit
  // die Zeile unten "in x min" zeigen kann.
  // Zug-Brett: eine Zeile je Ziel, die Gattungen bleiben Filter.
  const ziele = zugZiele(st);
  if (ziele.length) {
    const erste = (st.abfahrten || [])[0] || {};
    // Marke des Bahnbetreibers statt einer Liniennummer: eine Verbindung hat keine
    // Linie, und das Feld darf nicht leer bleiben (Paul 26.10.2026).
    const oebb = /^OEBB/i.test(String(st.netz || '')) || /^OEBB/i.test(netzKuerzel(st) || '');
    return ziele.map(z => ({ line: oebb ? '\u00d6BB' : 'DB', dest: z.name, zugZiel: z.id, rid: '',
                             time: (erste.time != null ? erste.time : null),
                             vt: erste.vt || 'train',
                             lineColor: oebb ? 'e2002a' : 'ec0016', lineTextColor: 'ffffff' }));
  }
  if (st.alle) {
    const erste = (st.abfahrten || []).find(x => x.time >= gehwegStation(st)) || st.abfahrten[0] || {};
    return [{ line: ALLE_LINIE, dest: '', alleStation: true, rid: '',
              time: (erste.time != null ? erste.time : null), vt: erste.vt || '' }];
  }
  const raus = [];
  const gesehen = new Set();
  const knapp = new Map();
  st.abfahrten.forEach(d => {
    const k = d.line + '|' + d.dest;
    if (st.gewaehlt && st.gewaehlt.size && !st.gewaehlt.has(k)) return;
    if (gesehen.has(k)) return;      // Abfahrten sind nach Zeit sortiert, die erste gewinnt
    // Gehweg: was du nicht mehr erreichst, zeigt auch das Geraet nicht.
    if (d.time < gehwegFuer(st, k)) { knapp.set(k, d); return; }
    gesehen.add(k);
    raus.push(d);
  });
  // Richtungen, bei denen ALLES zu knapp ist, bleiben trotzdem in der Liste: sonst
  // wuerfe ein zu hoher Gehweg die Zuweisung des Nutzers weg (Paul 22.10.2026).
  knapp.forEach((d, k) => { if (!gesehen.has(k)) { gesehen.add(k); raus.push(d); } });
  // Und was GEWAEHLT ist, aber gerade gar nicht faehrt, bleibt ebenfalls stehen. Vorher
  // entstanden Zeilen nur aus aktuellen Abfahrten: eine abends ruhende Linie verschwand
  // damit aus der Oberflaeche UND aus der Config, das Geraet verlor sie stillschweigend
  // (zwei Kundenmeldungen, 24.10.2026: "wo ist die Linie 41 geblieben").
  if (st.gewaehlt && st.gewaehlt.size) {
    st.gewaehlt.forEach(k => {
      if (gesehen.has(k)) return;
      gesehen.add(k);
      const i = String(k).indexOf('|');
      const linie = i < 0 ? k : k.slice(0, i), ziel = i < 0 ? '' : k.slice(i + 1);
      const alt = (st.letzteLinien || []).find(x => x.line === linie && x.dest === ziel) || {};
      raus.push({ line: linie, dest: ziel, time: null, ruht: true,
                  rid: alt.rid || (st.ruhtRid && st.ruhtRid[k]) || '', vt: alt.vt || '',
                  lineColor: alt.lineColor || null, lineTextColor: alt.lineTextColor || null });
    });
  }
  return raus;
}

// Alte Bezeichnung bleibt fuer die Linienliste und die masterrow nutzbar.
function gewaehlteAbfahrten(st) { return zeilenEintraege(st); }

// ---- Zeichnen ------------------------------------------------------------------------
function allesZeichnen() {
  schirmeBauen();
  streifenZeichnen();
  editorZeichnen();
  stationenZeichnen();
  neuMarkieren();
  designZeichnen();
  fahrzeugZeichnen();
  gehwegZeichnen();
  zeitfensterZeichnen();
  ausgabeZeichnen();
}

function streifenZeichnen() {
  const el = document.getElementById('streifen');
  el.innerHTML = '';
  schirme.forEach((s, i) => {
    const w = document.createElement('div');
    w.className = 'schirm' + (i === zeiger ? ' aktiv' : '');
    const raum = document.createElement('div');
    raum.className = 'raum';
    const g = document.createElement('div');
    g.className = 'glas';
    const bild = document.createElement('div');
    bild.className = 'bild';
    g.appendChild(bild);
    raum.appendChild(g);
    const f = document.createElement('div');
    f.className = 'fuss';
    f.innerHTML = escapeHtmlFt(s.titel) + '<span>' + escapeHtmlFt(s.unter) + '</span>';
    raum.appendChild(f);
    w.appendChild(raum);
    w.onclick = () => { zeiger = i; allesZeichnen(); };
    el.appendChild(w);
    try {
      const stilHier = stilVon(s.display);
      dvHostLoadDisplaySettings(dsSegment(stilHier, zeilenVon(s.display), null, null, s.display));
      // Zeilenzahl der SEITE, nicht der Daten: die letzte Seite bleibt sonst nicht
      // dreizeilig, sondern zeichnet zwei grosse Zeilen. Am Geraet bleibt die unterste
      // Zeile einfach leer (Paul 23.10.2026).
      // Zeilenhoehe kommt von der GROESSTEN Seite dieses Stils, die eigene Seite steht
      // mittig darin. Darum zeichnen wir mit der grossen Zeilenzahl und schieben das
      // Ergebnis um die halbe Differenz nach unten. Zug-Displays zentriert das Geraet
      // nicht (Firmware-Sitzung 23.10.2026).
      // Rechnung wie in der Firmware, alles Ganzzahl-Division (Firmware-Sitzung
      // 23.10.2026): kopf 18 nur bei MVG (Min-Leiste), zeilenH = (170 - kopf) / groesste
      // Zeilenzahl dieses Stils. Eine Seite mit WENIGER Zeilen steht nicht als Block in
      // der Mitte, sondern verteilt wie eine Ansicht mit so vielen Zeilen: jede Zeile
      // mittig in ihrem Fach (170 - kopf) / eigene Zeilen. Wien 3 und 2 ergibt
      // Zeilenhoehe 56, Fach 85, Zeilen bei 14 und 99.
      const eigene = Math.max(1, s.zeilen || s.daten.length);
      const gross = (istZeitTyp(stilHier) || matrixSeiteGross(stilHier, eigene))
                    ? eigene : Math.max(eigene, zeilenDesStils(stilHier));
      const kopf = (parseInt(stilHier, 10) === 22) ? 18 : 0;
      const hoehe = Math.floor((170 - kopf) / gross);
      const fach = Math.floor((170 - kopf) / eigene);
      const html = zeigtUhr(s.display)
        ? uhrHTML(stilHier, bild, s.display)
        : dvPreviewHTML(stilHier, s.daten, gross, bild, istEigen(stilHier) ? eigenVon(stilHier) : null)
          + uhrZeileHTML(stilHier, s.daten, gross, s.display);
      // Fuer manche Display-Typen gibt es im Konfigurator gar keine Nachbildung
      // (z.B. 17 Bruenn). Dann sagen wir das, statt eine schwarze Flaeche zu zeigen.
      bild.innerHTML = (html && html.length > 50) ? html
        : '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;'
        + 'color:#9a9384;font:12px sans-serif;text-align:center;padding:14px;">'
        + 'Für diesen Anzeige-Stil gibt es noch keine Vorschau</div>';
      if (!zeigtUhr(s.display)) {
        const zeilenEl = zeilenElemente(bild, kopf, hoehe, gross);
        if (eigene < gross) seiteVerteilen(zeilenEl, kopf, hoehe, fach, eigene);
        nullBlinken(stilHier, zeilenEl, s.daten, s.display);
      }
    } catch (e) {
      bild.innerHTML = '<div style="color:#f88;font:12px sans-serif;padding:10px">' + escapeHtmlFt(e.message) + '</div>';
    }
  });

  // Kachel „Neue Anzeige"
  const neu = document.createElement('div');
  neu.className = 'schirm neu';
  neu.innerHTML = '<div class="raum">'
                + '<div class="glas"><div class="plus">+</div><div class="wort">Neue Anzeige</div></div>'
                + '<div class="fuss">&nbsp;</div></div>';
  neu.onclick = () => {
    displayAnlegen();
  };
  el.appendChild(neu);

  const aktiv = el.children[zeiger];
  if (aktiv) aktiv.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  raumWirkung(true);
  // Nach dem weichen Scrollen noch einmal nachziehen, sonst steht die Drehung kurz schief.
  setTimeout(function () { raumWirkung(true); }, 260);
  const s = schirme[zeiger];
  if (s && s.station) karteAufStation(s.station);
}

// Die beiden Reiter ueber der Karte. Sie entscheiden, wie das Display sortiert, und
// damit, was in der Karte darunter ueberhaupt einzustellen ist. Darum sitzen sie wie
// Browser-Tabs oben drauf und nicht als Schalter mitten im Formular.
function reiterZeichnen() {
  const el = document.getElementById('reiter');
  if (!el) return;
  const s = schirme[zeiger];
  const offen = !!document.querySelector('#klappLinien.offen');
  if (!s || !offen) { el.innerHTML = ''; el.style.display = 'none'; return; }
  el.style.display = '';
  const d = s.display;
  const zeit = zeitbasiert(d);
  // Stile ohne Wahl zeigen nur den einen Reiter, der zutrifft, und zwar unantastbar.
  const geht = kannSortieren(stilVon(d));
  const knopf = (an, text, wert) =>
    '<button class="' + (an ? 'an' : '') + '"'
    + (geht ? ' onclick="sortierungSetzen(' + s.index + ',\'' + wert + '\')"' : ' disabled')
    + '>' + text + '</button>';
  el.innerHTML = (geht || !zeit ? knopf(!zeit, 'Nach Linie', 'statisch') : '')
               + (geht || zeit ? knopf(zeit, 'Nach Abfahrt/Station', 'zeit') : '');
}

function editorZeichnen() {
  const el = document.getElementById('editor');
  const s = schirme[zeiger];
  if (!s) {
    const kopfLeer = document.getElementById('editorKopf');
    if (kopfLeer) kopfLeer.innerHTML = '<div class="kopf"><div class="titel">Noch nichts eingestellt</div></div>'
                 + '<div class="hinweis">Die Stationen kommen aus dem Schritt davor, dann erscheint hier dein erstes Display.</div>';
    el.innerHTML = '';
    return;
  }
  // Rechts steht das x, nicht die Seitenzahl: wie viele Seiten es sind, sagt der Hinweis
  // unter den Einstellungen ohnehin (Paul 22.10.2026).
  let h = '<div class="kopf"><div class="titel">' + escapeHtmlFt(s.titel) + '</div>'
        + (displays.length > 1
           ? '<button class="pfeil weg-x" title="dieses Display l\u00f6schen"'
             + ' onclick="displayLoeschen(' + s.index + ')">' + SYM_X + '</button>'
           : '<div class="modus">' + escapeHtmlFt(s.unter) + '</div>')
        + '</div>';

  const dVor = s.display;
  // Eine Zeile zur Wahrheit am Geraet, mehr nicht.
  if (istWienSegment(dVor)) {
    const wienGleich = displays.filter((x, xi) => xi !== s.index
      && stilVon(x) === stilVon(dVor) && istWienSegment(x));
    if (wienGleich.length) {
      h += '<div class="hinweis">Bis zum n\u00e4chsten Firmware-Update zeigt das Ger\u00e4t '
         + 'dieses und ' + (wienGleich.length === 1 ? 'das andere Wien-Display' : 'die anderen Wien-Displays')
         + ' mit diesem Stil als ein Brett mit Seiten.</div>';
    }
  }

  // Dieselbe Station auf zwei Brettern kann erst Firmware 2.6. Aeltere legen beide
  // Eintraege zusammen, der zweite geht verloren (Firmware-Sitzung 23.10.2026, Pauls
  // Berlin-Fall: U8 und U5 auf zwei Displays, am Geraet blieb nur U8). Darum sagen wir
  // es, solange sich das Geraet aelter meldet.
  if (geraetVersion && !fwNeu()) {
    const meine = new Set();
    (dVor.richtungen || []).forEach(k => {
      const r = richtungFinden(k);
      if (r) meine.add(r.station.rbl);
    });
    const auchWoanders = displays.some((x, xi) => xi !== s.index && (x.richtungen || []).some(k => {
      const r = richtungFinden(k);
      return r && meine.has(r.station.rbl);
    }));
    if (auchWoanders) {
      h += '<div class="hinweis">Dieselbe Station steht auf mehr als einem Display. '
         + 'Das kann erst Firmware ' + FW_MIT_UHR + ', dein Ger\u00e4t meldet '
         + escapeHtmlFt(geraetVersion) + '. Bis dahin zeigt es nur das erste davon.</div>';
    }
  }

  const dHier = s.display;
  // Die Sortierung steht GANZ OBEN, noch vor dem Stil: sie entscheidet, was darunter
  // ueberhaupt einzustellen ist (Zeilen und Reihenfolge, oder nur die Anzahl der
  // Abfahrten). Und sie heisst nicht mehr "was zeigt das Display", denn gezeigt werden
  // in beiden Faellen Abfahrten; der Unterschied ist die Sortierung
  // (Paul 25.10.2026: "Sortiert nach, nach Linie oder nach Abfahrt").
  if (!kannSortieren(stilVon(dHier))) {
    h += '<div class="hinweis">Dieser Anzeige-Stil sortiert immer nach Abfahrt, also nach '
       + 'Uhrzeit. Feste Zeilen je Linie gibt es dort nicht.</div>';
  } else {
    // Seit Firmware 2.6 steht 's' im EINTRAG, die Wahl gilt also je Display. Nur
    // aeltere Geraete lesen es aus den displaysettings, und dort kennt das Format nur
    // die colour. Der Hinweis gilt darum nur noch, wenn sich das Geraet aelter meldet
    // (Paul 23.10.2026).
    const gleich = (geraetVersion && !fwNeu())
      ? displays.filter((x, xi) => xi !== s.index && stilVon(x) === stilVon(dHier)) : [];
    if (gleich.length) {
      h += '<div class="hinweis">Bis zum n\u00e4chsten Firmware-Update gilt diese Wahl f\u00fcr '
         + 'alle ' + (gleich.length + 1) + ' Displays mit dem Stil '
         + escapeHtmlFt((STILE.find(y => y.id === stilVon(dHier)) || {}).name || '') + '.</div>';
    }
  }
  h += '<label class="feld" for="stilWahl">Anzeige-Stil dieses Displays</label>'
     + '<select id="stilWahl" onchange="stilSetzen(this.value)">' + stilOptionen(dHier) + '</select>';


  const nHier = (dHier && dHier.richtungen.length) || 0;
  const maxHier = maxZeilen(stilVon(dHier));
  const seitenHier = s.seiten || 1;
  const grossDesStils = zeilenDesStils(stilVon(dHier));
  if (!istZeitTyp(stilVon(dHier)) && grossDesStils > zeilenVon(dHier)
      && !matrixSeiteGross(stilVon(dHier), zeilenVon(dHier))) {
    h += '<div class="hinweis">Steht am Ger\u00e4t verteilt wie eine Ansicht mit so vielen '
       + 'Zeilen, in der Zeilenh\u00f6he der gr\u00f6\u00dften Seite dieses Stils ('
       + grossDesStils + ' Zeilen). Zwischen den Zeilen ist daf\u00fcr mehr Luft.</div>';
  }
  h += '<div class="hinweis">'
     + (zeigtUhr(dHier)
        ? 'Nur die Uhrzeit, gro\u00df \u00fcber das ganze Display.'
        : zeitbasiert(dHier)
        ? nHier + (nHier === 1 ? ' Linie' : ' Linien') + ' im Display, davon stehen die '
          + zeitZeilen(dHier) + ' n\u00e4chsten Abfahrten darauf, nach Uhrzeit sortiert.'
        : nurBloeckeAuf(dHier)
        ? (nHier === 1 ? 'Eine ganze Station' : nHier + ' ganze Stationen')
          + ', davon stehen die ' + zeilenVon(dHier)
          + ' n\u00e4chsten Abfahrten darauf, nach Uhrzeit sortiert.'
        : einzelLinie(dHier)
        ? (gruppenVon(dHier).length ? 'Eine zusammengefasste Zeile, darum ' : 'Eine Linie, darum ')
          + zeilenVon(dHier) + ' Zeilen mit ihren n\u00e4chsten Abfahrten.'
        : nHier + (nHier === 1 ? ' Richtung' : ' Richtungen') + ' zugewiesen, '
          + zeilenVon(dHier) + (zeilenVon(dHier) === 1 ? ' Zeile' : ' Zeilen') + ' pro Seite'
          + (seitenHier > 1 ? ', also ' + seitenHier + ' Seiten zum Durchwechseln' : '') + '.')
     + ' Dieser Stil kann h\u00f6chstens ' + maxHier + ' Zeilen.'
     + ' Insgesamt <b>' + displays.length + (displays.length === 1 ? ' Display' : ' Displays')
     + '</b>.'
     + (wahlGeraten
        ? '<div class="hinweis">Diese Einstellung kommt aus einem \u00e4lteren Format, in dem '
          + 'nicht steht, welche Linie zu welcher Station geh\u00f6rt. Wir haben jede Linie '
          + 'dort eingeordnet, wo sie wirklich h\u00e4lt. H\u00e4lt eine an beiden Stationen, '
          + 'steht sie jetzt an beiden. Schau die Zeilen einmal durch, bevor du speicherst: '
          + 'danach steht die Zuordnung fest.</div>'
        : '')
     + '</div>';

  // Je Zeile zeigen, was darauf steht, mit Pfeilen zum Umsortieren innerhalb des Displays.
  // Kopf mit Link: Zusammenfassen ist die eine Sache, die man hier noch tun kann, und
  // sie gehoert neben die Ueberschrift der Zeilen (Paul 22.10.2026).
  // Ab hier beginnt die Liste der Zeilen. Alles davor ist der Kopf und steht in einem
