// (Paul 22.10.2026). Inhalt unveraendert, nur der Platz ist ein anderer.
function zeitfensterZeichnen() {
  const el = document.getElementById('zeitfenster');
  if (!el) return;
  const s = schirme[zeiger];
  if (!s) { el.innerHTML = ''; return; }
  const dHier = s.display;
  const di = s.index;
  let h = '';

  // Die Uhr selbst legt man unten aus dem Linien-Topf aufs Display. Hier steht nur,
  // wie sie aussieht.
  h += '<label class="feld">Uhrzeit ' + neuBadge('uhr') + '</label>'
     + '<div class="schieber"><div class="wort">Uhrzeit anzeigen'
     + '<small>Legt die Uhr unten zu deinen Linien, als Zeile oder als ganzes Display</small></div>'
     + '<button class="schiene' + (uhrAn ? ' an' : '') + '" role="switch"'
     + ' aria-checked="' + (uhrAn ? 'true' : 'false') + '" onclick="uhrFeatureSchalten()">'
     + '<span class="kugel"></span></button></div>';
  if (uhrAn) {
    h += '<label class="feld">Zeitformat</label><div class="schalter">'
       + '<button class="' + (uhrSekunden ? 'an' : '') + '" onclick="sekundenSetzen(1)">14:07:32</button>'
       + '<button class="' + (uhrSekunden ? '' : 'an') + '" onclick="sekundenSetzen(0)">14:07</button>'
       + '</div>';
  }
  // Zeitfenster dieses Displays. Das Geraet haengt es am Anzeige-STIL auf, nicht am
  // einzelnen Display: zwei Displays mit demselben Stil teilen sich darum das Fenster.
  // Darauf weisen wir hin, statt es stillschweigend zu ueberschreiben.
  // Helligkeit gilt fuers ganze Geraet, nicht je Display.
  h += '<label class="feld">Helligkeit</label><div class="schalter">';
  [[1, 'Dunkel'], [2, 'Mittel'], [3, 'Hell']].forEach(b => {
    h += '<button class="' + (helligkeit === b[0] ? 'an' : '') + '"'
       + ' onclick="helligkeitSetzen(' + b[0] + ')">' + b[1] + '</button>';
  });
  h += '</div>';

  // Wechselzeiten und Standzeit gehoeren zum Display, wie die Farben auch.
  const c = stilVon(dHier);
  const e = einstFuer(dHier);
  const auto = !e.x && !e.y;
  // Ein Uhr-Brett hat keine Abfahrten, also auch nichts zum Wechseln. Dort bleibt nur
  // die Frage, wie lange die Seite steht (Paul 23.10.2026).
  const nurUhr = zeigtUhr(dHier);
  if (!nurUhr) {
    h += '<label class="feld" style="margin-top:18px">Abfahrtszeiten im Wechsel</label>'
       + '<div class="hinweis" style="margin-top:0">Wie lange jede der beiden Abfahrtszeiten '
       + 'steht, bevor die andere kommt.</div>'
       + '<div class="schalter">'
       + '<button class="' + (auto ? 'an' : '') + '" onclick="wechselAutomatik(' + di + ',true)">'
       + 'Automatisch</button>'
       + '<button class="' + (auto ? '' : 'an') + '" onclick="wechselAutomatik(' + di + ',false)">'
       + 'Selbst einstellen</button></div>';
    if (!auto) {
      [['x', '1. Abfahrt'], ['y', '2. Abfahrt']].forEach(r => {
        h += '<div class="regler"><span class="wort">' + r[1] + '</span>'
           + '<input type="range" min="' + WECHSEL_MIN + '" max="' + WECHSEL_MAX + '" step="1"'
           + ' value="' + (e[r[0]] / 10) + '"'
           + ' oninput="wechselSetzen(' + di + ',\'' + r[0] + '\',this.value)">'
           + '<span class="wert">' + (e[r[0]] / 10) + ' s</span></div>';
      });
    }
  }

  // Dritter Regler: so lange steht das Display, bevor die naechste Seite kommt. Unter
  // der Summe der beiden Wechselzeiten waere die zweite Zeit nie zu sehen.
  const mind = nurUhr ? STANDZEIT_MIN_UHR : standzeitMindestens(e);
  h += '<label class="feld" style="margin-top:14px">Wie lange dieses Display steht</label>'
     + '<div class="regler"><span class="wort">Standzeit</span>'
     + '<input type="range" min="' + mind + '" max="' + STANDZEIT_MAX + '" step="1"'
     + ' value="' + standzeitVon(e, nurUhr) + '" oninput="standzeitSetzen(' + di + ',this.value)">'
     + '<span class="wert">' + standzeitVon(e, nurUhr) + ' s</span></div>'
     + '<div class="hinweis" style="margin-top:0">'
     + ((nurUhr || auto)
        ? 'Mindestens ' + mind + ' Sekunden.'
        : 'Mindestens ' + mind + ' Sekunden, so lange brauchen die beiden Abfahrtszeiten '
          + 'zusammen (' + (e.x / 10) + ' + ' + (e.y / 10) + ').') + '</div>';

  // Bedient sich wie der Nachtmodus: ein Schalter, darunter die zwei Zeiten. Dieselbe
  // Frage, dieselbe Form (Paul 22.10.2026).
  h += '<label class="feld" style="margin-top:18px">Zeitfenster</label>';
  const f = dHier && dHier.fenster;
  h += '<div class="schieber"><div class="wort">Nur zu bestimmten Zeiten zeigen'
     + '<small>Display ' + (di + 1) + ' wird sonst \u00fcbersprungen</small></div>'
     + '<button class="schiene' + (f ? ' an' : '') + '" role="switch"'
     + ' aria-checked="' + (f ? 'true' : 'false') + '" onclick="fensterSchalten(' + di + ')">'
     + '<span class="kugel"></span></button></div>';
  if (f) {
    const stunden = function (feld, wert) {
      let o = '<select onchange="fensterSetzen(' + di + ',\'' + feld + '\',this.value)">';
      for (let x = 0; x < 24; x++) {
        const t = (x < 10 ? '0' + x : x) + ':00';
        o += '<option value="' + t + '"' + (t === wert ? ' selected' : '') + '>' + t + '</option>';
      }
      return o + '</select>';
    };
    h += '<div class="reihe" style="align-items:flex-end">'
       + '<div style="flex:1"><label class="feld">An ab</label>' + stunden('von', f.von) + '</div>'
       + '<div style="flex:1"><label class="feld">Wieder aus</label>' + stunden('bis', f.bis) + '</div>'
       + '</div>';
  }
  // Jedes Display hat jetzt sein eigenes Fenster im masterrow-Eintrag. Bleibt eine
  // Ausnahme: Wien schickt je Bahnsteig einen Eintrag, darum legt die Firmware
  // WL-Eintraege mit gleicher colour absichtlich zu EINEM Display zusammen. Dort gilt
  // das erste gesetzte Fenster (Firmware-Sitzung 22.10.2026).
  const gleicheStile = displays.filter((x, xi) => xi !== di && stilVon(x) === stilVon(dHier));
  const wienHier = istWienDisplay(dHier);
  const wienAuch = gleicheStile.filter(istWienDisplay);
  // Das Fenster steht als w im EINTRAG, gilt also je Seite. Erst eine alte Firmware
  // ohne d<n> legt gleichfarbige Wien-Seiten zusammen und teilt es dann (Paul 23.10.2026).
  if (f && wienHier && wienAuch.length) {
    h += '<div class="hinweis">Gilt für diese Seite. Bis zum nächsten Firmware-Update '
       + 'teilt sich ' + (wienAuch.length === 1 ? 'das andere Wien-Display' : 'die anderen Wien-Displays')
       + ' mit diesem Stil das Fenster noch mit, weil sie dort ein Brett sind.</div>';
  } else if (f) {
    h += '<div class="hinweis">Gilt für diese Seite.</div>';
  }

  el.innerHTML = h;
}

function stationenZeichnen() {
  const el = document.getElementById('stationsliste');
  if (!stationen.length) {
    el.innerHTML = '<div class="hinweis">Noch keine Linie. Die kommen aus dem Schritt davor.</div>';
    return;
  }
  // Weg ist nur, was auf dem GERADE GEWAEHLTEN Display liegt. Alles andere bleibt
  // waehlbar, auch wenn es schon auf einem anderen Display steht.
  const sHier = schirme[zeiger];
  const diHier = sHier ? sHier.index : 0;
  const hier = displays[diHier];
  const vergeben = new Set((hier && hier.richtungen) || []);
  const anderswo = new Map();
  displays.forEach((d, di) => { if (d !== hier) d.richtungen.forEach(k => {
    if (!anderswo.has(k)) anderswo.set(k, []);
    anderswo.get(k).push(di + 1);
  }); });
  // Was noch auf KEINEM Display liegt, kommt nach oben und pocht leise. Sonst
  // uebersieht man genau die Linie, die noch fehlt (Paul 23.10.2026).
  let offen = '', schonWo = '', leer = '';
  let uebrig = 0;
  stationen.forEach((st, si) => {
    // NUR die gewaehlten Richtungen, dieselbe Liste wie auf den Displays. Vorher lief
    // das ueber alle Abfahrten der Station, und dann stand im Pool die halbe
    // Haltestelle: in Linz lagen unter den vier gewaehlten Linien noch 600, 618, 411
    // und der Rest (Paul 23.10.2026). Wer eine weitere Linie will, holt sie sich in
    // der Linienauswahl.
    const zeilen = zeilenEintraege(st);
    zeilen.forEach(d => {
      const k = d.line + '|' + d.dest;
      if (vergeben.has(k)) return;
      uebrig++;
      const f = badgeFarben(d);
      const wo = anderswo.get(k) || [];
      // Schon woanders? Trotzdem voll sichtbar und waehlbar, nur mit einem Zeichen
      // daneben. Entfernen gibt es hier nicht: aus dem Pool verschwindet nichts.
      const zeile = '<div class="linie' + (wo.length ? '' : ' neu-dran') + '"'
         + ' title="auf das gew\u00e4hlte Display legen"'
         + ' onclick="richtungSchalten(' + diHier + ',\'' + k.replace(/'/g, "\\'") + '\',true)">'
         + '<b style="background:' + f.bg + ';color:' + f.fg + '">' + escapeHtmlFt(d.line) + '</b>'
         + '<div class="rumpf"><div class="ziel">' + escapeHtmlFt(d.dest) + '</div>'
         + '<div class="halt">' + escapeHtmlFt(st.name)
         + (d.beispiel ? ' &middot; Beispielzeiten' : '')
         + (wo.length ? ' &middot; schon auf Display ' + wo.join(' und ') : '') + '</div></div>'
         + (wo.length ? '<span class="doppel" title="liegt schon auf Display '
                        + wo.join(' und ') + '">' + DOPPEL_ICON + '</span>' : '')
         + '</div>';
      if (wo.length) schonWo += zeile; else offen += zeile;
    });
    if (!zeilen.length) {
      leer += '<div class="linie aus"><div class="rumpf"><div class="ziel">' + escapeHtmlFt(st.name)
         + '</div><div class="halt">'
         + (st.fehler ? 'nicht geladen, ' + escapeHtmlFt(st.fehler) : 'keine Abfahrten geladen')
         + '</div></div></div>';
    }
  });
  let h = '';
  if (offen) h += '<label class="feld" style="margin-top:2px">Noch auf keinem Display</label>' + offen;
  if (schonWo) h += '<label class="feld">Liegen schon woanders</label>' + schonWo;
  h += leer;
  // Die Uhr liegt im selben Topf wie die Linien: antippen legt sie aufs Display.
  // Bei Stilen ohne Uhr-Zeile geht nur das ganze Brett als Uhr, also nur auf einem
  // Display, das sonst leer ist.
  const uhrGeht = hier && (kannUhrZeile(stilVon(hier)) || !hier.richtungen.length);
  if (uhrAn && uhrGeht && !hatUhrZeile(hier)) {
    h = h + '<label class="feld">Dazu</label>'
      + '<div class="linie" title="Uhrzeit auf dieses Display legen"'
      + ' onclick="richtungSchalten(' + diHier + ',\'' + UHR_KEY + '\',true)">'
      + '<b style="background:#1b1b1b;color:#fff">' + SYM_UHR + '</b>'
      + '<div class="rumpf"><div class="ziel">Uhrzeit ' + neuBadge('uhr') + '</div>'
      + '<div class="halt">eine Zeile mit der aktuellen Zeit, allein auf dem Display '
      + 'wird daraus die gro\u00dfe Uhr</div></div></div>';
    uebrig++;
  }
  if (!uebrig) h = '<div class="hinweis">Alle deine Linien liegen bereits auf diesem Display.</div>';
  const t = document.getElementById('poolTitel');
  if (t) t.textContent = 'Linien f\u00fcr Display ' + (diHier + 1);
  el.innerHTML = h;
}

// Die Config, wie sie das Geraet bekommt. Eine Quelle fuer die Anzeige unten UND fuer
// das Speichern, damit beides nie auseinanderlaeuft.
function configBauen() {
  const teile = [], zeitTeile = [];
  displays.forEach((d, di) => {
    // WIEN: die Firmware bindet jede Linie an einen Stop (stopId:Linie). Steht in EINEM
    // Eintrag eine Liste aus mehreren rbls, landen am Ende alle Linien am LETZTEN Stop
    // der Liste, und alles was dort nicht faehrt verschwindet. Am Geraet gesehen
    // (Paul 23.10.2026): "4111,4201|U1,U2" wurde zu "4201:U1,4201:U2", also blieb nur
    // die U2 uebrig. Darum fuer Wien EIN EINTRAG JE STATION, so wie es der alte
    // Konfigurator macht. Fremdnetze duerfen mehrere rbls in einem Eintrag fuehren,
    // dort ist der Schluessel Linie:Ziel und das Multi-rbl-Segment ist gewollt.
    const proStation = new Map();   // rbl -> { station, linien: [] }
    d.richtungen.forEach(k => {
      const r = richtungFinden(k);
      if (!r) return;
      if (!proStation.has(r.station.rbl)) proStation.set(r.station.rbl, { station: r.station, linien: [] });
      const eintrag = proStation.get(r.station.rbl);
      if (eintrag.linien.indexOf(r.dep.line) < 0) eintrag.linien.push(r.dep.line);
    });
    if (!proStation.size && !zeigtUhr(d)) return;   // leeres Display kommt nicht ans Geraet

    const wien = stopIdFormat(d);
    const c = stilVon(d);
    const w = fensterToken(d);
    // s: 1 = feste Reihenfolge, 2 = je Linie eine Zeile mit erster und zweiter Abfahrt
    // im Wechsel, 3 = flach nach Uhrzeit. Unser "Naechste Abfahrten" ist die 3
    // (Firmware-Sitzung 23.10.2026).
    const sTeil = kannSortieren(c) ? '|s' + (zeitbasiert(d) ? '3' : '1') : '';
    const zTeil = uhrToken(d);
    // d<n> = Nummer des Displays. Eintraege mit gleichem d sind EIN Brett, egal welches
    // Netz und welche Farbe. Das loest den Wien-Merge und x1 gleich mit ab
    // (Firmware-Sitzung 23.10.2026). Alte Firmware ueberliest das Feld.
    const dTeil = '|d' + (di + 1);
    // Design je Display, in JEDEN Eintrag dieses Displays.
    const dsgTeil = designTeil(d);
    // Gruppen-Marker: nur sinnvoll, solange alle Linien in EINEM Eintrag stehen.
    const alleLinien = [];
    proStation.forEach(e => e.linien.forEach(l => { if (alleLinien.indexOf(l) < 0) alleLinien.push(l); }));
    const merges = [];
    zeilenEinheiten(d).forEach((teil, gi) => {
      if (teil.length < 2) return;
      teil.forEach(k => {
        const r = richtungFinden(k);
        const idx = r ? alleLinien.indexOf(r.dep.line) : -1;
        const marke = idx + ':' + (gi + 1);
        if (idx >= 0 && merges.indexOf(marke) < 0) merges.push(marke);
      });
    });

    const stuecke = [];
    if (!proStation.size) {
      // Nur die Uhr, keine Station: Platzhalter-Station CLOCK:<n>, eindeutig je Brett.
      // Die Firmware fragt sie nie beim Server ab und zaehlt das Brett in der Rotation
      // immer als zeigbar (Firmware-Sitzung 23.10.2026).
      // Wird IMMER geschrieben (Paul 23.10.2026). Kennt ein Geraet CLOCK noch nicht,
      // bleibt dort eine Seite leer, kaputt geht nichts.
      stuecke.push('CLOCK:' + (di + 1) + '|*|c' + c + '|g0|r' + zeilenVon(d)
                 + (w ? '|w' + w : '') + '|z1' + sTeil + dTeil + dsgTeil);
    } else if (wien && proStation.size > 1) {
      // Je Station ein Eintrag. Sie gehoeren zusammen, also KEIN x1: das Geraet legt
      // gleichfarbige Wien-Eintraege zu einem Brett zusammen, und genau das wollen wir
      // hier. Dass dadurch auch ein zweites Wien-Display mit gleichem Stil mithineinfaellt,
      // steht als Hinweis in der Oberflaeche.
      proStation.forEach((e, rbl) => {
        stuecke.push(rbl + '|' + (e.linien.length ? e.linien.join(',') : '*')
                   + '|c' + c + '|g' + gehwegStation(e.station) + '|r' + zeilenVon(d)
                   + (w ? '|w' + w : '') + zTeil + sTeil + dTeil + dsgTeil);
      });
    } else {
      const rbls = [], gw = [];
      proStation.forEach((e, rbl) => { rbls.push(rbl); gw.push(gehwegStation(e.station)); });
      const gTeil = gw.every(x => x === gw[0]) ? String(gw[0]) : gw.join(',');
      stuecke.push(rbls.join(',') + '|' + (alleLinien.length ? alleLinien.join(',') : '*')
                 + '|c' + c + '|g' + gTeil + '|r' + zeilenVon(d)
                 + (merges.length ? '|m' + merges.join(',') : '')
                 + (w ? '|w' + w : '') + zTeil + sTeil + dTeil + dsgTeil);
    }
    // Die timerow traegt die zeitbasierten Display-TYPEN (OEBB, Westbahn, SBB), NICHT
    // die Sortierung. Die steht als 's' in den displaysettings.
    const topf = istZeitTyp(c) ? zeitTeile : teile;
    stuecke.forEach(x => topf.push(x));
  });
  // colour-Liste parallel zu den Segmenten: Firmware vor 2.5.3 erkennt eine
  // Multi-Display-Config nur am Komma in dieser Liste (catchit-cities, Kunde Johann).
  const farben = [];
  teile.concat(zeitTeile).forEach(seg => {
    const m = seg.match(/\|c(\d+)(?:\||$)/);
    if (m) farben.push(m[1]);
  });
  // Was diese Oberflaeche kann, das Geraeteformat aber noch nicht traegt.
  const feiner = [];
  stationen.forEach(st => {
    Object.keys(st.gehwegRichtungen || {}).forEach(z => {
      feiner.push(st.rbl + ' Richtung ' + z + ': ' + st.gehwegRichtungen[z] + ' min');
    });
    Object.keys(st.gehwegLinien || {}).forEach(k => {
      feiner.push(st.rbl + ' ' + k.replace('|', ' nach ') + ': ' + st.gehwegLinien[k] + ' min');
    });
  });
  // Uhr-Bretter ohne Station: der Eintrag steht in der Zeile, die Firmware muss die
  // Gruppe ohne rbl aber erst lernen.
  // Nur noch ein Hinweis, falls das Geraet sich aelter meldet: geschrieben wird es immer.
  const uhren = [];
  if (geraetVersion && !fwNeu()) displays.forEach((d, i) => {
    if (zeigtUhr(d) && d.richtungen.length <= 1) uhren.push('Display ' + (i + 1));
  });
  return {
    masterrow: teile.join(';'),
    timerow: zeitTeile.join(';'),
    displaysettings: displaysettingsBauen(),
    colourListe: farben.join(','),
    uhren: uhren,
    feiner: feiner
  };
}

// Die Rohzeile steht nicht mehr auf der Seite (Paul 23.10.2026). configBauen bleibt,
// davon lebt das Speichern; hier wird nur noch gezeichnet, wenn das Feld existiert.
function ausgabeZeichnen() {
  const el = document.getElementById('mrowAus');
  if (!el) return;
  if (!stationen.length) { el.textContent = '(noch keine Station)'; return; }
  const c = configBauen();
  el.textContent = (c.masterrow ? 'masterrow: ' + c.masterrow : '(keine feste Zeile)')
                 + (c.uhren.length ? '\n\nUhr ohne Station geht ab Firmware ' + FW_MIT_UHR
                                   + ', dein Ger\u00e4t meldet ' + geraetVersion
                                   + '. Fehlt die Seite am Ger\u00e4t, fehlt das Release:\n'
                                   + c.uhren.join(', ') : '')
                 + (c.timerow ? '\n\ntimerow: ' + c.timerow : '')
                 + (c.displaysettings ? '\n\ndisplaysettings: ' + c.displaysettings : '')
                 + '\n\nhelligkeit: ' + ['', 'dunkel', 'mittel', 'hell'][helligkeit]
                 + '\n\nnachtmodus: ' + (nacht.an ? nacht.von + '-' + nacht.bis + ' Uhr aus' : 'aus')
                 + (c.feiner.length ? '\n\nGehweg feiner als je Station (kennt die alte Firmware noch nicht):\n'
                                    + c.feiner.join('\n') : '');
}

// ---- Ans Geraet speichern ---------------------------------------------------------------
// Das Geraet nimmt die Config als Formular auf http://<host>/config entgegen. Es startet
// dabei von seiner BESTEHENDEN Config und ueberschreibt nur Felder, die mitkommen
// (Config new_config = global_settings.GetConfig() im Handler). Darum schicken wir genau
// das, was diese Oberflaeche einstellt, und fassen den Rest nicht an.
const GERAETE_HOSTS = (function () {
  const eigen = new URLSearchParams(location.search).get('device');
  return eigen ? [eigen] : ['catch.local', 'straba.local'];
})();

function stand(text) {
  const el = document.getElementById('speicherStand');
  if (el) el.textContent = text || '';
}

// Erreichbarkeit: HEAD ohne CORS. Die Antwort ist undurchsichtig, aber sie kommt nur,
// wenn der Host ueberhaupt da ist. Nach 4 Sekunden geben wir auf und nehmen den naechsten.
async function hostSuchen() {
  for (const h of GERAETE_HOSTS) {
    stand('Suche ' + h + ' ...');
    const steuer = new AbortController();
    const uhr = setTimeout(() => steuer.abort(), 4000);
    try {
      await fetch('http://' + h + '/', { method: 'HEAD', mode: 'no-cors', cache: 'no-store', signal: steuer.signal });
      clearTimeout(uhr);
      return h;
    } catch (e) {
      clearTimeout(uhr);
    }
  }
  return null;
}

function speichernFragen() {
  const c = configBauen();
  if (!c.masterrow && !c.timerow) {
    sagen('Nichts zu speichern', 'Es ist noch kein Display mit Linien da.');
    return;
  }
  dialogZeigen('Auf das Ger\u00e4t schreiben',
    'Die Einstellungen gehen an ' + GERAETE_HOSTS[0] + '. Dein catch it startet danach neu.',
    [{ text: 'Abbrechen', still: true }, { text: 'Speichern', tun: speichern }], 'warnung');
}

// Laeuft die Seite im Geraete-Portal (catch.local/lines zeigt uns in einem iframe)?
// Dann darf sie NICHT selbst zu http://catch.local greifen: das Portal laedt uns ueber
// https, der Browser blockt den Mischverkehr. Stattdessen reicht die Elternseite die
// Config weiter, genau wie bei catchit-cities (Paul 23.10.2026).
function imRahmen() {
  try { return !!(window.parent && window.parent !== window); } catch (e) { return false; }
}

// Ein Datensatz fuer beide Wege. Das Geraete-Portal setzt ALLE Formularfelder und
// nimmt fuer fehlende seine Vorgaben, darum schicken wir auch die alten Einzelfelder
// mit, sonst faende sich danach Helligkeit 3 und Nachtmodus aus wieder.
function geraeteDaten() {
  const c = configBauen();
  const erste = displays[0];
  const e = erste ? einstFuer(erste) : standardEinst();
  // rbl und filter MUESSEN mit: die Seite des Geraets schickt ihr Formular nur ab,
  // wenn data.rbl gesetzt ist (fillAndSubmit: "if (data.rbl) { ... form.submit(); }").
  // Ohne das fuellt sie brav alle Felder und tut dann nichts (Paul 23.10.2026).
  // Inhaltlich gewinnt ohnehin die masterrow, die positionalen Felder baut das Geraet
  // daraus neu.
  const rbls = [], filter = [];
  (c.masterrow + ';' + c.timerow).split(';').forEach(function (seg) {
    seg = seg.trim();
    if (!seg) return;
    const teile = seg.split('|');
    if (teile.length < 2) return;
    rbls.push(teile[0]);
    filter.push(teile[1]);
  });
  return {
    type: 'setRBL',
    rbl: rbls.join(','),
    filter: filter.join('|'),
    masterrow: c.masterrow,
    timerow: c.timerow,
    displaysettings: c.displaysettings,
    colour: c.colourListe,
    // Ohne sortmode behaelt das Geraet seinen alten Wert. Steht dort 2 (chronologisch),
    // ignoriert es unsere feste Zeilenfolge. Displays in der timerow erzwingen 2 selbst.
    sortmode: c.masterrow ? '1' : '2',
    displaylight: String(helligkeit),
    nightmode: nacht.an ? '1' : '0',
    nightstart: String(nacht.von),
    nightend: String(nacht.bis),
    stopinterval: String(standzeitVon(e, erste ? zeigtUhr(erste) : false)),
    // Alt-Felder je Geraet: seit 2.6 zaehlen die Werte im Eintrag, aber das Portal
    // wuerde sie sonst auf Vorgabe setzen.
    chopper: String(e.h || 0),
    niederflurblink: String(e.n || 0),
    silberpfeil: String(e.k || 0),
    textcolor: String(e.t || 1),
    wienbadges: String(e.u || 0)
  };
}

async function speichern() {
  const daten = geraeteDaten();
  if (imRahmen()) {
    // Im Portal: die Elternseite fuellt ihr Formular und schickt es ab, danach startet
    // das Geraet neu. Eine Antwort bekommen wir nicht, darum sagen wir es direkt.
    stand('Schicke an das Ger\u00e4t ...');
    try { window.parent.postMessage(daten, '*'); } catch (e) {}
    setTimeout(function () {
      stand('Gespeichert um ' + uhrText().slice(0, 5) + '.');
      sagen('Gespeichert', 'Dein catch it startet gerade neu.');
    }, 600);
    return;
  }

  const host = await hostSuchen();
  if (!host) {
    stand('');
    dialogZeigen('Kein Ger\u00e4t gefunden',
      GERAETE_HOSTS.join(' und ') + ' antwortet nicht. Ist dein catch it eingeschaltet, '
      + 'und h\u00e4ngst du im selben WLAN?',
      [{ text: 'Alles klar' }], 'warnung');
    return;
  }
  // Wie der alte Konfigurator: ein echtes Formular an http://<host>/config. Der Browser
  // wechselt dabei auf die Seite des Geraets, die sagt, dass gespeichert wird und neu
  // gestartet. Das umgeht auch jede CORS-Frage, wir muessen die Antwort nicht lesen
  // (Paul 23.10.2026).
  stand('Speichere auf ' + host + ' ...');
  const f = document.createElement('form');
  f.method = 'POST';
  f.action = 'http://' + host + '/config';
  Object.keys(daten).forEach(function (k) {
    if (k === 'type') return;
    const i = document.createElement('input');
    i.type = 'hidden';
    i.name = k;
    i.value = daten[k];
    f.appendChild(i);
  });
  document.body.appendChild(f);
  f.submit();

}

function gewaehlteNamen(st) {
  const linien = linienAus(st.abfahrten);
  const raus = [];
  linien.forEach(l => {
    const k = l.name + '|' + l.ziel;
    if (!st.gewaehlt.size || st.gewaehlt.has(k)) { if (raus.indexOf(l.name) < 0) raus.push(l.name); }
  });
  return raus;
}


// Das w-Feld traegt STUNDEN ("6-22"), nicht Uhrzeiten: die Firmware liest beide Seiten
// mit toInt und vergleicht sie gegen die aktuelle Stunde (isTimeWindowActiveNow).
// "0700-0900" waere 700 und 900 und damit nie aktiv.
// Wien (WL/WLB) ist der Sonderfall beim Zusammenlegen, darum eigens geprueft.
function istWienDisplay(d) {
  return ((d && d.richtungen) || []).some(k => {
    const r = richtungFinden(k);
    return !!(r && /^WLB?$/i.test(String(r.station.netz || '')));
  });
}

// ---- Uhr-Display -----------------------------------------------------------------------
// Ein Display, das keine Abfahrten zeigt, sondern nur die Uhrzeit, gross in Poppins.
// Farben kommen aus dem jeweiligen Stil, damit die Uhr aussieht wie das Brett daneben.
// Die Werte stammen 1:1 aus display-renderer.js (Paul 22.10.2026).
function uhrLook(c, d) {
  const e = d ? einstFuer(d) : einstVon(c);
  const ci = parseInt(c, 10);
  switch (ci) {
    case 1: case 3:
      return { bg: (e.b === 1 ? '#051e0f' : '#000500'),
               fg: (e.t === 2 ? '#ffffff' : (e.t === 3 ? '#f8a400' : '#fff05d')) };
    case 11: case 12: case 14:
      return { bg: '#000094', fg: '#ffffff' };
    case 2: case 15: case 18: case 21: case 23: {
      const v = (ci === 2) ? 2 : ((ci === 15 || ci === 18) ? 3 : (ci === 21 ? 1 : e.t));
      return v === 2 ? { bg: '#001405', fg: '#94ce39', raster: '#001e0a' }
           : v === 3 ? { bg: '#0f0500', fg: '#ff8c00', raster: '#281200' }
                     : { bg: '#000000', fg: '#ffffff', raster: '#181818' };
    }
    case 5:  return { bg: '#0a1628', fg: '#ffffff' };
    case 24: return { bg: '#ffffff', fg: '#1a1a1a' };
    case 25: return { bg: '#264c9a', fg: '#ffffff' };
    // Seit dem Release geht z1 fuer ALLE Stile (Firmware-Sitzung 23.10.2026). Wo wir
    // die Hausfarben nicht kennen, zeigt die Uhr weiss auf schwarz.
    default: return { bg: '#000000', fg: '#ffffff' };
  }
}
// Die Uhr ist eine ZEILE wie eine Linie: man legt sie unten aus der Liste aufs Display.
// Ist sie die einzige Zeile, wird das ganze Brett zur Uhr (Feld z1 am Geraet), sonst
// belegt sie die unterste Zeile (z2) (Paul 23.10.2026).
const UHR_KEY = '@UHR';
function istUhrKey(k) { return k === UHR_KEY; }
function hatUhrZeile(d) { return !!(d && d.richtungen && d.richtungen.indexOf(UHR_KEY) >= 0); }

// Die Uhr ist von Haus aus AUS. Erst der Schalter unter Erweitert holt sie hervor,
// dann erscheint auch die Formatwahl und die Zeile im Linien-Topf (Paul 23.10.2026).
let uhrAn = false;
let uhrSekunden = true;          // Format, sobald die Uhr an ist
// Leere Displays soll es nicht geben (Paul 23.10.2026). Nur das eine, das gerade per
// Plus-Kachel entstanden ist, darf kurz leer sein, bis eine Linie darauf liegt.
function leereWeg(ausnahme) {
  for (let i = displays.length - 1; i >= 0; i--) {
    if (displays[i] !== ausnahme && !(displays[i].richtungen || []).length) displays.splice(i, 1);
  }
}

function uhrFeatureSchalten() {
  uhrAn = !uhrAn;
  if (!uhrAn) {
    // Ausgeschaltet heisst ausgeschaltet: liegengebliebene Uhr-Zeilen kommen weg, sonst
    // steht in der Config ein z, das die Oberflaeche gar nicht mehr zeigt. Ein Display,
    // das nur die Uhr trug, ist danach leer und faellt mit weg.
    displays.forEach(d => { d.richtungen = (d.richtungen || []).filter(k => !istUhrKey(k)); });
    leereWeg(null);
    allesZeichnen();
    return;
  }
  // Einschalten legt eine eigene Uhr-Seite an und rollt nach oben, damit man sieht, was
  // passiert ist. Steht schon ein leeres Display herum, bekommt das die Uhr, statt noch
  // eines danebenzulegen.
  if (!displays.some(d => hatUhrZeile(d))) {
    let ziel = displays.find(d => !(d.richtungen || []).length);
    if (ziel) ziel.richtungen = [UHR_KEY];
    else {
      ziel = { richtungen: [UHR_KEY], vomNutzer: true, stil: stilVon(displays[0] || {}) };
      displays.push(ziel);
    }
    allesZeichnen();
    zumDisplay(displays.indexOf(ziel));
    const kopf = document.querySelector('h1');
    if (kopf) kopf.scrollIntoView({ block: 'start', behavior: 'smooth' });
    return;
  }
  allesZeichnen();
}
function sekundenSetzen(wert) { uhrSekunden = !!wert; allesZeichnen(); }

// Die Uhr wird gesetzt wie normaler Text, in den echten Poppins-Breiten. Damit sie
// trotzdem nicht zappelt, haengt sie an einem festen Anker statt an der Mitte:
//   x0 = (Breite - Breite("HH:MM:") - Breite("00")) / 2
// Ab x0 steht "HH:MM:SS" linksbuendig. Dadurch ruehrt sich eine Minute lang nichts,
// nur die letzte Ziffer rueckt, und beim Minutenwechsel zentriert es sich neu
// (Firmware-Sitzung 23.10.2026). Die Zellen-Variante von vorhin ist damit hinfaellig.
let _uhrMass = null;
function uhrMess(fs) {
  if (!_uhrMass) _uhrMass = document.createElement('canvas').getContext('2d');
  _uhrMass.font = '700 ' + fs + 'px Poppins, sans-serif';
  return _uhrMass;
}
function uhrAnker(txt, fs, breite) {
  const ctx = uhrMess(fs);
  const dp = String(txt).lastIndexOf(':');
  const kopf = dp >= 0 ? String(txt).slice(0, dp + 1) : '';
  return Math.round((breite - ctx.measureText(kopf).width - ctx.measureText('00').width) / 2);
}

function uhrText() {
  const d = new Date(), z = n => (n < 10 ? '0' + n : String(n));
  return z(d.getHours()) + ':' + z(d.getMinutes()) + (uhrSekunden ? ':' + z(d.getSeconds()) : '');
}
function uhrHTML(c, el, d) {
  const look = uhrLook(c, d);
  if (!look) return '';
  el.style.background = look.bg;
  el.style.backgroundImage = look.raster
    ? 'radial-gradient(circle, ' + look.raster + ' 1.5px, transparent 1.5px)' : 'none';
  el.style.backgroundSize = look.raster ? '5px 5px' : 'auto';
  const t = uhrText();
  return '<div class="uhr-flaeche" style="color:' + look.fg + '">'
       + '<span class="uhr-zeit" data-fs="34" data-breite="320" style="left:'
       + uhrAnker(t, 34, 320) + 'px">' + escapeHtmlFt(t) + '</span></div>';
}
// Ganzes Brett = Uhr: wenn die Uhr die EINZIGE Zeile ist.
// Eine Seite mit weniger Zeilen als der groesste Bruder desselben Stils: die Zeilen
// behalten ihre Hoehe und Schrift, verteilen sich aber ueber den ganzen Schirm, jede
// mittig in ihrem Fach. Der Renderer hat sie vorher dicht untereinander gesetzt, hier
// ruecken sie auf ihren Platz (Firmware-Sitzung 23.10.2026).
// Die gezeichneten Zeilen in ihrer Reihenfolge einsammeln. Die meisten Renderer legen
// sie in einen Rahmen von 320 mal 170, darum eine Ebene tiefer mitsuchen.
function zeilenElemente(el, kopf, zeilenH, anzahl) {
  const raus = [];
  if (!el) return raus;
  let kandidaten = [];
  Array.prototype.forEach.call(el.children, k => {
    kandidaten.push(k);
    if (!k.style.top) kandidaten = kandidaten.concat(Array.prototype.slice.call(k.children));
  });
  kandidaten.forEach(k => {
    const oben = parseFloat(k.style.top);
    if (isNaN(oben)) return;
    const i = Math.round((oben - kopf) / zeilenH);
    if (i < 0 || i >= anzahl) return;
    if (Math.abs((kopf + i * zeilenH) - oben) > 1) return;   // keine Zeile, z.B. die Min-Leiste
    raus[i] = k;
  });
  return raus;
}

function seiteVerteilen(zeilen, kopf, zeilenH, fach, eigene) {
  if (fach <= zeilenH) return;
  const versatz = Math.floor((fach - zeilenH) / 2);
  zeilen.forEach((k, i) => {
    if (!k || i >= eigene) return;
    k.style.top = (kopf + i * fach + versatz) + 'px';
  });
}

// Blinken bei 0, nur Matrix. o1 laesst die Null blinken, o2 nimmt die Zahl weg und
// laesst daf\u00fcr das Ziel blinken. Die Vorschau bildet das in der grossen Ansicht nach
// (bis 3 Zeilen), dort ist die Zeile Linie, Ziel, Zahl (Firmware-Sitzung 23.10.2026).
function nullBlinken(colour, zeilen, daten, d) {
  const kann = (STIL_KANN[parseInt(colour, 10)] || {}).blinken;
  const o = (d ? einstFuer(d) : einstVon(colour)).o;
  if (!kann || !o) return;
  zeilen.forEach((k, i) => {
    const dep = daten[i];
    if (!k || !dep || parseInt(dep.time, 10) !== 0) return;
    const teile = Array.prototype.slice.call(k.children);
    if (teile.length < 3) return;          // kleine Ansicht sieht anders aus
    const zahl = teile[teile.length - 1];
    const ziel = teile[1];
    if (o === 1) { zahl.classList.add('blinkt'); }
    else { zahl.style.visibility = 'hidden'; ziel.classList.add('blinkt'); }
  });
}

// Die Uhrzeit in ihrer Zeile, in der Schrift des Stils. Ab 4 Zeilen wird sie klein,
// genau wie die Linien und Abfahrten daneben (Paul 23.10.2026).
function uhrZeileHTML(colour, daten, zeilen, d) {
  const i = daten.findIndex(x => x && x.uhr);
  if (i < 0) return '';
  const look = uhrLook(colour, d) || { bg: '#000', fg: '#fff' };
  const kopf = (parseInt(colour, 10) === 22) ? 18 : 0;   // MVG traegt oben die Min-Leiste
  const rowH = Math.floor((170 - kopf) / zeilen);
  const oben = kopf + i * rowH;
  const klein = zeilen >= 4;
  const ci = parseInt(colour, 10);
  let inhalt;
  if ([2, 15, 18, 21, 23].indexOf(ci) >= 0 && typeof dvLedTextSvg === 'function') {
    // Matrix zeichnet mit dem LED-Font: gross = Pixelgroesse 4, klein = 2.
    inhalt = dvLedTextSvg(uhrText(), klein ? 2 : 4, look.fg, true);
  } else {
    const fs = Math.min(klein ? 22 : 34, Math.round(rowH * 0.62));
    const t = uhrText();
    inhalt = '<span class="uhr-zeit" data-fs="' + fs + '" data-breite="320"'
           + ' style="font-family:\'Poppins\',sans-serif;font-weight:700;'
           + 'font-size:' + fs + 'px;left:' + uhrAnker(t, fs, 320) + 'px">'
           + escapeHtmlFt(t) + '</span>';
  }
  return '<div style="position:absolute;left:0;top:' + oben + 'px;width:320px;height:' + rowH
       + 'px;color:' + look.fg + ';">' + inhalt + '</div>';
}

function zeigtUhr(d) {
  return !!(d && hatUhrZeile(d) && zeilenEinheiten(d).length === 1);
}
// Eine Uhr-Zeile neben Abfahrten.
function hatUhrNeben(d) { return hatUhrZeile(d) && !zeigtUhr(d); }

// Die Uhr-Zeile ist frei verschiebbar wie jede andere Zeile (Paul 23.10.2026). Darum
// braucht das Geraet ihre Position: z1 = ganzes Brett, sonst z<Zeile+1>, also z2 fuer
// die erste Zeile, z3 fuer die zweite und so weiter.
function uhrZeilenNr(d) {
  if (!d || !hatUhrZeile(d)) return 0;
  const i = zeilenEinheiten(d).findIndex(teil => teil.length === 1 && istUhrKey(teil[0]));
  return i < 0 ? 0 : (i + 1);
}
function uhrToken(d) {
  if (zeigtUhr(d)) return '|z1';                 // ganzes Brett, geht bei jedem Stil
  if (!hatUhrNeben(d)) return '';
  if (!kannUhrZeile(stilVon(d))) return '';      // dort ignoriert die Firmware z2..z5
  return '|z' + (uhrZeilenNr(d) + 1);
}

function fensterToken(d) {
  const f = d && d.fenster;
  if (!f) return '';
  return parseInt(f.von, 10) + '-' + parseInt(f.bis, 10);
}

function fensterSchalten(di) {
  const d = displays[di];
  if (!d) return;
  d.fenster = d.fenster ? null : { von: '07:00', bis: '09:00' };
  allesZeichnen();
}
function fensterSetzen(di, welches, wert) {
  const d = displays[di];
  if (!d || !d.fenster) return;
  d.fenster[welches] = wert;
  allesZeichnen();
}
// displaysettings fuers Geraet: je Anzeige-Stil ein Segment mit Zeilen und Zeitfenster.
function displaysettingsBauen() {
  const proStil = new Map();
  displays.forEach(d => {
    const c = stilVon(d);
    const alt = proStil.get(c) || { r: 0, w: '', s: 0 };
    alt.r = Math.max(alt.r, zeilenVon(d));
    // Rueckfall fuer aeltere Geraete: die kennen das Fenster nur je Anzeige-Stil.
    if (d.fenster && !alt.w) alt.w = fensterToken(d);
    // Sortierung haengt am Stil, nicht am Display. Will EIN Display dieses Stils
    // chronologisch, gilt das fuer alle mit diesem Stil.
    if (!alt.s && zeitbasiert(d)) alt.s = 3;
    proStil.set(c, alt);
  });
  const teile = [];
  proStil.forEach((v, c) => { teile.push(dsSegment(c, v.r, v.w, v.s || 1)); });
  return teile.join(';');
}

// Zeile innerhalb eines Displays verschieben. Gezaehlt wird in ZEILEN, nicht in
// Richtungen: eine zusammengefasste Zeile wandert mit allen ihren Mitgliedern.
function zeileSchieben(di, i, richtung) {
  const d = displays[di];
  if (!d) return;
  const einheiten = zeilenEinheiten(d);
  const j = i + richtung;
  if (j < 0 || j >= einheiten.length) return;
  const t = einheiten[i]; einheiten[i] = einheiten[j]; einheiten[j] = t;
  d.richtungen = einheiten.reduce((alle, teil) => alle.concat(teil), []);
  d.vomNutzer = true;
  allesZeichnen();
}

// ---- Zeilen ziehen -------------------------------------------------------------------
// Die Pfeile bleiben, aber man kann eine Zeile auch einfach nehmen und verschieben
// (Paul 23.10.2026). Auf dem Handy erst nach kurzem Halten, sonst waere das Scrollen
// der Seite blockiert. Waehrend des Ziehens wird nur das DOM umgehaengt, die Daten
// kommen beim Loslassen dran, sonst wuerde der Neuaufbau das gezogene Element wegreissen.
let ziehen = null;
function zeileGreifen(ev, di, el) {
  if (ev.target.closest('button, input, select, a')) return;
  const z = { di: di, el: el, y: ev.clientY, id: ev.pointerId, aktiv: false };
  z.timer = setTimeout(function () {
    z.aktiv = true;
    el.classList.add('zieht');
    el.style.touchAction = 'none';
    try { el.setPointerCapture(z.id); } catch (e) {}
  }, 180);
  ziehen = z;
}
function zeileZiehen(ev) {
  if (!ziehen) return;
  if (!ziehen.aktiv) {
    // Finger wandert, bevor das Halten durch ist: das war Scrollen, kein Ziehen.
    if (Math.abs(ev.clientY - ziehen.y) > 8) { clearTimeout(ziehen.timer); ziehen = null; }
    return;
  }
  ev.preventDefault();
  const liste = ziehen.el.parentElement;
  let davor = null;
  Array.prototype.forEach.call(liste.children, function (x) {
    if (x === ziehen.el || !x.classList.contains('linie')) return;
    const r = x.getBoundingClientRect();
    if (!davor && ev.clientY < r.top + r.height / 2) davor = x;
  });
  if (davor !== ziehen.el.nextElementSibling) liste.insertBefore(ziehen.el, davor);
}
function zeileLoslassen() {
  if (!ziehen) return;
  clearTimeout(ziehen.timer);
  const z = ziehen;
  ziehen = null;
  if (!z.aktiv) return;
  z.el.classList.remove('zieht');
  z.el.style.touchAction = '';
  const folge = Array.prototype.filter.call(z.el.parentElement.children,
                  x => x.classList.contains('linie'))
                .map(x => parseInt(x.dataset.idx, 10));
  zeilenNeuOrdnen(z.di, folge);
}
// Reihenfolge der Zeilen uebernehmen: aus den Einheiten in der neuen Folge wieder die
// flache Liste der Richtungen bauen.
function zeilenNeuOrdnen(di, folge) {
  const d = displays[di];
  if (!d) return;
  const einheiten = zeilenEinheiten(d);
  const neu = folge.map(n => einheiten[n]).filter(Boolean);
  if (neu.length !== einheiten.length) { allesZeichnen(); return; }
  d.richtungen = neu.reduce((alle, teil) => alle.concat(teil), []);
  d.vomNutzer = true;
  allesZeichnen();
}

// ---- Zeilen zusammenfassen -----------------------------------------------------------
// Der Dialog erklaert kurz, wozu das gut ist, und laesst die Richtungen dieses Displays
// ankreuzen. Zwei reichen; wer mehr nimmt, legt sie alle in eine Zeile.
let gruppeWahl = new Set();

function gruppeFragen(di, vorgabe) {
  const d = displays[di];
  if (!d) return;
  gruppeWahl = new Set(vorgabe || []);
  gruppeDialogZeichnen(di);
}

function gruppeHaken(di, key) {
  if (gruppeWahl.has(key)) gruppeWahl.delete(key); else gruppeWahl.add(key);
  gruppeDialogZeichnen(di);
}

function gruppeDialogZeichnen(di) {
  const d = displays[di];
  if (!d) return;
  const frei = zeilenEinheiten(d).length - 1;   // so viele Zeilen hat das Display danach
  let liste = '';
  (d.richtungen || []).forEach(k => {
    const r = richtungFinden(k);
    if (!r) return;
    const schon = gruppeVon(d, k);
    const an = gruppeWahl.has(k);
    const f = badgeFarben(r.dep);
    liste += '<div class="linie' + (an ? ' gewaehlt' : '') + (schon ? ' fest' : '') + '"'
           + (schon ? '' : ' onclick="gruppeHaken(' + di + ',\'' + k.replace(/'/g, "\\'") + '\')"')
           + ' style="cursor:' + (schon ? 'default' : 'pointer') + '">'
           + '<span class="haken">' + (an ? '&#10003;' : '') + '</span>'
           + '<b style="background:' + f.bg + ';color:' + f.fg + '">' + escapeHtmlFt(r.dep.line) + '</b>'
           + '<div class="rumpf"><div class="ziel">' + escapeHtmlFt(r.dep.dest) + '</div>'
           + '<div class="halt">' + escapeHtmlFt(r.station.name)
           + (schon ? ' &middot; steht schon in einer Zeile zusammen' : '') + '</div></div>'
           + '</div>';
  });
  const reicht = gruppeWahl.size > 1;
  dialogZeigen('Zeilen zusammenfassen',
    'Richtungen, die dieselbe Strecke fahren, brauchen keine eigene Zeile. Kreuze an, '
    + 'welche sich eine teilen sollen. Das Display zeigt dann die n\u00e4chste Abfahrt davon '
    + 'und hat eine Zeile mehr frei.',
    [{ text: 'Abbrechen', still: true },
     { text: reicht ? 'Zusammenfassen' : 'Mindestens zwei w\u00e4hlen', aus: !reicht, offen: !reicht,
       tun: function () { gruppeAnlegen(di); } }],
    'doppelt',
    '<div class="wahlliste">' + (liste || '<div class="leer">Keine Richtung auf diesem Display.</div>')
      + '</div>');
}

function gruppeAnlegen(di) {
  const d = displays[di];
  if (!d) return;
  const teil = (d.richtungen || []).filter(k => gruppeWahl.has(k) && !gruppeVon(d, k));
  if (teil.length < 2) return;
  if (!d.gruppen) d.gruppen = [];
  d.gruppen.push(teil);
  // Die Mitglieder ruecken zusammen, damit die Zeile dort steht, wo das erste Mitglied war.
  d.vomNutzer = true;
  gruppeWahl = new Set();
  allesZeichnen();
}

// Eine zusammengefasste Zeile wieder in ihre Richtungen aufloesen.
function gruppeLoesen(di, i) {
  const d = displays[di];
  if (!d) return;
  const teil = zeilenEinheiten(d)[i];
  if (!teil || teil.length < 2) return;
  d.gruppen = gruppenVon(d).filter(g => g !== gruppeVon(d, teil[0]));
  if (!d.gruppen.length) delete d.gruppen;
  allesZeichnen();
}

// Das x nimmt die ganze Zeile vom Display, also auch alle Richtungen einer Gruppe.
function zeileWeg(di, i) {
  const d = displays[di];
  if (!d) return;
  const teil = zeilenEinheiten(d)[i];
  if (!teil) return;
  teil.forEach(k => richtungSchalten(di, k, false));
}

// ---- Farben & Linien Design ------------------------------------------------------------
// Gezeigt wird, was der Stil des GEWAEHLTEN Displays kann. Kann er nichts davon, steht
// das auch so da, statt leere Schalter anzubieten (Paul 22.10.2026).
function designZeichnen() {
  const el = document.querySelector('#klappDesign .klapp-koerper');
  if (!el) return;
  const sHier = schirme[zeiger];
  const d = sHier && sHier.display;
  if (!d) { el.innerHTML = '<div class="hinweis">Noch kein Display da.</div>'; return; }
  const c = stilVon(d);
  const k = STIL_KANN[parseInt(c, 10)] || {};
  const e = einstFuer(d);
  const stilName = (STILE.find(x => x.id === c) || {}).name || ('Stil ' + c);
  const di = displays.indexOf(d);
  let h = '';

  // Auch die Verspaetung und der Zeichensatz zaehlen: sonst verschluckt der fruehe
  // Ausstieg einen Schalter, sobald ein Stil nur diese kann.
  if (!k.schrift && !k.grund && !k.badges && !k.verspaetung && !k.matrixSchrift) {
    h += '<div class="hinweis">' + escapeHtmlFt(stilName)
       + ' bringt seine Farben fest mit, hier gibt es nichts einzustellen. '
       + 'Wiener Linien, Matrix und Paper White lassen sich f\u00e4rben.</div>';
    el.innerHTML = h;
    return;
  }

  if (k.schrift) {
    const w = SCHRIFT_WAHL[k.schrift];
    h += '<label class="feld">' + w.titel + '</label><div class="farbreihe">';
    w.knoepfe.forEach(b => {
      h += '<button class="' + (e.t === b[0] ? 'an' : '') + '"'
         + ' style="background:' + b[2] + ';color:' + b[3] + '"'
         + ' onclick="schriftSetzen(' + di + ',' + b[0] + ')">'
         + (e.t === b[0] ? '&#10003; ' : '') + b[1] + '</button>';
    });
    h += '</div>';
  }

  if (k.matrixSchrift) {
    h += '<label class="feld">Zeichensatz</label><div class="schalter">';
    MATRIX_SCHRIFT.forEach(b => {
      h += '<button class="' + (e.f === b[0] ? 'an' : '') + '"'
         + ' onclick="matrixSchriftSetzen(' + di + ',' + b[0] + ')">' + b[1] + '</button>';
    });
    h += '</div>'
       + '<div class="hinweis">CZ + HU bringt die tschechischen und ungarischen Zeichen mit, '
       + 'die der DACH-Satz nicht hat. Sonst sind die beiden gleich.</div>';
  }

  if (k.grund) {
    h += '<label class="feld">Hintergrundfarbe</label><div class="farbreihe">'
       + '<button class="' + (e.b === 0 ? 'an' : '') + '" style="background:#000;color:#FFD700"'
       + ' onclick="grundSetzen(' + di + ',0)">' + (e.b === 0 ? '&#10003; ' : '') + 'Schwarz</button>'
       + '<button class="' + (e.b === 1 ? 'an' : '') + '" style="background:#0a3d1f;color:#FFD700"'
       + ' onclick="grundSetzen(' + di + ',1)">' + (e.b === 1 ? '&#10003; ' : '') + 'Gr\u00fcn</button>'
       + '</div>'
       + '<div class="hinweis">Schwarz ist kontrastreicher, Gr\u00fcn schlichter und n\u00e4her am Original.</div>';
  }

  if (k.badges) {
    h += '<label class="feld">Linien-Badges</label><div class="schalter">';
    [[0, 'Aus'], [1, 'Linie'], [2, 'Ganze Zeile']].forEach(b => {
      h += '<button class="' + (e.u === b[0] ? 'an' : '') + '"'
         + ' onclick="badgeSetzen(' + di + ',' + b[0] + ')">' + b[1] + '</button>';
    });
    h += '</div>'
       + '<div class="hinweis">Farbige Linien-K\u00e4stchen in der offiziellen Linienfarbe, '
       + 'wie auf den echten Anzeigen.</div>';
    if (e.u) {
      h += '<div class="kasten"><div class="titelchen">Badges f\u00fcr</div>';
      BADGE_FAHRZEUGE.forEach(bv => {
        h += '<label class="haken-zeile"><input type="checkbox" ' + ((e.v & bv[0]) ? 'checked ' : '')
           + 'onchange="badgeFahrzeugSetzen(' + di + ',' + bv[0] + ',this.checked)">' + bv[1] + '</label>';
      });
      h += '<div class="hinweis">Nur Linien mit hinterlegter Linienfarbe bekommen ein Badge. '
         + 'F\u00fcr die Wiener U-Bahn sind die Farben fest eingebaut.</div></div>';

  // Ehrlich bleiben: das Geraet kennt diese Werte nur je Stil, nicht je Display.
  const gleiche = displays.filter(x => stilVon(x) === c).length;
  if (gleiche > 1) {
    h += '<div class="hinweis"><b>Gilt f\u00fcr alle ' + gleiche + ' Displays mit dem Stil '
       + escapeHtmlFt(stilName) + '.</b> Das Ger\u00e4t merkt sich Farben je Anzeige-Stil, '
       + 'nicht je Display.</div>';

// ---- Gehweg & Nachtmodus ---------------------------------------------------------------
function gehwegZeichnen() {
  const el = document.querySelector('#klappGehweg .klapp-koerper');
  if (!el) return;
  let h = '';

  h += '<div class="schieber"><div class="wort">Nachtmodus aktivieren'
     + '<small>Display nachts ausschalten</small></div>'
     + '<button class="schiene' + (nacht.an ? ' an' : '') + '" role="switch"'
     + ' aria-checked="' + (nacht.an ? 'true' : 'false') + '" onclick="nachtSchalten()">'
     + '<span class="kugel"></span></button></div>';
  if (nacht.an) {
    const stunden = function (feld, wert) {
      let o = '<select onchange="nachtZeitSetzen(\'' + feld + '\',this.value)">';
      for (let x = 0; x < 24; x++) o += '<option value="' + x + '"' + (x === wert ? ' selected' : '') + '>'
                                     + (x < 10 ? '0' + x : x) + ':00</option>';
      return o + '</select>';
    };
    h += '<div class="reihe" style="align-items:flex-end">'
       + '<div style="flex:1"><label class="feld">Aus ab</label>' + stunden('von', nacht.von) + '</div>'
       + '<div style="flex:1"><label class="feld">Wieder an</label>' + stunden('bis', nacht.bis) + '</div>'
       + '</div>';
  }

  // Eigene Ueberschrift: als Feld-Label gelesen wirkte der Gehweg wie eine Einstellung
  // des Nachtmodus darueber (Paul 22.10.2026).
  h += '<h2 style="margin-top:22px">Gehweg zur Haltestelle</h2>'
     + '<div class="hinweis" style="margin-top:0">Abfahrten unter dieser Minutenzahl werden '
     + 'ausgeblendet.</div>';
  if (!stationen.length) {
    h += '<div class="hinweis">Noch keine Station da.</div>';
    el.innerHTML = h;
    return;
  }
  stationen.forEach((st, si) => {
    const offen = gwOffen.has(st.rbl);
    const abw = Object.keys(st.gehwegLinien || {}).length + Object.keys(st.gehwegRichtungen || {}).length;
    h += '<div class="gwzeile"><div class="rumpf"><div class="ziel">' + escapeHtmlFt(st.name) + '</div>'
       + '<div class="halt">' + (abw ? abw + (abw === 1 ? ' Ausnahme' : ' Ausnahmen')
                                     : 'gilt f\u00fcr alles an dieser Station') + '</div></div>'
       + '<input type="number" min="0" max="99" value="' + gehwegStation(st) + '"'
       + ' onchange="gehwegStationSetzen(' + si + ',this.value)"> <span class="min">min</span>'
       + '<button class="still klein" onclick="gwGenauer(\'' + st.rbl + '\')">'
       + (offen ? 'fertig' : 'genauer') + '</button></div>';
    if (!offen) return;
    const eintraege = zeilenEintraege(st);
    if (!eintraege.length) h += '<div class="hinweis">Keine Linien geladen.</div>';
    // Nach Ziel buendeln: das ist die Richtung, und am Steig entscheidet sich der Weg.
    const nachZiel = new Map();
    eintraege.forEach(dep => {
      if (!nachZiel.has(dep.dest)) nachZiel.set(dep.dest, []);
      nachZiel.get(dep.dest).push(dep);
    });
    nachZiel.forEach((deps, ziel) => {
      const rWert = gehwegRichtung(st, ziel);
      const badges = deps.slice(0, 4).map(function (d) {
        const f = badgeFarben(d);
        return '<b style="background:' + f.bg + ';color:' + f.fg + '">' + escapeHtmlFt(d.line) + '</b>';
      }).join('');
      h += '<div class="gwzeile tiefer">' + badges
         + '<div class="rumpf"><div class="ziel">&#8594; ' + escapeHtmlFt(ziel) + '</div>'
         + '<div class="halt">' + (rWert != null ? 'eigener Wert f\u00fcr diese Richtung'
                                    : 'wie die Station, ' + gehwegStation(st) + ' min')
         + (deps.length > 1 ? ' &middot; ' + deps.length + ' Linien' : '') + '</div></div>'
         + '<input type="number" min="0" max="99" placeholder="' + gehwegStation(st) + '"'
         + ' value="' + (rWert != null ? rWert : '') + '"'
         + ' onchange="gehwegRichtungSetzen(' + si + ',\'' + String(ziel).replace(/'/g, "\\'") + '\',this.value)">'
         + ' <span class="min">min</span></div>';
      // Einzelne Linien nur, wenn in dieser Richtung ueberhaupt mehrere fahren.
      if (deps.length < 2) return;
      deps.forEach(dep => {
        const k = dep.line + '|' + dep.dest;
        const eigen = (st.gehwegLinien || {})[k];
        const erbt = (rWert != null) ? rWert : gehwegStation(st);
        const f = badgeFarben(dep);
        h += '<div class="gwzeile tiefer2">'
           + '<b style="background:' + f.bg + ';color:' + f.fg + '">' + escapeHtmlFt(dep.line) + '</b>'
           + '<div class="rumpf"><div class="halt">'
           + (eigen != null ? 'eigener Wert' : 'wie die Richtung, ' + erbt + ' min') + '</div></div>'
           + '<input type="number" min="0" max="99" placeholder="' + erbt + '"'
           + ' value="' + (eigen != null ? eigen : '') + '"'
           + ' onchange="gehwegLinieSetzen(' + si + ',\'' + k.replace(/'/g, "\\'") + '\',this.value)">'
           + ' <span class="min">min</span></div>';
      });
    });
  });
  h += '<div class="hinweis">Leer lassen heisst: der Wert kommt von der Stufe dar\u00fcber. '
     + 'Das Ger\u00e4t kann heute nur den Wert je Station, Richtung und Linie brauchen noch '
     + 'einen neuen Firmware-Token.</div>';
  el.innerHTML = h;
}

// ---- Features -----------------------------------------------------------------
// Nur Wien hat das (DISPLAY_TYPE_FEATURES chopper und silberpfeil). Bei allen anderen
// Stilen verschwindet der ganze Block, statt leer dazustehen (Paul 22.10.2026).
function fahrzeugZeichnen() {
  const block = document.getElementById('klappFahrzeug');
  const el = block && block.querySelector('.klapp-koerper');
  if (!el) return;
  const sHier = schirme[zeiger];
  const d = sHier && sHier.display;
  const c = d ? stilVon(d) : 0;
  const k = STIL_KANN[parseInt(c, 10)] || {};
  const kann = k.fahrzeug || k.verspaetung || k.blinken;
  block.style.display = kann ? '' : 'none';
  if (!kann) { block.classList.remove('offen'); return; }
  const e = einstFuer(d);
  const di = displays.indexOf(d);
  const unter = document.getElementById('featuresUnter');
  if (unter) {
    const worte = [];
    if (k.blinken) worte.push('Blinken bei 0');
    if (k.verspaetung) worte.push('Versp\u00e4tung');
    if (k.fahrzeug) worte.push('Hochflurer, Niederflur, Klimaanlage');
    unter.textContent = worte.join(', ');
  }
  const schieber = function (wort, zusatz, an, ruf) {
    return '<div class="schieber"><div class="wort">' + wort
         + (zusatz ? '<small>' + zusatz + '</small>' : '') + '</div>'
         + '<button class="schiene' + (an ? ' an' : '') + '" role="switch" aria-checked="' + (an ? 'true' : 'false')
         + '" onclick="' + ruf + '"><span class="kugel"></span></button></div>';
  };
  let h = '';
  // Blinken bei 0, nur Matrix. Kommt am Geraet mit 2.6, aeltere Firmware ueberliest
  // das Feld o folgenlos (Paul 23.10.2026).
  if (k.blinken) {
    // Jeder Knopf zeigt klein, was er tut. Das ersetzt den erklaerenden Satz
    // (Paul 23.10.2026: "einfach im Toggle das zeigen").
    const look = uhrLook(c, d) || { bg: '#000000', fg: '#ffffff' };
    const probe = function (txt, blinkt) {
      const inner = (typeof dvLedTextSvg === 'function') ? dvLedTextSvg(txt, 2, look.fg, true)
                                                         : escapeHtmlFt(txt);
      return '<span class="bprobe" style="background:' + look.bg + '">'
           + '<span class="' + (blinkt ? 'blinkt' : '') + '">' + inner + '</span></span>';
    };
    h += '<label class="feld">Wenn eine Abfahrt bei 0 steht ' + neuBadge('blinken')
       + '</label><div class="schalter">';
    [[0, 'Still', probe('0', false)],
     [1, '0 blinkt', probe('0', true)],
     [2, 'Wie in Berlin', probe('Ziel', true)]].forEach(b => {
      h += '<button class="' + (e.o === b[0] ? 'an' : '') + '"'
         + ' onclick="blinkenSetzen(' + di + ',' + b[0] + ')">' + b[1] + b[2] + '</button>';
    });
    h += '</div>';
  }
  if (k.verspaetung) {
    h += schieber('Versp\u00e4tung herausstechend',
                  'Zeigt "+X" farbig und f\u00e4rbt die Abfahrtszeit',
                  e.d === 1, 'verspaetungSchalten(' + di + ')');
  }
  if (k.fahrzeug) {
    h += schieber('Hochflurer markieren', '', e.h === 1, 'fzSetzen(' + di + ',\'h\')');
    if (e.h === 1) {
      h += schieber('Niederflur-Hinweis blinken',
                    'Markierung pulsiert, wenn ein Niederflur-Fahrzeug naht',
                    e.n === 1, 'fzSetzen(' + di + ',\'n\')');
    }
    h += schieber('Bim+U-Bahn Klima Anzeige', 'Alle Busse in Wien sind schon klimatisiert.',
                  e.k === 1, 'fzSetzen(' + di + ',\'k\')');
  }
  el.innerHTML = h;
}
function fzSetzen(di, feld) {
  const e = einstFuer(displays[di]);
  e[feld] = e[feld] ? 0 : 1;
  allesZeichnen();
}

// Alle Setzer bekommen die Nummer des DISPLAYS, nicht mehr die colour.
function schriftSetzen(di, v) { einstFuer(displays[di]).t = parseInt(v, 10); allesZeichnen(); }
function grundSetzen(di, v) { einstFuer(displays[di]).b = parseInt(v, 10); allesZeichnen(); }
function badgeSetzen(di, v) { einstFuer(displays[di]).u = parseInt(v, 10); allesZeichnen(); }
function blinkenSetzen(di, v) { einstFuer(displays[di]).o = parseInt(v, 10); allesZeichnen(); }

function badgeFahrzeugSetzen(di, bit, an) {
  const e = einstFuer(displays[di]);
  e.v = an ? (e.v | bit) : (e.v & ~bit);
  // Ganz ohne Fahrzeugart bekaeme nichts ein Badge. Dann lieber die Badges ausschalten.
  if (!e.v) { e.v = 4; e.u = 0; }
  allesZeichnen();
}

// Klappbloecke: immer nur einer offen, sonst scrollt man sich tot (Paul 22.10.2026).
function klappSchalten(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const wirdOffen = !el.classList.contains('offen');
  document.querySelectorAll('.klapp.offen').forEach(x => x.classList.remove('offen'));
  if (!wirdOffen) return;
  el.classList.add('offen');
  // Beim Zuklappen des vorherigen rutscht die Seite, darum den neuen Kopf herholen.
  const kopf = el.querySelector('.klapp-kopf');
  if (kopf) kopf.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ---- Eigener Dialog --------------------------------------------------------------------
// Statt alert und confirm: gleiche Schrift, gleiche Kanten, und vor allem freie Knoepfe,
// damit der Dialog gleich einen Ausweg anbieten kann (Paul 22.10.2026).
function matrixSchriftSetzen(di, wert) { einstFuer(displays[di]).f = wert; allesZeichnen(); }
function verspaetungSchalten(di) { const e = einstFuer(displays[di]); e.d = e.d ? 0 : 1; allesZeichnen(); }
function wechselSetzen(di, welches, sekunden) {
  const e = einstFuer(displays[di]);
  e[welches] = Math.round(Math.max(WECHSEL_MIN, Math.min(WECHSEL_MAX, sekunden)) * 10);
  allesZeichnen();
}
function wechselAutomatik(di, automatisch) {
  const e = einstFuer(displays[di]);
  if (automatisch) { e.x = 0; e.y = 0; } else { e.x = e.x || 40; e.y = e.y || 30; }
  e.x = e.x && Math.min(WECHSEL_MAX * 10, Math.max(WECHSEL_MIN * 10, e.x));
  e.y = e.y && Math.min(WECHSEL_MAX * 10, Math.max(WECHSEL_MIN * 10, e.y));
  allesZeichnen();
}
function standzeitSetzen(di, sekunden) {
  const d = displays[di];
  const e = einstFuer(d);
  const mind = zeigtUhr(d) ? STANDZEIT_MIN_UHR : standzeitMindestens(e);
  e.i = Math.max(mind, Math.min(STANDZEIT_MAX, parseInt(sekunden, 10) || 0));
  allesZeichnen();
}
// Helligkeit gilt fuers ganze Geraet, nicht je Display: die Firmware kennt sie als eine
// Einstellung (1 dunkel, 2 mittel, 3 hell).
function helligkeitSetzen(wert) { helligkeit = wert; allesZeichnen(); }

function dialogZeigen(titel, text, knoepfe, art, inhalt) {
  const schleier = document.getElementById('schleier');
  const sinn = document.getElementById('dlgSinn');
  sinn.className = 'sinn ' + (art === 'doppelt' ? 'doppelt' : 'warnung');
  sinn.innerHTML = DLG_SINN[art] || DLG_SINN.warnung;
  document.getElementById('dlgTitel').textContent = titel;
  document.getElementById('dlgText').textContent = text;
  document.getElementById('dlgInhalt').innerHTML = inhalt || '';
  const k = document.getElementById('dlgKnoepfe');
  k.innerHTML = '';
  knoepfe.forEach(b => {
    const el = document.createElement('button');
    el.textContent = b.text;
    if (b.still) el.className = 'still';
    if (b.aus) el.disabled = true;
    el.onclick = () => { if (!b.offen) schleier.classList.remove('an'); if (b.tun) b.tun(); };
    k.appendChild(el);
  });
  schleier.classList.add('an');
}
function sagen(titel, text) { dialogZeigen(titel, text, [{ text: 'Alles klar' }]); }

// ---- Bedienung -----------------------------------------------------------------------
function modusSetzen(m) { modus = m; zeiger = 0; allesZeichnen(); }
function sortierungSetzen(di, wert) {
  const d = displays[di];
  if (!d) return;
  d.sortierung = wert;
  allesZeichnen();
}
function zeitZeilenSetzen(di, wert) {
  const d = displays[di];
  if (!d) return;
  d.zeilen = parseInt(wert, 10) || 3;
  allesZeichnen();
}

function stilSetzen(v) {
  if (v === 'neu') {
    // Der Design-Baukasten fuer eigene Displays steckt noch im alten Konfigurator.
    // Lieber offen sagen als so tun, als waere er hier schon drin.
    sagen('Eigenes Display',
          'Den Baukasten f\u00fcr eigene Designs gibt es bisher nur im alten Konfigurator. '
          + 'Hier kommt er noch.');
    allesZeichnen();
    return;
  }
  const d = displays[zeiger];
  if (d) d.stil = parseInt(v, 10) || 1; else stil = parseInt(v, 10) || 1;
  allesZeichnen();
}

function blaettern(d)   { zeiger = Math.max(0, Math.min(schirme.length - 1, zeiger + d)); allesZeichnen(); }
function linieSchalten(si, k, an) {
  const st = stationen[si];
  if (!st) return;
  // Erste Abwahl: aus „alles" eine echte Auswahl machen, sonst faellt alles weg.
  if (!st.gewaehlt.size) linienAus(st.abfahrten).forEach(l => st.gewaehlt.add(l.name + '|' + l.ziel));
  if (an) st.gewaehlt.add(k); else st.gewaehlt.delete(k);
  allesZeichnen();
}
// Aus dem Pool wird nie etwas entfernt (Paul 22.10.2026). Stationen loescht man im
// Schritt davor, bei der Stationssuche. Die Funktion wartet hier auf diesen Schritt.
function stationWeg(si) { stationen.splice(si, 1); zeiger = 0; allesZeichnen(); }

async function neuLaden() {
  for (const st of stationen) {
    try { abfahrtenSetzen(st, await abfahrten(st.rbl)); } catch (e) { /* alte Daten behalten */ }
  }
  allesZeichnen();
}

// ---- Stationssuche -------------------------------------------------------------------
// Die Stationssuche sitzt im Schritt DAVOR (Paul 22.10.2026). Diese Oberflaeche
// bekommt die Stationen uebergeben und kuemmert sich nur noch um die Displays.
// stationNehmen ist die Uebergabestelle und bleibt deshalb erhalten.
async function stationNehmen(rbl, name, lat, lon, netz) {
  if (stationen.some(s => s.rbl === rbl)) return;
  const st = { rbl, name, netz: netz || 'WL', abfahrten: [], gewaehlt: new Set(),
               lat: (lat != null ? Number(lat) : null), lon: (lon != null ? Number(lon) : null) };
  stationen.push(st);
  allesZeichnen();
  try { st.abfahrten = await abfahrten(rbl); } catch (e) { /* bleibt leer */ }
  allesZeichnen();
}

// ---- Stadtplan im Hintergrund ---------------------------------------------------------
// Nur Schmuck: keine Klicks, entfaerbt, und er folgt der gerade gewaehlten Station,
// sobald wir deren Koordinaten kennen (die Stationssuche liefert sie mit).
let karte = null;
function karteAufbauen() {
  if (karte || typeof L === 'undefined') return;
  karte = L.map('karte', {
    zoomControl: false, attributionControl: true, dragging: false, scrollWheelZoom: false,
    doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false
  }).setView([48.2082, 16.3738], 14);   // Wien als Ausgangspunkt
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(karte);
}
function karteAufStation(st) {
  if (!karte || !st || st.lat == null || st.lon == null) return;
  karte.setView([st.lat, st.lon], 15, { animate: true });
}

// ---- Raumwirkung der Wisch-Leiste -----------------------------------------------------
// Je weiter eine Karte von der Mitte weg ist, desto staerker ist sie weggedreht und
// zurueckgesetzt. Rein optisch, damit erkennbar ist, dass es seitwaerts weitergeht.
// Gemessen wird die LAYOUT-Lage der Karte, nicht ihre sichtbare: getBoundingClientRect
// rechnet die Drehung und die Verkleinerung mit, die diese Funktion selbst gerade gesetzt
// hat. Daraus entstand eine Rueckkopplung, die Karte zitterte beim Wischen. offsetLeft
// bleibt von der Verformung unberuehrt (Paul 22.10.2026).
let raumStand = null;          // letzter Scrollwert, zu dem gerechnet wurde
// Auf schmalen Bildschirmen steht eine Nachbarkarte genau bei b = 1, und dort schiebt die
// Kette in raumWirkung sie weiter hinaus: translateZ steht vor der Drehung, die Drehung macht
// aus der Tiefe einen Versatz nach aussen. Bei 430 px Breite blieb von der naechsten Karte
// 1 Pixel im Bild, bei 375 px keiner, und niemand sah, dass es seitwaerts weitergeht (Paul
// 23.10.2026). Der Zug holt die innere Kante der Nachbarn so weit herein, dass SPITZE Pixel
// zu sehen sind. Nur aus Layout-Werten gerechnet, wie raumWirkung selbst.
const SPITZE = 56;
function nachbarZug(streifen) {
  const karten = streifen.children;
  if (karten.length < 2) return 0;
  const breite = streifen.clientWidth;
  const abstand = karten[1].offsetLeft - karten[0].offsetLeft;   // Mitte zu Mitte
  if (2 * abstand < breite) return 0;   // breiter Schirm: die Nachbarn sind ohnehin zu sehen
  // Wo die innere Kante bei b = 1 ohne Zug landet: dieselbe Kette wie in raumWirkung,
  // scale(0.86), translateZ(-90), rotateY(-26deg), Perspektive 1100.
  const w = Math.PI * 26 / 180;
  const x = -karten[0].offsetWidth / 2 * 0.86, z = -90;
  const xr = x * Math.cos(w) - z * Math.sin(w);
  const zr = x * Math.sin(w) + z * Math.cos(w);
  const f = 1100 / (1100 - zr);
  const spitze = Math.min(SPITZE, (breite - karten[0].offsetWidth) / 2 - 8);
  // Die Nachbar-Mitte liegt bei breite / 2 + abstand, ihre Kante soll bei breite - spitze liegen.
  return Math.max(0, xr - (breite / 2 - spitze - abstand) / f);
}
function raumWirkung(erzwingen) {
  const streifen = document.getElementById('streifen');
  if (!streifen) return;
  // Unter einem halben Pixel ist nichts zu sehen, aber jedes Rechnen kann ein neues
  // Einrasten ausloesen. Darum nur bei echter Bewegung, ausser der Aufrufer besteht
  // darauf (nach einem Neuaufbau oder beim Fenstergroesse aendern).
  if (!erzwingen && raumStand !== null && Math.abs(streifen.scrollLeft - raumStand) < 0.5) return;
  raumStand = streifen.scrollLeft;
  const mitte = streifen.scrollLeft + streifen.clientWidth / 2;
  const zug = nachbarZug(streifen);
  for (const k of streifen.children) {
    const flaeche = k.querySelector('.raum') || k;
    const d = (k.offsetLeft + k.offsetWidth / 2 - mitte) / (streifen.clientWidth / 2);   // -1 … 0 … 1
    const b = Math.max(-1, Math.min(1, d));
    const dreh  = (-b * 26).toFixed(2);
    const tiefe = (-Math.abs(b) * 90).toFixed(1);
    const klein = (1 - Math.abs(b) * 0.14).toFixed(3);
    flaeche.style.transform = 'perspective(1100px) translateX(' + (-b * zug).toFixed(1) + 'px) rotateY(' + dreh
                            + 'deg) translateZ(' + tiefe + 'px) scale(' + klein + ')';
    flaeche.style.filter = 'saturate(' + (1 - Math.abs(b) * 0.45).toFixed(2) + ') brightness(' + (1 - Math.abs(b) * 0.1).toFixed(2) + ')';
    k.style.zIndex = String(100 - Math.round(Math.abs(b) * 50));
  }
}

// ---- Start ---------------------------------------------------------------------------
dvHostLoadDisplaySettings('c' + stil + '|r' + zeilen);
karteAufbauen();
versionHolen();   // im Hintergrund, die Oberflaeche wartet nicht darauf
// Abfahrten halten sich selbst frisch, darum braucht es keinen Knopf (Paul 22.10.2026).
// Alle 60 Sekunden, und nur wenn das Fenster ueberhaupt sichtbar ist.
setInterval(function () { if (!document.hidden) neuLaden(); }, 60000);
// Die Uhr tickt sekuendlich, aber ohne die Seite neu zu bauen: nur der Text wechselt.
setInterval(function () {
  if (document.hidden) return;
  const t = uhrText();
  document.querySelectorAll('.uhr-zeit').forEach(function (e) {
    const fs = parseFloat(e.dataset.fs) || parseFloat(getComputedStyle(e).fontSize) || 34;
    const breite = parseFloat(e.dataset.breite) || 320;
    e.textContent = t;
    e.style.left = uhrAnker(t, fs, breite) + 'px';
  });
  // Matrix zeichnet die Uhr als Pixel-SVG, das laesst sich nicht per Text tauschen:
  // dort den Streifen neu zeichnen, aber nur wenn eine LED-Uhr sichtbar ist.
  const ledUhr = displays.some(d => (hatUhrZeile(d) || zeigtUhr(d))
                 && [2, 15, 18, 21, 23].indexOf(parseInt(stilVon(d), 10)) >= 0);
  if (ledUhr) streifenZeichnen();
}, 1000);
// Klebt die Leiste oben? Dann Grund und Schatten (Paul 23.10.2026). Dazu ihre Hoehe als
// --leiste, damit scrollIntoView-Ziele unter ihr landen statt dahinter.
function leisteKlebt() {
  const streifen = document.getElementById('streifen');
  if (!streifen) return;
  streifen.classList.toggle('klebt', window.scrollY > 0 && streifen.getBoundingClientRect().top <= 0.5);
  document.documentElement.style.setProperty('--leiste', streifen.offsetHeight + 'px');
}
(function wischBeobachten() {
  const streifen = document.getElementById('streifen');
  let laeuft = false;
  const takt = () => { laeuft = false; raumWirkung(); };
  streifen.addEventListener('scroll', () => {
    if (!laeuft) { laeuft = true; requestAnimationFrame(takt); }
  }, { passive: true });
  window.addEventListener('resize', function () { raumWirkung(true); });
  let klebLaeuft = false;
  window.addEventListener('scroll', () => {
    if (!klebLaeuft) { klebLaeuft = true; requestAnimationFrame(() => { klebLaeuft = false; leisteKlebt(); }); }
  }, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(leisteKlebt).observe(streifen);
  leisteKlebt();
})();
// Welche Linien gewaehlt sind, lesen wir aus dem Linien-Feld von masterrow und timerow.
// Das ist fuer ALLE Netze dieselbe Form und genau das, was auch das Geraet sieht. Der
// Konfigurator kennt dafuer sechs Mechanismen (directions, filter, allDepartures,
// Suffixe in der Stop-Id, lineGroups, eigene Netznamen) - die muenden alle hier hinein,
// also muessen wir sie nicht einzeln nachbauen (Paul 23.10.2026).
//   Feld '*' oder leer = alle Abfahrten, kein Filter
//   sonst Tokens mit Komma, '+' verbindet Richtungen zu EINER Zeile (Gruppe),
//   '>' trennt Linie und Richtung (Richtungs-Id oder Zieltext)
function wahlAusZeilen(zeilen) {
  const raus = new Map();
  String(zeilen || '').split(';').forEach(seg => {
    seg = seg.trim();
    if (!seg) return;
    const teile = seg.split('|');
    if (teile.length < 2) return;
    const feld = teile[1].trim();
    const alle = !feld || feld === '*';
    const gruppen = alle ? [] : feld.split(',').map(tok =>
      tok.split('+').map(m => {
        const st = m.split('>');
        return { linie: (st[0] || '').trim(), richtung: (st[1] || '').trim() };
      }).filter(x => x.linie)
    ).filter(g => g.length);
    // Ein Segment kann mehrere rbls tragen (Wien). Die Linien gelten dann fuer alle,
    // und was an einem Bahnsteig nicht faehrt, findet beim Abgleich ohnehin nichts.
    teile[0].split(',').forEach(rbl => {
      rbl = rbl.trim();
      if (!rbl) return;
      const e = raus.get(rbl) || { alle: false, gruppen: [] };
      if (alle) e.alle = true; else e.gruppen = e.gruppen.concat(gruppen);
      raus.set(rbl, e);
    });
  });
  return raus;
}

// Stationen, die der Konfigurator uebergibt. catchit-cities legt sie beim Klick auf
// "Feintuning" in den sessionStorage und wechselt hierher (Paul 23.10.2026). Eine
// Wien-Station kann mehrere Bahnsteige tragen, die werden hier zu je einer Station.
function uebergabeHolen() {
  let roh = null;
  try { roh = JSON.parse(sessionStorage.getItem('catchit_feintuning') || 'null'); } catch (e) {}
  if (!roh || !roh.stationen || !roh.stationen.length) return null;
  const wahl = wahlAusZeilen((roh.masterrow || '') + ';' + (roh.timerow || ''));
  const raus = [];
  roh.stationen.forEach(st => {
    // Rueckfall, falls keine Config berechnet wurde: die Liniennamen aus filter.
    const ausFilter = String(st.filter || '').split(',').map(x => x.trim()).filter(Boolean)
                        .map(x => [{ linie: x, richtung: '' }]);
    String(st.rbl || '').split(',').forEach(rbl => {
      rbl = rbl.trim();
      if (!rbl) return;
      const w = wahl.get(rbl) || null;
      raus.push({ rbl: rbl, name: st.name || rbl, netz: st.netz || 'WL',
                  alle: !!st.alle || !!(w && w.alle),
                  wahl: (w && w.gruppen.length) ? w.gruppen : ausFilter,
                  richtungen: st.richtungen || [] });
    });
  });
  return { stationen: raus, helligkeit: roh.helligkeit, masterrow: roh.masterrow || '' };
}

// Welches Ziel der Station ist gemeint? Zuerst genau, sonst eines, das ineinander
// steckt: der Konfigurator kuerzt Ziele anders als die Abfahrts-API.
function zielTreffer(linien, ziel) {
  const z = String(ziel || '').trim().toLowerCase();
  if (!z) return null;
  return linien.find(x => x.ziel.toLowerCase() === z)
      || linien.find(x => x.ziel.toLowerCase().indexOf(z) >= 0
                       || z.indexOf(x.ziel.toLowerCase()) >= 0)
      || null;
}

// Ein Linien-Token der Config auf die echten Abfahrten abbilden. Drei Faelle:
//   "U1>Leopoldau"  Zieltext, direkt abgleichbar
//   "U1>301"        Richtungs-Id, in den Abfahrten gibt es die nicht: dann hilft der
//                   Zieltext aus der Uebergabe (richtungen)
//   "105"           keine Richtung, z.B. Linz und andere HAFAS-Netze: die Linie gilt
//                   in alle Richtungen
function tokenTreffer(linien, m, richtungen) {
  const l = String(m.linie || '').trim().toUpperCase();
  const gleich = linien.filter(x => x.name.trim().toUpperCase() === l);
  if (!gleich.length) return [];
  const r = String(m.richtung || '').trim();
  if (r && !/^\d+$/.test(r)) {
    const t = zielTreffer(gleich, r);
    return t ? [t] : gleich;
  }
  const ziele = (richtungen || [])
    .filter(x => String(x.line || '').trim().toUpperCase() === l)
    .map(x => String(x.ziel || '').trim()).filter(Boolean);
  if (ziele.length) {
    const raus = [];
    ziele.forEach(z => { const t = zielTreffer(gleich, z); if (t && raus.indexOf(t) < 0) raus.push(t); });
    if (raus.length) return raus;
  }
  return gleich;
}

(async function start() {
  // Testaufbau, solange niemand etwas uebergibt: fuenf Wiener Stationen mit je einer
  // Linie. Damit sieht man sofort, wie aus Zeilen Seiten werden und wie die Stile wirken.
  const TEST = [
    { rbl: '4111', name: 'Stephansplatz', linie: 'U1', ziel: 'Leopoldau',   lat: 48.2083, lon: 16.3725 },
    { rbl: '4201', name: 'Schottenring',  linie: 'U2', ziel: 'Karlsplatz',  lat: 48.2163, lon: 16.3724 },
    { rbl: '4921', name: 'Westbahnhof',   linie: 'U3', ziel: 'Simmering',   lat: 48.1966, lon: 16.3386 },
    { rbl: '4421', name: 'Karlsplatz',    linie: 'U4', ziel: 'Heiligenstadt', lat: 48.2005, lon: 16.3690 },
    { rbl: '4621', name: 'Thaliastra\u00dfe', linie: 'U6', ziel: 'Floridsdorf', lat: 48.2098, lon: 16.3368 }
  ];
  const ueber = uebergabeHolen();
  if (ueber && ueber.helligkeit) helligkeit = ueber.helligkeit;

  const liste = ueber ? ueber.stationen
                      : TEST.map(e => ({ rbl: e.rbl, name: e.name, netz: 'WL', alle: false,
                                         lat: e.lat, lon: e.lon,
                                         wahl: [[{ linie: e.linie, richtung: e.ziel }]],
                                         richtungen: [{ line: e.linie, ziel: e.ziel }] }));
  for (const e of liste) {
    const st = { rbl: e.rbl, name: e.name, netz: e.netz || 'WL', abfahrten: [],
                 gewaehlt: new Set(), lat: e.lat, lon: e.lon,
                 vorgabe: e.richtungen && e.richtungen[0]
                          ? { line: e.richtungen[0].line, dest: e.richtungen[0].ziel } : null };
    stationen.push(st);
    // Mehrere Anfragen direkt hintereinander laufen schnell in die Ratengrenze der API.
    // Ein leeres catch wuerde den Fehler verschlucken und die Seite bliebe stumm leer.
    try {
      abfahrtenSetzen(st, await abfahrten(e.rbl));
    } catch (err) {
      await new Promise(r => setTimeout(r, 1500));
      try { abfahrtenSetzen(st, await abfahrten(e.rbl)); }
      catch (err2) { st.fehler = String((err2 && err2.message) || err2); abfahrtenSetzen(st, []); }
    }
    // Angehakt wird, was der Konfigurator gewaehlt hat. "Alle Abfahrten" laesst die
    // Auswahl leer, das heisst in dieser Oberflaeche ohnehin "alles".
    if (!e.alle && e.wahl && e.wahl.length) {
      const linien = linienAus(st.abfahrten);
      const paare = [];
      e.wahl.forEach(gruppe => {
        const keys = [];
        gruppe.forEach(m => {
          tokenTreffer(linien, m, e.richtungen).forEach(treffer => {
            const k = treffer.name + '|' + treffer.ziel;
            st.gewaehlt.add(k);
            if (keys.indexOf(k) < 0) keys.push(k);
          });
        });
        // Nur ein Token mit '+' ist eine Gruppe. Dass eine Linie in zwei Richtungen
        // faehrt, macht noch keine gemeinsame Zeile.
        if (gruppe.length > 1 && keys.length > 1) paare.push(keys);
      });
      if (paare.length) st.paare = paare;
    }
  }
  allesZeichnen();
  // Gruppen aus der Uebergabe anlegen. Die Verteilung hat die Zeilen einzeln gezaehlt
  // und kann Mitglieder derselben Gruppe auf zwei Displays gelegt haben, darum holen
  // wir sie auf das Display des ersten Mitglieds zurueck. Als Gruppe zaehlen sie dann
  // ohnehin nur eine Zeile. gruppenPruefen raeumt auf, was nicht mehr passt.
  let gruppiert = false;
  stationen.forEach(st => (st.paare || []).forEach(keys => {
    const d = displays.find(x => x.richtungen.indexOf(keys[0]) >= 0);
    if (!d || gruppeVon(d, keys[0])) return;
    keys.slice(1).forEach(k => {
      displays.forEach(x => {
        if (x !== d) x.richtungen = x.richtungen.filter(y => y !== k);
      });
      if (d.richtungen.indexOf(k) < 0) d.richtungen.push(k);
    });
    if (!d.gruppen) d.gruppen = [];
    d.gruppen.push(keys.slice());
    gruppiert = true;
  }));
  if (gruppiert) { displays.forEach(gruppenPruefen); allesZeichnen(); }

})();
